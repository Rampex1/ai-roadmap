items:
  - id: f9-activation-functions-01
    type: mcq
    prompt: "Why do neural networks put a non-linear activation function between layers?"
    explanation: "Without it, stacked linear layers collapse into one linear layer, so extra depth adds no expressive power."
    options:
      - text: Without it, any stack of layers is equivalent to a single linear layer
        correct: true
        why: (XW₁ + b₁)W₂ + b₂ = X(W₁W₂) + (b₁W₂ + b₂), one linear layer.
      - text: It makes the forward pass faster
        why: It adds a little work; speed is not the reason.
      - text: It keeps the weights between 0 and 1
        why: Activations act on the pre-activations, not on the weights.
      - text: It is needed so that gradients can be computed at all
        why: Linear layers have perfectly good gradients; the problem is what they can represent.
  - id: f9-activation-functions-02
    type: numeric
    prompt: "What is the derivative of $\\tanh$ at $z$ where $\\tanh z = 0.6$?"
    answer: 0.64
    tol: 0.0001
    explanation: "tanh′(z) = 1 − tanh²(z) = 1 − 0.36 = 0.64."
  - id: f9-activation-functions-03
    type: numeric
    prompt: "What is the largest possible value of the sigmoid's derivative $\\sigma'(z)$?"
    answer: 0.25
    tol: 0.0001
    explanation: "σ′ = σ(1 − σ) is largest when σ = 0.5, at z = 0, giving 0.5 × 0.5 = 0.25."
  - id: f9-activation-functions-04
    type: output
    prompt: "What does this print?"
    code: |
      import numpy as np
      z = np.array([-2.0, 0.0, 3.0])
      print(np.maximum(0, z), np.max(z))
    answer: "[0. 0. 3.] 3.0"
    explanation: "np.maximum compares element by element with 0 (that is ReLU); np.max returns the single largest element."
  - id: f9-activation-functions-05
    type: output
    prompt: "What does this print?"
    code: |
      import numpy as np
      z = np.array([-1.5, 0.0, 0.2, 4.0])
      print((z > 0).astype(float))
    answer: "[0. 0. 1. 1.]"
    explanation: "This is ReLU's derivative: 1 where z > 0 and 0 elsewhere, including 0 at exactly z = 0 by convention."
  - id: f9-activation-functions-06
    type: mcq
    prompt: "A deep network uses sigmoid activations in all 20 hidden layers, and its first layers barely change during training. What is the most likely reason?"
    explanation: "Backpropagation multiplies the activations' slopes layer by layer. Each sigmoid slope is at most 0.25, so the gradient reaching the first layers is tiny: the vanishing gradient problem."
    options:
      - text: Products of many sigmoid slopes (each at most 0.25) make the early gradients vanish
        correct: true
        why: Even the best case gives 0.25 to the power of 20, about 10 to the power of −12.
      - text: The learning rate is too large
        why: A too-large rate causes divergence, not frozen early layers.
      - text: The sigmoid is linear, so the layers collapse
        why: The sigmoid is non-linear; the layers do not collapse.
      - text: The first layers have too few parameters
        why: Parameter count does not explain why their gradients are tiny.
  - id: f9-activation-functions-07
    type: mcq
    prompt: "What is a dead ReLU unit?"
    explanation: "If a ReLU unit's pre-activation is negative for every input, its output and its slope are 0 everywhere, so no gradient reaches its weights and it never recovers."
    options:
      - text: A unit whose input is negative for every example, so its gradient is always 0 and it stops learning
        correct: true
        why: ReLU's slope is 0 for negative inputs, so nothing updates its weights.
      - text: A unit whose output is always exactly 1
        why: ReLU outputs are not capped at 1.
      - text: A unit whose weights have grown very large
        why: Large weights do not by themselves stop ReLU from passing gradient.
      - text: A unit that has been removed by dropout for good
        why: Dropout removes units only temporarily, on each training step.
  - id: f9-activation-functions-08
    type: multi
    prompt: "Which statements about the XOR function of two bits are true? Select all that apply."
    explanation: "XOR's 1s sit on opposite corners of the square, so no line separates them from the 0s. A hidden layer re-maps the points so a line can, as the hand-built ReLU network shows."
    options:
      - text: No single neuron can compute it, whatever its weights
        correct: true
        why: A neuron's boundary is a line, and the four inequalities have no solution.
      - text: A network with one hidden layer of two ReLU units can compute it exactly
        correct: true
        why: h₁ = ReLU(x₁ + x₂), h₂ = ReLU(x₁ + x₂ − 1), y = h₁ − 2h₂ does it.
      - text: A single neuron could compute it with a tanh activation instead of a sigmoid
        why: Changing the activation does not change the straight-line boundary w·x + b = 0.
      - text: Two stacked linear layers without an activation can compute it
        why: They collapse into one linear layer, which cannot.
  - id: f9-activation-functions-09
    type: mcq
    prompt: "For the layers $W_1$ of shape (3, 5), $\\mathbf{b}_1$ of shape (5,), $W_2$ of shape (5, 2) and $\\mathbf{b}_2$ of shape (2,) with no activation in between, what is the bias of the equivalent single layer?"
    explanation: "Expanding (XW₁ + b₁)W₂ + b₂ gives X(W₁W₂) + (b₁W₂ + b₂). The first bias passes through W₂."
    options:
      - text: "b₁W₂ + b₂, of shape (2,)"
        correct: true
        why: The first bias is multiplied by W₂ like everything else from the first layer.
      - text: "b₁ + b₂"
        why: The shapes (5,) and (2,) do not even match; b₁ must go through W₂.
      - text: "b₂ only"
        why: That drops the contribution of the first layer's bias.
      - text: "W₁W₂ + b₂"
        why: W₁W₂ is the equivalent weight matrix, not the bias.
  - id: f9-activation-functions-10
    type: cloze
    prompt: "When $|z|$ is large, sigmoid and tanh flatten out and their slopes approach 0. This is called ______ (one word)."
    accept: ["saturation", "saturating", "saturate", "saturates"]
    explanation: "A saturated unit passes almost no gradient back, which slows or stops learning."
