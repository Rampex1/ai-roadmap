items:
  - id: f9-forward-pass-01
    type: mcq
    prompt: "A layer has 10 inputs and 4 neurons, and the batch $X$ has shape (32, 10). With the course convention $Z = XW + \\mathbf{b}$, what shape is $W$?"
    explanation: "W must map 10 inputs to 4 outputs with examples in rows: (32, 10) @ (10, 4) gives (32, 4)."
    options:
      - text: "(10, 4)"
        correct: true
        why: Inner dimensions 10 and 10 match, and the result has one column per neuron.
      - text: "(32, 10)"
        why: That is the shape of the batch X.
      - text: "(32, 4)"
        why: That is the shape of Z, not of W.
      - text: "(4, 10)"
        why: That is PyTorch's storage layout, used with a transpose; (32, 10) @ (4, 10) fails.
  - id: f9-forward-pass-02
    type: output
    prompt: "What does this print?"
    code: |
      import numpy as np
      X = np.zeros((8, 3))
      W1, b1 = np.zeros((3, 5)), np.zeros(5)
      W2, b2 = np.zeros((5, 2)), np.zeros(2)
      H = np.maximum(0, X @ W1 + b1)
      print(H.shape, (H @ W2 + b2).shape)
    answer: "(8, 5) (8, 2)"
    explanation: "(8, 3) @ (3, 5) gives (8, 5); (8, 5) @ (5, 2) gives (8, 2). The batch dimension 8 is unchanged."
  - id: f9-forward-pass-03
    type: numeric
    prompt: "How many parameters (weights plus biases) does an MLP with layer sizes [4, 10, 3] have?"
    answer: 83
    tol: 0
    explanation: "(4 + 1) × 10 + (10 + 1) × 3 = 50 + 33 = 83."
  - id: f9-forward-pass-04
    type: numeric
    prompt: "How many parameters does an MLP with layer sizes [784, 128, 10] have?"
    answer: 101770
    tol: 0
    explanation: "785 × 128 + 129 × 10 = 100,480 + 1,290 = 101,770."
  - id: f9-forward-pass-05
    type: mcq
    prompt: "In the matrix $Z = XW + \\mathbf{b}$ for one layer, what is entry $Z_{ij}$?"
    explanation: "Row i of X is example i and column j of W holds neuron j's weights, so Z_ij is neuron j's pre-activation on example i."
    options:
      - text: Neuron i's output for example j
        why: Rows index examples and columns index neurons, not the other way round.
      - text: Neuron j's weighted sum plus bias for example i
        correct: true
        why: Row i of X dotted with column j of W, plus b_j.
      - text: The weight from input i to neuron j
        why: That is W_ij, not Z_ij.
      - text: The average activation of neuron j over the batch
        why: No averaging happens in the forward pass of a layer.
  - id: f9-forward-pass-06
    type: mcq
    prompt: "Why does the last layer of a classification MLP usually have **no** ReLU?"
    explanation: "The last layer outputs logits, which must be free to be negative or positive; the loss function turns them into probabilities. A ReLU would clip every negative score to 0."
    options:
      - text: Its outputs are logits that must be able to take any real value; the loss turns them into probabilities
        correct: true
        why: Clipping negative scores to 0 would stop the model saying a class is unlikely.
      - text: ReLU cannot be applied to more than one output
        why: ReLU works element by element on any shape.
      - text: The last layer has no weights
        why: It has weights and biases like every other layer.
      - text: To save computation
        why: ReLU is cheap; the reason is what the outputs must represent.
  - id: f9-forward-pass-07
    type: mcq
    prompt: "`X @ W` raises `ValueError: matmul: ... (size 16 is different from 2)` where `X` has shape (5, 2). What is wrong?"
    explanation: "Matrix multiplication needs X's columns to equal W's rows. W has 16 rows, so it is the weight matrix of a layer expecting 16 inputs, not 2."
    options:
      - text: W has 16 rows, so it expects 16 inputs per example, but X has only 2 features
        correct: true
        why: The inner dimensions must match; this W belongs to a later layer.
      - text: The batch has too few examples
        why: The batch size is never part of the inner dimension.
      - text: The bias was not added
        why: The error is raised by the product, before any bias is added.
      - text: W must be transposed whenever the batch size is not 16
        why: The batch size does not appear in W at all.
  - id: f9-forward-pass-08
    type: multi
    prompt: "For a batch $X$ of shape (n, d) going through a layer of m neurons, which statements are true? Select all that apply."
    explanation: "The bias has one entry per neuron and broadcasts over the n rows; the output has n rows and m columns; column j is neuron j's output on every example; changing n changes no parameter shape."
    options:
      - text: Changing the batch size n requires a different weight matrix
        why: The same W works for any n; that is why we can train on mini-batches and predict on one example.
      - text: The bias vector has shape (m,) and is added to every row
        correct: true
        why: Broadcasting adds the same bias vector to each example.
      - text: The weight matrix has n rows
        why: W has d rows, one per input feature; it does not depend on the batch size.
      - text: The output has shape (n, m)
        correct: true
        why: One row per example, one column per neuron.
  - id: f9-forward-pass-09
    type: order
    prompt: "Put the steps of one hidden layer's forward pass in order."
    explanation: "Take the previous activations, multiply by W, add the bias, then apply the activation; the result is the next layer's input."
    items:
      - "Take the previous layer's activations A (the input X for the first layer)"
      - "Multiply by the weight matrix: A @ W"
      - "Add the bias vector b"
      - "Apply the activation function, such as ReLU"
      - "Pass the result on as the next layer's input"
  - id: f9-forward-pass-10
    type: cloze
    prompt: "The raw, unnormalised class scores output by the last layer of a classifier are called ______."
    accept: [ "logits", "logit" ]
    explanation: "Logits become probabilities only after a softmax (or a sigmoid for one output)."
