items:
  - id: f2-reshape-and-random-01
    type: output
    prompt: "What does this print?"
    code: |
      import numpy as np
      print(np.arange(6).reshape(2, 3))
    answer: |
      [[0 1 2]
       [3 4 5]]
    explanation: "reshape fills the new shape row by row: the first three numbers form row 0, the next three row 1."
  - id: f2-reshape-and-random-02
    type: output
    prompt: "What does this print?"
    code: |
      import numpy as np
      print(np.zeros(24).reshape(4, -1).shape)
    answer: "(4, 6)"
    explanation: "-1 means infer this size: 24 elements in 4 rows leaves 6 columns."
  - id: f2-reshape-and-random-03
    type: mcq
    prompt: "What happens with `np.arange(10).reshape(3, -1)`?"
    explanation: "reshape must keep the number of elements. 10 is not divisible by 3, so no column count works and NumPy raises a ValueError."
    options:
      - text: It raises a ValueError
        correct: true
        why: 10 elements cannot be split into 3 equal rows.
      - text: It gives shape (3, 3) and drops the last element
        why: reshape never drops data; it only rearranges it.
      - text: It gives shape (3, 4) and pads with zeros
        why: reshape never invents data either.
  - id: f2-reshape-and-random-04
    type: output
    prompt: "What does this print?"
    code: |
      import numpy as np
      a = np.array([1, 2])
      b = np.array([3, 4])
      print(np.stack([a, b], axis=1))
    answer: |
      [[1 3]
       [2 4]]
    explanation: "Stacking along a new axis 1 puts a and b side by side as columns, giving shape (2, 2)."
  - id: f2-reshape-and-random-05
    type: mcq
    prompt: "`X1` and `X2` both have shape (100, 5): the same 100 examples, with 5 different features each. How do you join them into one (100, 10) table?"
    explanation: "Adding features means adding columns, which is concatenation along axis 1."
    options:
      - text: "np.concatenate([X1, X2], axis=1)"
        correct: true
        why: Joining along the column axis gives 100 rows of 10 features.
      - text: "np.concatenate([X1, X2], axis=0)"
        why: That stacks the rows, giving (200, 5), which means more examples, not more features.
      - text: "np.stack([X1, X2])"
        why: stack creates a new axis, giving (2, 100, 5).
  - id: f2-reshape-and-random-06
    type: output
    prompt: "What does this print?"
    code: |
      import numpy as np
      v = np.array([5, 6, 7])
      print(v[:, None].shape, v.T.shape)
    answer: "(3, 1) (3,)"
    explanation: "Indexing with None adds an axis of size 1, making a column. Transposing a 1D array does nothing, because it has only one axis."
  - id: f2-reshape-and-random-07
    type: multi
    prompt: "Which statements about `rng = np.random.default_rng(42)` are true?"
    explanation: "A seeded generator gives the same sequence every run, each call advances it, and integers excludes the high value."
    options:
      - text: Rerunning the whole script gives the same random numbers
        correct: true
        why: The seed fixes the starting state, so the sequence is reproducible.
      - text: "rng.integers(1, 7, size=10) can produce the value 6 but never 7"
        correct: true
        why: The high value is excluded, so this simulates a die.
      - text: Calling rng.random(3) twice in a row gives the same three numbers both times
        why: Each call moves the generator forward, so the second call gives new numbers.
      - text: The seed 42 makes the numbers less random than other seeds
        why: Any seed gives an equally good sequence; 42 is just a popular choice.
  - id: f2-reshape-and-random-08
    type: mcq
    prompt: "You want to shuffle a dataset before splitting it. Why do you permute the row positions once and index both `X` and `y` with them, rather than shuffling `X` and `y` separately?"
    explanation: "Separate shuffles put the rows of X and the labels of y in different orders, so examples get the wrong labels."
    options:
      - text: Separate shuffles would break the pairing between each example and its label
        correct: true
        why: Using the same positions for both keeps row i of X with label i of y.
      - text: Shuffling twice is too slow
        why: Speed is not the issue; correctness is.
      - text: NumPy cannot shuffle a 2D array
        why: It can, but that does not keep X and y aligned.
  - id: f2-reshape-and-random-09
    type: numeric
    prompt: "`x = rng.normal(loc=50, scale=5, size=100_000)`. Roughly what value should `x.std()` be close to?"
    answer: 5
    tol: 0.2
    explanation: "`scale` is the standard deviation of the normal distribution, so a large sample's std is close to 5 (and its mean close to 50)."
  - id: f2-reshape-and-random-10
    type: cloze
    prompt: "The number you pass to `np.random.default_rng(...)` so that the same random numbers come out every run is called the ____ ."
    accept: ["seed", "random seed"]
    explanation: "A fixed seed makes random results reproducible."
