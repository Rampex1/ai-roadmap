items:
  - id: f1-tuples-and-sets-01
    type: output
    prompt: "What does this print?"
    code: |
      a, b, c = (1, 2, 3)
      a, c = c, a
      print(a, b, c)
    answer: "3 2 1"
    explanation: "Unpacking gives a=1, b=2, c=3. The swap builds (c, a) = (3, 1) first, then assigns a=3 and c=1."
  - id: f1-tuples-and-sets-02
    type: output
    prompt: "What does this print?"
    code: |
      print(len({3, 1, 3, 2, 1}))
    answer: "3"
    explanation: "A set keeps only unique items: {1, 2, 3}."
  - id: f1-tuples-and-sets-03
    type: mcq
    prompt: "What does `x = {}` create?"
    explanation: "Empty curly braces make an empty dictionary. For an empty set, write `set()`."
    options:
      - text: An empty dictionary
        correct: true
        why: Curly braces with nothing in them are a dict, for historical reasons.
      - text: An empty set
        why: An empty set must be written set(), because {} was already taken by dicts.
      - text: An empty tuple
        why: An empty tuple is ().
  - id: f1-tuples-and-sets-04
    type: multi
    prompt: "Which of these can be used as dictionary keys?"
    explanation: "Keys must be immutable. Strings, numbers and tuples of immutable values qualify; lists and sets do not."
    options:
      - text: "(2, 3)"
        correct: true
        why: Tuples are immutable, so a coordinate pair makes a fine key.
      - text: '"label"'
        correct: true
        why: Strings are immutable.
      - text: "42"
        correct: true
        why: Numbers are immutable.
      - text: "[2, 3]"
        why: Lists are mutable, so they cannot be keys.
  - id: f1-tuples-and-sets-05
    type: output
    prompt: "What does this print?"
    code: |
      a = {1, 2, 3, 4}
      b = {3, 4, 5}
      print(sorted(a & b), sorted(a - b))
    answer: "[3, 4] [1, 2]"
    explanation: "`&` keeps items in both sets; `a - b` keeps items in a that are not in b."
  - id: f1-tuples-and-sets-06
    type: mcq
    prompt: "What is `type((7))`?"
    explanation: "Parentheses alone just group an expression; it is the comma that makes a tuple. `(7,)` is a one-item tuple."
    options:
      - text: int
        correct: true
        why: (7) is just 7 in parentheses.
      - text: tuple
        why: A one-item tuple needs a trailing comma, (7,).
      - text: list
        why: Lists use square brackets.
  - id: f1-tuples-and-sets-07
    type: mcq
    prompt: "You need to check, millions of times, whether a user ID is in a large collection of known IDs. Which collection is best?"
    explanation: "Membership tests on a set (or dict keys) are fast regardless of size, while a list is searched item by item."
    options:
      - text: A set
        correct: true
        why: x in some_set takes about the same time however many items there are.
      - text: A list
        why: x in some_list checks items one by one, which gets slow for large lists.
      - text: A tuple
        why: Tuples are searched item by item, just like lists.
  - id: f1-tuples-and-sets-08
    type: output
    prompt: "What does this print?"
    code: |
      def stats(xs):
          return min(xs), max(xs)

      result = stats([4, 1, 9])
      print(result, result[1])
    answer: "(1, 9) 9"
    explanation: "Returning two values returns one tuple. `result[1]` is its second item."
  - id: f1-tuples-and-sets-09
    type: cloze
    prompt: "Writing `x, y = point` to pull a tuple apart into separate names is called ____ ."
    explanation: "This is (tuple) unpacking, also used in `for i, v in enumerate(...)`."
    accept: ["unpacking", "tuple unpacking", "destructuring"]
  - id: f1-tuples-and-sets-10
    type: order
    prompt: "Order these from the fewest items to the most."
    explanation: "`set(\"hello\")` has 4 items (h, e, l, o), `\"hello\"` has 5 characters, `list(range(6))` has 6 items and `range(10)` has 10."
    items:
      - set("hello")
      - '"hello"'
      - list(range(6))
      - range(10)
