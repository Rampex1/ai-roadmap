items:
  - id: f1-numbers-01
    type: output
    prompt: "What does this print?"
    code: |
      print(17 // 5, 17 % 5)
    answer: "3 2"
    explanation: "5 fits into 17 three whole times (15), leaving 2."
  - id: f1-numbers-02
    type: output
    prompt: "What does this print?"
    code: |
      print(8 / 4)
    answer: "2.0"
    explanation: "`/` always produces a float, even when the division is exact."
  - id: f1-numbers-03
    type: numeric
    prompt: "What is the value of `2 + 3 * 2 ** 2`?"
    explanation: "Power first: `2 ** 2` is 4. Then multiply: `3 * 4` is 12. Then add: `2 + 12` is 14."
    answer: 14
  - id: f1-numbers-04
    type: mcq
    prompt: "What does `-2 ** 2` evaluate to?"
    explanation: "`**` binds more tightly than the unary minus, so it means `-(2 ** 2)`."
    options:
      - text: "-4"
        correct: true
        why: The power is applied first, then the minus sign, giving -(4).
      - text: "4"
        why: That would be (-2) ** 2. Without parentheses the minus is applied last.
      - text: An error
        why: It is valid Python; it just may not mean what you expect.
  - id: f1-numbers-05
    type: mcq
    prompt: "`print(0.1 + 0.2 == 0.3)` prints `False`. Why?"
    explanation: "0.1 and 0.2 cannot be stored exactly in binary, so their sum is 0.30000000000000004, not exactly the float closest to 0.3."
    options:
      - text: Floats are stored in binary with limited precision, so tiny rounding errors appear
        correct: true
        why: Most decimal fractions have no exact binary form, so the sum is off by a tiny amount.
      - text: Python has a bug in float addition
        why: Every language using standard (IEEE 754) floats gives the same result. It is how floats work.
      - text: "== cannot compare floats"
        why: "== does compare floats; it just checks for exact equality, which is too strict here."
  - id: f1-numbers-06
    type: multi
    prompt: "Which are safe ways to check whether a float `x` equals 0.3?"
    explanation: "Compare with a tolerance: either by hand with `abs` or with `math.isclose`."
    options:
      - text: "abs(x - 0.3) < 1e-9"
        correct: true
        why: This checks that x is within a tiny distance of 0.3.
      - text: "math.isclose(x, 0.3)"
        correct: true
        why: math.isclose applies a sensible relative tolerance for you.
      - text: "x == 0.3"
        why: Exact equality fails when tiny rounding errors are present.
      - text: "int(x) == 0"
        why: int() chops toward zero, so this is true for any x strictly between -1 and 1. It checks almost nothing.
  - id: f1-numbers-07
    type: numeric
    prompt: "A dataset has 1003 images and you process them in batches of 32. How many *full* batches are there? (Use `//`.)"
    explanation: "`1003 // 32` is 31, with `1003 % 32` = 11 images left over for a final partial batch."
    answer: 31
  - id: f1-numbers-08
    type: output
    prompt: "What does this print?"
    code: |
      print(round(2.5), round(3.5), round(3.14159, 3))
    answer: "2 4 3.142"
    explanation: "Exact halves go to the nearest even number, so 2.5 rounds to 2 and 3.5 to 4. 3.14159 rounded to 3 decimal places is 3.142."
  - id: f1-numbers-09
    type: cloze
    prompt: "In scientific notation, `1e-3` written as an ordinary decimal is ____ ."
    explanation: "`1e-3` means 1 times 10 to the power -3, which is 0.001."
    accept: ["0.001", ".001"]
  - id: f1-numbers-10
    type: order
    prompt: "Order these expressions from smallest to largest value."
    explanation: "`7 // 2` is 3, `7 / 2` is 3.5, `2 * 2` is 4 and `2 ** 3` is 8."
    items:
      - 7 // 2
      - 7 / 2
      - 2 * 2
      - 2 ** 3
