items:
  - id: f3-eigenvectors-01
    type: mcq
    prompt: "$A\\mathbf{v} = \\lambda\\mathbf{v}$ for a nonzero $\\mathbf{v}$. Geometrically, what does $A$ do to $\\mathbf{v}$?"
    explanation: "An eigenvector stays on its own line through the origin; $A$ only scales it by $\\lambda$ (flipping it if $\\lambda < 0$)."
    options:
      - text: It scales v by lambda without moving it off its line
        correct: true
        why: That is the definition of an eigenvector.
      - text: It rotates v by an angle of lambda
        why: Rotations generally move vectors off their line; eigenvectors stay on it.
      - text: It adds lambda to every component of v
        why: lambda multiplies the vector; it is not added.
  - id: f3-eigenvectors-02
    type: numeric
    prompt: "$A = \\begin{pmatrix} 4 & 1 \\\\ 2 & 3 \\end{pmatrix}$ and $\\mathbf{v} = (1, 1)$. $\\mathbf{v}$ is an eigenvector. What is its eigenvalue?"
    answer: 5
    tol: 1e-9
    explanation: "$A\\mathbf{v} = (4 + 1, 2 + 3) = (5, 5) = 5\\mathbf{v}$."
  - id: f3-eigenvectors-03
    type: multi
    prompt: "What are the eigenvalues of the diagonal matrix $\\begin{pmatrix} 3 & 0 \\\\ 0 & -2 \\end{pmatrix}$? Select all."
    explanation: "A diagonal matrix scales each axis by its diagonal entry, so $\\mathbf{e}_1$ has eigenvalue 3 and $\\mathbf{e}_2$ has eigenvalue $-2$."
    options:
      - text: "3"
        correct: true
        why: e1 is stretched by 3.
      - text: "-2"
        correct: true
        why: e2 is flipped and stretched by 2.
      - text: "0"
        why: Neither axis is squashed; the determinant is -6, not 0.
      - text: "1"
        why: No direction is left unchanged.
  - id: f3-eigenvectors-04
    type: mcq
    prompt: "After `vals, vecs = np.linalg.eig(A)`, which expression is the eigenvector that goes with `vals[1]`?"
    explanation: "NumPy returns eigenvectors as the columns of `vecs`, so the one for `vals[i]` is `vecs[:, i]`."
    options:
      - text: vecs[:, 1]
        correct: true
        why: Column 1.
      - text: vecs[1]
        why: That is row 1, a common mistake.
      - text: vecs[1, 1]
        why: That is a single number, not a vector.
  - id: f3-eigenvectors-05
    type: output
    prompt: "What does this print?"
    code: |
      import numpy as np
      vals, vecs = np.linalg.eigh(np.array([[5.0, 0.0],
                                            [0.0, 2.0]]))
      print(vals)
    answer: "[2. 5.]"
    explanation: "`eigh` returns the eigenvalues of a symmetric matrix in ascending order, so the largest is last."
  - id: f3-eigenvectors-06
    type: mcq
    prompt: "A matrix has eigenvalues 0.5 and 2. You start from a random vector and multiply by the matrix 50 times. What happens?"
    explanation: "The component along the eigenvalue-2 eigenvector grows like $2^{50}$ while the other shrinks like $0.5^{50}$. The result is huge and points along the eigenvalue-2 eigenvector."
    options:
      - text: It becomes huge and points along the eigenvector with eigenvalue 2
        correct: true
        why: The largest eigenvalue dominates repeated multiplication.
      - text: It shrinks to zero
        why: Only if every eigenvalue has absolute value below 1.
      - text: It stays about the same length, because 0.5 times 2 is 1
        why: The two components evolve separately; they do not cancel.
  - id: f3-eigenvectors-07
    type: multi
    prompt: "Which are true for a real **symmetric** matrix?"
    explanation: "The spectral theorem: real eigenvalues, perpendicular eigenvectors, and $A = Q\\Lambda Q^\\top$. Eigenvalues can still be negative or zero."
    options:
      - text: All its eigenvalues are real numbers
        correct: true
        why: Part of the spectral theorem.
      - text: Its eigenvectors can be chosen perpendicular to each other and of length 1
        correct: true
        why: They form an orthonormal basis.
      - text: All its eigenvalues are positive
        why: A symmetric matrix such as [[0, 1], [1, 0]] has eigenvalue -1.
      - text: It is always invertible
        why: A symmetric matrix can have eigenvalue 0, like [[1, 1], [1, 1]].
  - id: f3-eigenvectors-08
    type: mcq
    prompt: "Why does a 90 degree rotation matrix have no real eigenvectors?"
    explanation: "A rotation by 90 degrees moves every nonzero vector off its line, so no real direction is only scaled. Its eigenvalues are complex, $\\pm i$."
    options:
      - text: It turns every nonzero vector to a new direction
        correct: true
        why: No direction survives, so no real eigenvector exists.
      - text: Its determinant is 0
        why: Its determinant is 1; it keeps areas.
      - text: It is not a square matrix
        why: It is 2 by 2.
  - id: f3-eigenvectors-09
    type: numeric
    prompt: "A $2 \\times 2$ matrix $A$ has $\\det(A - \\lambda I) = (\\lambda - 4)(\\lambda + 1)$. What is its largest eigenvalue?"
    answer: 4
    tol: 1e-9
    explanation: "Eigenvalues are the roots of $\\det(A - \\lambda I) = 0$: $\\lambda = 4$ and $\\lambda = -1$."
  - id: f3-eigenvectors-10
    type: mcq
    prompt: "For the covariance matrix of a dataset, what does its eigenvector with the largest eigenvalue represent?"
    explanation: "The covariance matrix's top eigenvector is the direction along which the data varies most, and the eigenvalue is the variance along it. This is the first principal component."
    options:
      - text: The direction in which the data spreads out the most
        correct: true
        why: Its eigenvalue is the variance along that direction.
      - text: The mean of the data
        why: The mean is subtracted before computing the covariance.
      - text: The data point farthest from the origin
        why: Eigenvectors are directions, not data points.
