items:
  - id: f3-linear-transformations-01
    type: mcq
    prompt: "Which matrix reflects the plane in the x-axis, sending $(x, y)$ to $(x, -y)$?"
    explanation: "$\\mathbf{e}_1 = (1, 0)$ stays put and $\\mathbf{e}_2 = (0, 1)$ goes to $(0, -1)$, so the columns are $(1, 0)$ and $(0, -1)$."
    options:
      - text: "[[1, 0], [0, -1]]"
        correct: true
        why: Column 1 is (1, 0) and column 2 is (0, -1).
      - text: "[[0, 1], [1, 0]]"
        why: That swaps x and y, a reflection in the line y = x.
      - text: "[[1, 0], [0, 0]]"
        why: That is the projection onto the x-axis; it squashes rather than reflects.
      - text: "[[-1, 0], [0, 1]]"
        why: That flips x, which reflects in the y-axis.
  - id: f3-linear-transformations-02
    type: output
    prompt: "What does this print?"
    code: |
      import numpy as np
      H = np.array([[1, 2],
                    [0, 1]])
      print(H @ np.array([1, 3]))
    answer: "[7 3]"
    explanation: "This shear slides each point sideways by 2 times its height: $x$ becomes $1 + 2\\cdot 3 = 7$ and the height stays 3."
  - id: f3-linear-transformations-03
    type: numeric
    prompt: "By what factor does $\\begin{pmatrix} 3 & 1 \\\\ 1 & 2 \\end{pmatrix}$ scale areas? (Compute the determinant.)"
    answer: 5
    tol: 1e-9
    explanation: "$ad - bc = 3\\cdot 2 - 1\\cdot 1 = 5$, so every shape's area is multiplied by 5."
  - id: f3-linear-transformations-04
    type: multi
    prompt: "Which of these maps on 2-D vectors are linear?"
    explanation: "Linear maps fix the origin and respect addition and scaling. A shift moves the origin, and squaring is not linear."
    options:
      - text: Squaring each component, (x, y) to (x squared, y squared)
        why: Doubling the input quadruples the output, which breaks linearity.
      - text: Projecting onto the line y = x
        correct: true
        why: Projection onto a line through the origin is linear.
      - text: Rotating by 30 degrees about the origin
        correct: true
        why: Rotations about the origin are linear.
      - text: Shifting every point right by 1
        why: It moves the origin, so it is affine, not linear.
  - id: f3-linear-transformations-05
    type: numeric
    prompt: "Project $\\mathbf{a} = (4, 2)$ onto $\\mathbf{u} = (1, 0)$ and then take the length of the **perpendicular** remainder. What is it?"
    answer: 2
    tol: 1e-9
    explanation: "The projection is $(4, 0)$, so the remainder is $(0, 2)$, of length 2."
  - id: f3-linear-transformations-06
    type: mcq
    prompt: "You want to first rotate with $R$ and then stretch with $S$. Which matrix does both?"
    explanation: "The map applied first sits next to the vector, on the right: $S(R\\mathbf{v}) = (SR)\\mathbf{v}$."
    options:
      - text: S R
        correct: true
        why: R acts first, so it goes on the right.
      - text: R + S
        why: Adding matrices does not compose maps.
      - text: R S
        why: That stretches first and then rotates.
  - id: f3-linear-transformations-07
    type: mcq
    prompt: "A $2 \\times 2$ matrix has determinant 0. What does it do to the plane?"
    explanation: "Area scale factor 0 means the plane is squashed onto a line or a single point, so information is lost."
    options:
      - text: It flattens the plane onto a line or a point
        correct: true
        why: Every area becomes 0.
      - text: It rotates the plane without changing areas
        why: Rotations have determinant 1.
      - text: It reflects the plane
        why: Reflections have determinant -1.
      - text: It leaves every vector unchanged
        why: That is the identity, with determinant 1.
  - id: f3-linear-transformations-08
    type: output
    prompt: "What does this print?"
    code: |
      import numpy as np
      u = np.array([0.6, 0.8])        # a unit vector
      a = np.array([5.0, 0.0])
      print(round(a @ u, 4))
    answer: "3.0"
    explanation: "With a unit vector, $\\mathbf{a}\\cdot\\mathbf{u}$ is how far $\\mathbf{a}$ reaches along $\\mathbf{u}$: $5 \\times 0.6 = 3$."
  - id: f3-linear-transformations-09
    type: mcq
    prompt: "A rotation matrix $R_\\theta$ is applied to a vector of length 5. What is the length afterwards?"
    explanation: "Rotations keep lengths and angles; only the direction changes."
    options:
      - text: "5"
        correct: true
        why: Rotations preserve length.
      - text: It depends on the vector's direction
        why: Every vector keeps its length under a rotation.
      - text: 5 times cos theta
        why: That is the x-component after rotating (5, 0), not the length.
  - id: f3-linear-transformations-10
    type: cloze
    prompt: "A map of the form $\\mathbf{x} \\mapsto A\\mathbf{x} + \\mathbf{b}$ with $\\mathbf{b} \\ne \\mathbf{0}$ is not linear; it is called ____ ."
    accept: [ "affine" ]
    explanation: "An affine map is a linear map followed by a shift. Neural network layers are affine before the activation."
