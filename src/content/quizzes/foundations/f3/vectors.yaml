items:
  - id: f3-vectors-01
    type: output
    prompt: "What does this print?"
    code: |
      import numpy as np
      a = np.array([1, 4])
      b = np.array([3, -2])
      print(a + 2 * b)
    answer: "[7 0]"
    explanation: "Scale first: 2b = (6, -4). Then add component by component: (1 + 6, 4 - 4) = (7, 0)."
  - id: f3-vectors-02
    type: output
    prompt: "What does this print? Note that these are Python lists, not arrays."
    code: |
      print([1, 2] + [3, 4])
    answer: "[1, 2, 3, 4]"
    explanation: "On lists, `+` joins them end to end. Vector addition needs NumPy arrays: `np.array([1, 2]) + np.array([3, 4])` gives `[4 6]`."
  - id: f3-vectors-03
    type: mcq
    prompt: "Geometrically, what does the vector $\\mathbf{a} - \\mathbf{b}$ represent?"
    explanation: "$\\mathbf{b} + (\\mathbf{a} - \\mathbf{b}) = \\mathbf{a}$, so $\\mathbf{a} - \\mathbf{b}$ is the step that takes you from the tip of $\\mathbf{b}$ to the tip of $\\mathbf{a}$."
    options:
      - text: The arrow from the tip of b to the tip of a
        correct: true
        why: Adding it to b lands on a.
      - text: The arrow from the tip of a to the tip of b
        why: That is b - a, which points the opposite way.
      - text: The arrow from the origin to the midpoint of a and b
        why: The midpoint is (a + b) / 2, a different combination.
      - text: Nothing; vectors can only be subtracted if they are equal
        why: Any two vectors of the same dimension can be subtracted.
  - id: f3-vectors-04
    type: multi
    prompt: "Which of these change the **direction** of a nonzero vector $\\mathbf{v}$ (not just its length)? Treat a reversed arrow as a change of direction."
    explanation: "Multiplying by a positive number keeps the direction; a negative number reverses it. Adding a vector that is not parallel to $\\mathbf{v}$ turns it."
    options:
      - text: Multiplying by 3
        why: A positive scalar only stretches the arrow.
      - text: Multiplying by -1
        correct: true
        why: A negative scalar flips the arrow to point the opposite way.
      - text: Multiplying by 0.1
        why: A positive scalar only shrinks the arrow.
      - text: Adding a vector that is not parallel to v
        correct: true
        why: Tip to tail with a vector in another direction turns the result.
  - id: f3-vectors-05
    type: numeric
    prompt: "A dataset has 500 rows and 12 columns (features). Each row is a vector in $\\mathbb{R}^n$. What is $n$?"
    answer: 12
    tol: 0
    explanation: "Each row lists one value per feature, so each row vector has 12 components. The 500 is the number of points in the cloud, not the dimension."
  - id: f3-vectors-06
    type: output
    prompt: "What does this print?"
    code: |
      import numpy as np
      v = np.array([4.0, -2.0, 0.0])
      print(v.shape, v[1])
    answer: "(3,) -2.0"
    explanation: "A 1-D array of three numbers has shape `(3,)`, and NumPy counts from 0, so `v[1]` is the second component."
  - id: f3-vectors-07
    type: mcq
    prompt: "Gradient descent updates weights with $\\mathbf{w} - \\eta\\,\\mathbf{g}$. In the language of this lesson, this is:"
    explanation: "It scales $\\mathbf{w}$ by 1 and $\\mathbf{g}$ by $-\\eta$ and adds them: a linear combination of two vectors."
    options:
      - text: A linear combination of w and g with coefficients 1 and minus eta
        correct: true
        why: Scale each vector, then add.
      - text: A dot product of w and g
        why: A dot product gives a single number; this update gives a vector.
      - text: Concatenating w and g into a longer vector
        why: That would double the dimension; the update keeps it the same.
  - id: f3-vectors-08
    type: output
    prompt: "What does this print?"
    code: |
      import numpy as np
      X = np.array([[1.0, 10.0],
                    [3.0, 20.0]])
      print((X[0] + X[1]) / 2)
    answer: "[ 2. 15.]"
    explanation: "The average of the two row vectors: ((1 + 3) / 2, (10 + 20) / 2) = (2, 15). NumPy pads to align the columns."
  - id: f3-vectors-09
    type: cloze
    prompt: "Any 2-D vector $(x, y)$ can be written as $x\\,\\mathbf{e}_1 + y\\,\\mathbf{e}_2$. An expression that scales vectors and adds them up like this is called a linear ____ ."
    accept: ["combination"]
    explanation: "A linear combination is $c_1\\mathbf{v}_1 + \\dots + c_k\\mathbf{v}_k$."
  - id: f3-vectors-10
    type: mcq
    prompt: "You stack 1000 sentence embeddings, each of length 384, as rows of an array `E`. What is `E.shape`?"
    explanation: "Rows come first in a NumPy shape: 1000 rows (one per sentence) by 384 columns (one per component)."
    options:
      - text: (1000, 384)
        correct: true
        why: 1000 rows, each a 384-component vector.
      - text: (384, 1000)
        why: That would put one sentence in each column.
      - text: (384000,)
        why: Stacking as rows gives a 2-D array, not one long vector.
