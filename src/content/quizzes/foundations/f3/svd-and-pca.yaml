items:
  - id: f3-svd-and-pca-01
    type: mcq
    prompt: "Which description of the SVD $A = U\\Sigma V^\\top$ is correct?"
    explanation: "Read right to left: $V^\\top$ rotates the input, $\\Sigma$ stretches along the axes by the singular values, and $U$ rotates into the output space."
    options:
      - text: Rotate, then stretch along the axes, then rotate again
        correct: true
        why: V transpose and U are rotations (possibly with a reflection); Sigma is a diagonal stretch.
      - text: It exists only for square symmetric matrices
        why: The SVD exists for every matrix, of any shape.
      - text: Sigma holds the eigenvectors of A
        why: Sigma is diagonal and holds the singular values, which are never negative.
  - id: f3-svd-and-pca-02
    type: output
    prompt: "What does this print?"
    code: |
      import numpy as np
      U, s, Vt = np.linalg.svd(np.zeros((6, 4)) + 1.0, full_matrices=False)
      print(U.shape, s.shape, Vt.shape)
    answer: "(6, 4) (4,) (4, 4)"
    explanation: "With `full_matrices=False`, a $6 \\times 4$ matrix gives $U$ of shape $(6, 4)$, 4 singular values as a 1-D array, and $V^\\top$ of shape $(4, 4)$."
  - id: f3-svd-and-pca-03
    type: numeric
    prompt: "A matrix has singular values 6, 3, 2 and 1. What fraction of the total energy $\\sum\\sigma_i^2$ does the best rank-1 approximation keep? Answer as a decimal."
    answer: 0.72
    tol: 0.005
    explanation: "$\\sigma_1^2 / \\sum\\sigma_i^2 = 36 / (36 + 9 + 4 + 1) = 36/50 = 0.72$."
  - id: f3-svd-and-pca-04
    type: order
    prompt: "Put the steps of PCA via the SVD in order."
    explanation: "Centre first, so that variance is measured around the mean; then decompose, pick the top directions, and project onto them."
    items:
      - Subtract the mean of each column from X
      - Compute the SVD of the centred matrix
      - Take the first k rows of V transposed as the principal components
      - Project the centred data onto those components
  - id: f3-svd-and-pca-05
    type: mcq
    prompt: "Why must the data be centred before PCA?"
    explanation: "PCA finds directions of maximum spread around the centre of the cloud. Without centring, the first component tends to point from the origin towards the mean instead."
    options:
      - text: It makes every feature have variance 1
        why: That is standardising, which also divides by the standard deviation.
      - text: The SVD only works for matrices with zero mean
        why: The SVD works for any matrix; centring is about what PCA is meant to measure.
      - text: Otherwise the first component mostly points towards the mean instead of along the spread
        correct: true
        why: Variance is measured around the mean.
  - id: f3-svd-and-pca-06
    type: multi
    prompt: "Your PCA's first component is $(0.6, -0.8)$ and scikit-learn's is $(-0.6, 0.8)$. Which are true?"
    explanation: "Principal components are directions, defined only up to sign. Both answers describe the same line, and the projected coordinates just flip sign."
    options:
      - text: Both are correct; components are only defined up to sign
        correct: true
        why: v and -v span the same line.
      - text: The explained variance ratios will differ
        why: The variance along a line does not depend on which way the arrow points.
      - text: One of the two implementations has a bug
        why: A sign flip is not a bug.
      - text: Your projected values on that component will be the negatives of scikit-learn's
        correct: true
        why: Dotting with -v negates every coordinate.
  - id: f3-svd-and-pca-07
    type: numeric
    prompt: "A centred data matrix with $N = 101$ rows has a top singular value $\\sigma_1 = 20$. What is the variance along the first principal component?"
    answer: 4
    tol: 1e-9
    explanation: "Variance along component $i$ is $\\sigma_i^2 / (N - 1) = 400 / 100 = 4$."
  - id: f3-svd-and-pca-08
    type: mcq
    prompt: "A dataset has income in dollars (values around 50,000) and age in years (around 40). You run PCA without scaling. What is the likely result?"
    explanation: "PCA chases variance. Income's variance is millions of times larger, so the first component is essentially the income axis. Standardise first."
    options:
      - text: The first component is almost exactly the income axis
        correct: true
        why: Income dominates the variance purely because of its units.
      - text: The first component is almost exactly the age axis
        why: Age has far smaller variance in these units.
      - text: Units do not matter to PCA
        why: Variance depends on units, so PCA does too.
  - id: f3-svd-and-pca-09
    type: mcq
    prompt: "The right singular vectors of $X_c$ (the rows of $V^\\top$) are the same as which of these?"
    explanation: "$X_c^\\top X_c = V\\Sigma^2V^\\top$, so the right singular vectors are eigenvectors of $X_c^\\top X_c$, which is $(N-1)$ times the covariance matrix."
    options:
      - text: The eigenvectors of the covariance matrix
        correct: true
        why: Both are directions of greatest variance.
      - text: The columns of the identity matrix
        why: Only if the features were already uncorrelated and sorted by variance.
      - text: The rows of the data matrix
        why: Singular vectors are new directions, not data points.
  - id: f3-svd-and-pca-10
    type: cloze
    prompt: "Keeping only the top $k$ singular values of $A$ gives the best possible rank-____ approximation of $A$."
    accept: [ "k" ]
    explanation: "Truncating the SVD to $k$ terms gives the closest rank-$k$ matrix (the Eckart–Young theorem)."
