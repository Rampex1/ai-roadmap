items:
  - id: f7-regularisation-01
    type: mcq
    prompt: "What happens to a ridge regression as $\\alpha \\to \\infty$?"
    options:
      - text: "It becomes ordinary least squares"
        why: "That is α = 0."
      - text: "All weights go to 0 and it predicts the training mean everywhere"
        correct: true
        why: "The penalty dominates, so w = 0; the unpenalised intercept becomes the mean of y."
      - text: "The weights grow without bound"
        why: "The penalty punishes large weights, so they shrink."
    explanation: "α = 0 is least squares; very large α forces every weight to zero, leaving the mean baseline."
  - id: f7-regularisation-02
    type: mcq
    prompt: "Which penalty tends to set some weights **exactly** to zero?"
    options:
      - text: "The L1 penalty of lasso"
        correct: true
        why: "The constant slope of |w| pushes small weights all the way to zero."
      - text: "Neither; only feature deletion can do that"
        why: "Lasso does it automatically, which is why it is used for feature selection."
      - text: "The L2 penalty of ridge"
        why: "The push of w² weakens near zero, so ridge shrinks weights without zeroing them."
    explanation: "Lasso performs feature selection by zeroing weights; ridge only shrinks them."
  - id: f7-regularisation-03
    type: mcq
    prompt: "Why should features be standardised before fitting ridge or lasso?"
    options:
      - text: "The penalty depends on the size of each weight, and a weight's size depends on its feature's units"
        correct: true
        why: "A feature in metres needs a weight 1,000 times smaller than in km, so it would barely be penalised."
      - text: "Ridge and lasso cannot handle negative numbers"
        why: "They handle any real numbers."
      - text: "Standardising makes the model unbiased"
        why: "Penalised models are biased on purpose; scaling only makes the penalty treat features fairly."
    explanation: "Without scaling, the penalty strength on each feature depends on an arbitrary choice of units."
  - id: f7-regularisation-04
    type: mcq
    prompt: "Why is the intercept $b$ not penalised?"
    options:
      - text: "Shrinking it would shift all predictions towards 0, which has nothing to do with model complexity"
        correct: true
        why: "The intercept only sets the overall level of the predictions."
      - text: "scikit-learn cannot compute its gradient"
        why: "Its gradient is easy; it is left out by design."
      - text: "The intercept is always zero after scaling"
        why: "Scaling X does not make the mean of y zero, so the intercept is usually not zero."
    explanation: "Penalties target the weights that control how strongly the model reacts to features, not the overall level."
  - id: f7-regularisation-05
    type: numeric
    prompt: "One centred feature with $\\sum x_i^2 = 10$ and $\\sum x_i y_i = 20$. The least-squares weight is $20/10 = 2$. What is the ridge weight with $\\alpha = 10$?"
    answer: 1
    tol: 0.001
    explanation: "Ridge solves $(\\sum x_i^2 + \\alpha)\\,w = \\sum x_i y_i$, so $w = 20/(10 + 10) = 1$: halved by the penalty."
  - id: f7-regularisation-06
    type: multi
    prompt: "Which statements about ridge regression are true?"
    options:
      - text: "With alpha = 0 it is ordinary least squares"
        correct: true
        why: "No penalty, same objective."
      - text: "It sets the weights of useless features exactly to zero"
        why: "That is lasso's behaviour; ridge leaves small non-zero weights."
      - text: "Adding alpha times the identity makes the system solvable even with collinear features"
        correct: true
        why: "XᵀX + αI is invertible for any α > 0."
      - text: "It has a closed-form solution"
        correct: true
        why: "On centred data, w solves (XᵀX + αI)w = Xᵀy."
    explanation: "Ridge keeps a closed form, generalises least squares, and is numerically stable, but does not select features."
  - id: f7-regularisation-07
    type: output
    prompt: "What does this print?"
    code: |
      import numpy as np
      from sklearn.linear_model import Lasso
      rng = np.random.default_rng(0)
      X = rng.normal(size=(50, 2))
      y = X @ np.array([1.0, -1.0]) + rng.normal(0, 0.1, 50)
      print(Lasso(alpha=100).fit(X, y).coef_ + 0.0)
    answer: "[0. 0.]"
    explanation: "A huge L1 penalty outweighs any benefit of the features, so lasso sets both weights exactly to zero."
  - id: f7-regularisation-08
    type: mcq
    prompt: "How should you choose the penalty strength $\\alpha$?"
    options:
      - text: "Pick the one with the best test score"
        why: "That makes the test score optimistic; the test set is for the final estimate only."
      - text: "Pick the one with the lowest training error"
        why: "The lowest training error is always at α = 0, which brings back the overfitting."
      - text: "Try values on a log scale and keep the one with the best validation or cross-validation score"
        correct: true
        why: "α is a hyperparameter, chosen on held-out data."
    explanation: "Search α over values like 0.001, 0.01, ..., 1000 and compare on validation data."
  - id: f7-regularisation-09
    type: cloze
    prompt: "Ridge regression uses an ____ penalty, the sum of the squared weights."
    accept: [ "L2", "l2", "L-2", "L₂" ]
    explanation: "Ridge is L2 (squared weights); lasso is L1 (absolute values)."
  - id: f7-regularisation-10
    type: mcq
    prompt: "Why does lasso push weights all the way to zero while ridge does not?"
    options:
      - text: "Lasso uses a larger alpha by default"
        why: "The difference comes from the shape of the penalty, not its default strength."
      - text: "The slope of |w| stays at ±1 near zero, while the slope of w², which is 2w, vanishes there"
        correct: true
        why: "A constant push can beat a weak feature's benefit; a vanishing push never quite reaches zero."
      - text: "Lasso is solved by gradient descent and ridge in closed form"
        why: "The solver does not cause sparsity; the shape of the penalty does."
    explanation: "Near zero, the L2 penalty's pull fades away, but the L1 penalty's pull stays constant."
  - id: f7-regularisation-11
    type: numeric
    prompt: "A model trained by gradient descent adds the penalty $\\alpha\\lVert\\mathbf{w}\\rVert^2$ with $\\alpha = 0.5$. How much does the penalty add to the gradient of a weight whose value is $w_j = 3$?"
    answer: 3
    tol: 0.001
    explanation: "The derivative of $\\alpha w_j^2$ is $2\\alpha w_j = 2 \\times 0.5 \\times 3 = 3$. This pull towards zero is weight decay."
