items:
  - id: f11-bias-in-data-01
    type: mcq
    prompt: "A model predicts \"will commit a crime\" but is trained on the label \"was arrested\". Arrests depend partly on where police patrol. Which kind of bias is this?"
    options:
      - text: "Sampling bias"
        why: "Sampling bias is about who is in the dataset. Here the problem is what the label measures."
      - text: "Label bias"
        correct: true
        why: "The label is a flawed stand-in for the real target, and the flaw differs between groups depending on policing."
      - text: "Measurement bias in the inputs"
        why: "Close, but the flaw is in the target being predicted, which is called label bias."
      - text: "No bias, because arrests are recorded accurately"
        why: "Arrests may be recorded accurately and still be a poor and uneven measure of offending."
    explanation: "Always ask what a label really measures. Arrests, costs and past hiring decisions are common biased stand-ins."
  - id: f11-bias-in-data-02
    type: mcq
    prompt: "A skin-condition classifier is trained on photos that are 95% lighter-skinned patients. Which kind of bias is this?"
    options:
      - text: "Concept shift"
        why: "Concept shift is a change in the relationship between inputs and labels over time, a deployment issue."
      - text: "Sampling (representation) bias"
        correct: true
        why: "One group is under-represented relative to the population the model will serve."
      - text: "Historical bias"
        why: "Historical bias means the recorded world reflects past unfairness. Here the problem is the sample's make-up."
      - text: "Label bias"
        why: "Nothing suggests the labels are wrong; the issue is who is in the data."
    explanation: "Training on average loss lets the majority dominate, so an under-represented group usually gets higher error."
  - id: f11-bias-in-data-03
    type: mcq
    prompt: "A bank removes the ethnicity column from its training data. Why might its model still treat ethnic groups differently?"
    options:
      - text: "Removing a column has no effect on a model"
        why: "It does remove direct use of the column, but not indirect use through correlated features."
      - text: "Other features such as postcode correlate with ethnicity and act as proxies"
        correct: true
        why: "A flexible model can use correlated features to reproduce the pattern without ever seeing the column."
      - text: "It cannot; removing the sensitive column guarantees fairness"
        why: "This is 'fairness through unawareness', and it rarely works because of proxies."
      - text: "The model can read the deleted column from memory"
        why: "The model never sees deleted columns. Proxies, not memory, are the problem."
    explanation: "Proxies let a model reconstruct group membership. If the other features can predict the group, the model can use it."
  - id: f11-bias-in-data-04
    type: mcq
    prompt: "Why do many teams keep the sensitive attribute in their dataset, under access controls, even when the model may not use it as an input?"
    options:
      - text: "Laws require every dataset to contain it"
        why: "Laws vary, and some restrict collecting such data. The reason here is auditing."
      - text: "It removes the need for proxies"
        why: "Keeping the column does not change what proxies exist; it lets you measure their effect."
      - text: "Without it they cannot compute metrics per group to audit the model"
        correct: true
        why: "Fairness metrics are conditional on group. No group column, no audit."
      - text: "It always improves accuracy"
        why: "That is not the reason, and the model may not be allowed to use it."
    explanation: "Deleting the sensitive column also deletes your ability to check fairness."
  - id: f11-bias-in-data-05
    type: output
    prompt: "A group-blind model learns the past hire rate per area and predicts hire when it is at least 0.5. What does this print?"
    code: |
      import pandas as pd
      hist = pd.DataFrame({"area": ["n", "n", "n", "s", "s", "s"],
                           "hired": [1, 1, 0, 0, 0, 1]})
      rates = hist.groupby("area")["hired"].mean()
      new = pd.DataFrame({"group": ["A", "A", "B", "B"], "area": ["n", "n", "s", "n"]})
      pred = new["area"].map(rates) >= 0.5
      print(pred.groupby(new["group"]).mean().tolist())
    answer: "[1.0, 0.5]"
    explanation: "Area n has rate 2/3 (hire) and s has 1/3 (reject). Both A applicants live in n, so A gets 1.0; B has one in s and one in n, so 0.5."
  - id: f11-bias-in-data-06
    type: multi
    prompt: "In the lesson's synthetic hiring history, skill had the same distribution in both groups, yet among people in the same mid skill band the group-blind model recommended 82% of A and 18% of B. Which statements are true? Select all that apply."
    options:
      - text: "Group B applicants in the mid band were less skilled than group A applicants in it"
        why: "Skill was generated identically for both groups; the difference was in past decisions."
      - text: "The model accurately reproduced the historical decisions"
        correct: true
        why: "That is exactly the problem: the history held group B to a higher bar."
      - text: "Area acted as a proxy for group"
        correct: true
        why: "Most northerners were in A, and northerners in the mid band were usually hired in the past."
      - text: "The model must have been given the group column"
        why: "It only saw area and skill band. The bias came through the proxy."
    explanation: "A model that copies biased decisions scores well against those decisions. High accuracy on biased labels rewards bias."
  - id: f11-bias-in-data-07
    type: mcq
    prompt: "Why does training on average loss tend to give higher error for a small group?"
    options:
      - text: "Errors on a small group contribute little to the average, so the optimiser has little reason to fix them"
        correct: true
        why: "If a group is 5% of the data, its errors move the average loss very little."
      - text: "Models delete rare examples during training"
        why: "They do not delete them; they just weigh them in proportion to their numbers."
      - text: "Small groups always have noisier labels"
        why: "Not necessarily. The weighting in the average is enough to cause the effect."
      - text: "Gradient descent cannot handle more than one group"
        why: "Gradient descent works on any data; the issue is what the average rewards."
    explanation: "This is how sampling bias becomes performance bias. More data for the group, or reweighting, can help."
  - id: f11-bias-in-data-08
    type: mcq
    prompt: "A lender only learns whether people repay if it approved them. A group that was rarely approved in the past therefore has few outcomes in the data. What is this an example of?"
    options:
      - text: "Differential privacy"
        why: "Differential privacy is a protection technique, not a source of bias."
      - text: "Label noise"
        why: "The recorded labels may be correct; the problem is which labels exist at all."
      - text: "Measurement bias in a sensor"
        why: "No instrument is involved; the data were filtered by decisions."
      - text: "A selection effect from past decisions"
        correct: true
        why: "Past decisions filtered which outcomes were ever observed, so the data say little about the rejected."
    explanation: "Selection effects are the feedback loop from the first lesson in another form."
  - id: f11-bias-in-data-09
    type: order
    prompt: "Put the path from the world to a trained model in order. Bias can enter at every step."
    items:
      - "Something happens in the world"
      - "Someone records it and assigns a label"
      - "A dataset is assembled"
      - "A model is fitted"
    explanation: "Historical bias lives in the world, measurement and label bias in recording and labelling, sampling bias in assembly, and the model learns all of it."
  - id: f11-bias-in-data-10
    type: cloze
    prompt: "Deleting the sensitive attribute and hoping the model is then fair is called fairness through ____ (one word)."
    accept: [ "unawareness" ]
    explanation: "It rarely works because proxies carry the same information, and it removes your ability to audit."
