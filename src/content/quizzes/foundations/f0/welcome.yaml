items:
  - id: f0-welcome-01
    type: mcq
    prompt: "In $\\theta_{t+1} = \\theta_t - \\eta \\nabla_\\theta L$, what does $\\eta$ control?"
    explanation: "$\\eta$ is the learning rate: it scales each step."
    options:
      - text: The step size
        correct: true
        why: The gradient gives a direction; $\eta$ scales how far you move.
      - text: The number of steps
        why: The number of steps is how many times you apply the update, not $\eta$.
      - text: The direction of the step
        why: The direction comes from the negative gradient, not from $\eta$.
  - id: f0-welcome-02
    type: multi
    prompt: "Which of these are part of every lesson in this course?"
    explanation: "Every lesson has objectives and an end-of-lesson quiz. Homework notebooks belong to modules, not individual lessons."
    options:
      - text: A quiz at the end
        correct: true
        why: Retrieval practice closes every lesson.
      - text: Learning objectives
        correct: true
        why: Each lesson starts with 2–4 objectives.
      - text: A homework notebook
        why: Homework is set once per module, not per lesson.
  - id: f0-welcome-03
    type: numeric
    prompt: "What is the mean $\\bar{x}$ of the numbers 2, 4 and 9?"
    explanation: "$\\bar{x} = \\frac{2 + 4 + 9}{3} = \\frac{15}{3} = 5$."
    answer: 5
    tol: 0.001
  - id: f0-welcome-04
    type: output
    prompt: "What does this Python code print?"
    code: |
      steps = [1, 2, 3]
      print(sum(steps) * 2)
    answer: "12"
    explanation: "`sum([1, 2, 3])` is 6, and $6 \\times 2 = 12$."
  - id: f0-welcome-05
    type: order
    prompt: "Put the course stages in the order you will meet them."
    explanation: "Lessons build understanding, the module check confirms mastery, and spaced review keeps it over time."
    items:
      - Read the lesson
      - Answer the lesson quiz
      - Pass the module mastery check
      - Keep reviewing items as they come due, after the module is done
  - id: f0-welcome-06
    type: cloze
    prompt: "Gradient descent steps against the ____ of the loss."
    explanation: "The gradient points uphill; stepping against it lowers the loss."
    accept: [ "gradient" ]
    regex: "^(the )?gradient$"
  - id: f0-welcome-07
    type: mcq
    prompt: "Where does the Python code in a lesson's exercise box run?"
    explanation: "Lesson exercises run in your browser with a built-in Python, so they need no installation. Homework, starting with this module's, uses Python on your own Mac or on Colab."
    options:
      - text: In your web browser, with nothing to install
        correct: true
        why: The site ships a Python that runs inside the browser page.
      - text: In the Terminal, after installing Python
        why: Local Python is set up later in this module and used for homework, not lesson exercises.
      - text: On a Google server, so you need an account
        why: That describes Colab, which is used for some homework, not lesson exercises.
  - id: f0-welcome-08
    type: numeric
    prompt: "What is the mean of 10, 20, 30 and 40?"
    explanation: "$\\bar{x} = \\frac{10 + 20 + 30 + 40}{4} = \\frac{100}{4} = 25$."
    answer: 25
    tol: 0.001
  - id: f0-welcome-09
    type: mcq
    prompt: "In $\\bar{x} = \\frac{1}{n}\\sum_{i=1}^{n} x_i$, what does the symbol $\\sum_{i=1}^{n} x_i$ mean?"
    explanation: "$\\sum$ (capital sigma) means add up. $\\sum_{i=1}^{n} x_i = x_1 + x_2 + \\dots + x_n$."
    options:
      - text: Take the largest number
        why: The largest value is written $\max$, not $\sum$.
      - text: Multiply all the numbers together
        why: A product uses capital pi, $\prod$, not sigma.
      - text: Add up all the numbers from the first to the n-th
        correct: true
        why: Sigma with i running from 1 to n means the sum $x_1 + x_2 + \dots + x_n$.
      - text: Count how many numbers there are
        why: That count is $n$ itself; sigma adds the values.
