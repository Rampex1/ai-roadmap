items:
  - id: f0-notebooks-01
    type: output
    prompt: "A notebook has three cells. You run them in the order 1, 3, 2, then run cell 3 again. What does that last run of cell 3 print?"
    code: |
      # Cell 1
      n = 1

      # Cell 2
      n = n + 10

      # Cell 3
      n = n * 2
      print(n)
    answer: "24"
    explanation: "The kernel follows the order you ran cells, not their position on the page. Cell 1: n = 1. Cell 3: n = 1 × 2 = 2 (prints 2). Cell 2: n = 2 + 10 = 12. Cell 3 again: n = 12 × 2 = 24, which it prints."
  - id: f0-notebooks-02
    type: mcq
    prompt: "A notebook works for you, but a classmate who runs it top to bottom gets `NameError: name 'data' is not defined`. What is the most likely cause?"
    explanation: "Your kernel still remembers a variable from a cell you ran earlier and later deleted or edited. Restarting the kernel and running all cells from the top would have revealed it."
    options:
      - text: Your kernel remembered a variable from a cell that has since been deleted or changed
        correct: true
        why: The kernel keeps what you ran, even if the code that created it is no longer in the notebook.
      - text: Your classmate has a different screen size
        why: Display size has no effect on which variables exist.
      - text: Notebooks can only be run on the computer that created them
        why: .ipynb files are portable; they run anywhere with the needed libraries.
      - text: NameError means a library is not installed
        why: A missing library raises ModuleNotFoundError; NameError means a variable or function name doesn't exist.
  - id: f0-notebooks-03
    type: multi
    prompt: "Which statements about the free tier of Google Colab are true?"
    explanation: "Colab is free but its resources are not guaranteed: GPU access varies, sessions end after at most about 12 hours (sooner if idle), and files on the runtime vanish when it is recycled. Notebooks themselves live in Google Drive."
    options:
      - text: GPU access is not guaranteed and can vary with demand and your usage
        correct: true
        why: Colab's FAQ says free resources are not guaranteed and not unlimited.
      - text: Files you upload to the runtime are lost when the runtime is recycled
        correct: true
        why: The virtual machine is deleted; save important files to Drive.
      - text: Notebooks you create are saved in your Google Drive
        correct: true
        why: New notebooks go to the Colab Notebooks folder in Drive.
      - text: A session can run for as long as you like if you keep the tab open
        why: Free sessions have a maximum lifetime of about 12 hours.
  - id: f0-notebooks-04
    type: mcq
    prompt: "You start JupyterLab with `uv run --with jupyter jupyter lab`, then close the Terminal window. What happens?"
    explanation: "The terminal is running the Jupyter server. Closing it stops the server, so the browser tab can no longer run cells."
    options:
      - text: Jupyter stops, and the notebook in the browser can no longer run code
        correct: true
        why: The browser page is only a window onto the server running in the terminal.
      - text: Nothing; Jupyter keeps running in the browser on its own
        why: The browser doesn't run Python here; the server process does.
      - text: Jupyter moves to Google Colab
        why: Local Jupyter and Colab are unrelated services.
  - id: f0-notebooks-05
    type: cloze
    prompt: "In Jupyter and Colab, the keyboard shortcut that runs the current cell and moves to the next one is ____ + Enter."
    explanation: "Shift + Enter runs the cell and advances. It works in both JupyterLab and Colab."
    accept: ["Shift", "shift key", "⇧"]
  - id: f0-notebooks-06
    type: mcq
    prompt: "In a Colab cell you type `!nvidia-smi`. What does the `!` do?"
    explanation: "In a notebook, a line starting with ! is sent to the shell rather than to Python. nvidia-smi is a shell program that reports on NVIDIA GPUs."
    options:
      - text: It runs the line as a shell command instead of Python
        correct: true
        why: That is the notebook convention for shell commands.
      - text: It makes the line run on the GPU
        why: The ! has nothing to do with where code runs; nvidia-smi only reports on the GPU.
      - text: It means "not", so the line is skipped
        why: In Python, not-equal is !=, but a leading ! in a notebook cell means shell command.
      - text: It marks the cell as important so Colab keeps it after a restart
        why: There is no such feature; the notebook is saved in Drive anyway.
  - id: f0-notebooks-07
    type: order
    prompt: "Put these steps in order to train a model on a free GPU in Colab and keep the result."
    explanation: "Open the notebook, switch the runtime to a GPU (which restarts the machine, so do it first), check it, train, then save the result to Drive before the runtime is recycled."
    items:
      - Open the notebook in Colab
      - Change the runtime type to a GPU
      - Run !nvidia-smi to confirm the GPU is there
      - Run the training cells
      - Save the trained model to Google Drive
  - id: f0-notebooks-08
    type: mcq
    prompt: "A cell's last line is `x * 2`, with no print, and x is the NumPy array [0, 1, 2]. What happens when you run the cell?"
    explanation: "A notebook displays the value of a cell's last expression automatically, so you see array([0, 2, 4])."
    options:
      - text: The notebook shows array([0, 2, 4]) below the cell
        correct: true
        why: The last expression's value is displayed even without print.
      - text: Nothing is shown, because there is no print
        why: That is true of a script run with uv run, but notebooks show the last value.
      - text: An error, because you can't multiply a list by 2
        why: x is a NumPy array, and multiplying an array by 2 multiplies each element (and even a list can be multiplied by 2; it repeats the list).
  - id: f0-notebooks-09
    type: mcq
    prompt: "Which job is better suited to JupyterLab on your 8 GB Mac than to Colab?"
    explanation: "Small, private, offline work suits your own machine. GPU training and big models suit Colab."
    options:
      - text: Exploring a small spreadsheet of your own private data, offline on a train
        correct: true
        why: Local Jupyter works without internet and your data never leaves your computer.
      - text: Training a neural network on thousands of images
        why: That needs a GPU; use Colab.
      - text: Running a notebook from your phone's browser
        why: Your local Jupyter isn't reachable from your phone; Colab works from any browser.
  - id: f0-notebooks-10
    type: multi
    prompt: "Which are good habits when working in notebooks?"
    explanation: "Restart-and-run-all checks a notebook really works; putting installs at the top makes setup repeatable; saving results to Drive protects them on Colab. Running cells in random order is how hidden-state bugs start."
    options:
      - text: Restart the kernel and run all cells before sharing a notebook
        correct: true
        why: It proves the notebook works from a clean start.
      - text: Put any %pip install cells at the top of the notebook
        correct: true
        why: On Colab installs last only for the current runtime, so they must rerun first each time.
      - text: Save important outputs on Colab to Google Drive
        correct: true
        why: Files on the runtime disappear when it is recycled.
      - text: Run cells in whatever order is convenient and never restart
        why: This builds up hidden state that others can't reproduce.
