items:
  - id: f0-python-with-uv-01
    type: mcq
    prompt: "Project A needs version 1 of a library and project B needs version 2. What lets both work on the same laptop?"
    explanation: "Each project gets its own virtual environment (.venv) with its own copy of its libraries, so upgrading one project's library can't break the other."
    options:
      - text: Giving each project its own virtual environment
        correct: true
        why: Each .venv holds its own versions, so the projects never share, or fight over, a library.
      - text: Installing both versions into the Mac's built-in Python
        why: One Python environment can hold only one version of a library at a time, and Apple's Python is best left alone.
      - text: Using a newer version of Python
        why: The Python version doesn't solve a clash between two library versions.
      - text: Restarting the Terminal between projects
        why: Restarting the shell doesn't change which libraries are installed.
  - id: f0-python-with-uv-02
    type: order
    prompt: "Put these steps in order to go from nothing to running a NumPy script in a new project."
    explanation: "uv must be installed first, then the project created (uv fetches Python if needed), then the library added, and only then can the script that imports it run."
    items:
      - "curl -LsSf https://astral.sh/uv/install.sh | sh"
      - "uv init --python 3.13"
      - "uv add numpy"
      - "uv run stats.py"
  - id: f0-python-with-uv-03
    type: multi
    prompt: "You run `uv add numpy` in a project. Which of these happen?"
    explanation: "uv add installs the library into the project's .venv (creating it if needed), lists it in pyproject.toml, and records exact versions in uv.lock. It does not touch the Mac's built-in Python."
    options:
      - text: numpy is listed as a dependency in pyproject.toml
        correct: true
        why: That is how the project remembers what it needs.
      - text: The exact installed versions are recorded in uv.lock
        correct: true
        why: The lockfile makes the environment reproducible.
      - text: numpy is installed into the project's .venv
        correct: true
        why: Libraries go into the project's own virtual environment.
      - text: numpy becomes available to every Python on the computer
        why: The point of a virtual environment is that it doesn't; only this project sees it.
  - id: f0-python-with-uv-04
    type: mcq
    prompt: "After installing uv, typing `uv --version` gives `zsh: command not found: uv`. What is the most likely fix?"
    explanation: "The installer added uv's folder to the shell's search path, but a running shell only reads that setting when it starts. Opening a new window (or running the command the installer printed) fixes it."
    options:
      - text: Open a new Terminal window so the shell reloads its search path
        correct: true
        why: The search path is read at shell startup, so the old window doesn't know about uv yet.
      - text: Reinstall macOS
        why: Far too drastic; this is a routine path issue.
      - text: Type sudo uv --version
        why: sudo runs a command as administrator; it doesn't help the shell find a program, and you should avoid it unless you know why you need it.
      - text: Install Python first
        why: uv doesn't need Python to run; it installs Python for you.
  - id: f0-python-with-uv-05
    type: output
    prompt: "In the course project (with NumPy added), you run `uv run stats.py`. stats.py contains the code below. What does it print?"
    code: |
      import numpy as np
      scores = np.array([2, 4, 9])
      print("mean:", scores.mean())
    answer: "mean: 5.0"
    explanation: "(2 + 4 + 9) / 3 = 5. NumPy's mean returns a float, which prints as 5.0, and print puts a space between its two arguments."
  - id: f0-python-with-uv-06
    type: mcq
    prompt: "Your project's environment seems broken: imports fail in strange ways. What is the safest fix?"
    explanation: ".venv is disposable. Deleting it and running uv sync rebuilds it exactly from pyproject.toml and uv.lock."
    options:
      - text: Delete the .venv folder and run uv sync
        correct: true
        why: The environment is rebuilt from the project's recorded dependencies, so nothing is lost.
      - text: Delete pyproject.toml and uv.lock
        why: Those files are the record of what the project needs; deleting them loses information.
      - text: Edit the files inside .venv by hand
        why: uv manages .venv; hand edits are fragile and get overwritten.
      - text: Install the libraries into Apple's python3 instead
        why: That mixes environments and is exactly what we are avoiding.
  - id: f0-python-with-uv-07
    type: cloze
    prompt: "The command that runs a script using the project's own Python and libraries is `uv ____ stats.py`."
    explanation: "`uv run` syncs the environment if needed, then runs the script inside it."
    accept: ["run"]
  - id: f0-python-with-uv-08
    type: mcq
    prompt: "Which file should you share with a friend so they get exactly the same library versions as you?"
    explanation: "uv.lock records the exact version of every installed package. Together with pyproject.toml it lets uv sync rebuild an identical environment. The .venv folder itself is machine-specific and not meant to be shared."
    options:
      - text: uv.lock (along with pyproject.toml)
        correct: true
        why: The lockfile pins every exact version; uv sync recreates the environment from it.
      - text: The .venv folder
        why: .venv is large, specific to your machine, and can be rebuilt; share the recipe, not the result.
      - text: stats.py
        why: The script uses the libraries but doesn't say which versions to install.
      - text: Nothing; library versions are always the same everywhere
        why: Libraries release new versions often, which is why the lockfile exists.
  - id: f0-python-with-uv-09
    type: mcq
    prompt: "In the terminal you see the prompt `>>>`. What is going on?"
    explanation: "`>>>` is the Python REPL's prompt. You are typing Python, not shell commands; leave with exit() or Ctrl + D."
    options:
      - text: You are inside an interactive Python session, typing Python code
        correct: true
        why: The REPL shows >>> while it waits for Python input.
      - text: zsh is waiting for a shell command
        why: zsh's prompt ends with %, not >>>.
      - text: The terminal has crashed
        why: Nothing is wrong; it is waiting for your input.
  - id: f0-python-with-uv-10
    type: numeric
    prompt: "You have 4 projects, each with its own virtual environment. Each installs NumPy and matplotlib, about 60 MB in total per environment. Roughly how many MB is that across all environments, if nothing is shared?"
    explanation: "4 × 60 = 240 MB. (uv actually saves space by keeping one cached copy and linking it into environments where it can, so the real cost is usually lower; separate environments are cheap.)"
    answer: 240
    tol: 0.5
