items:
  - id: f6-what-is-optimisation-01
    type: mcq
    prompt: "In training a model $\\hat{y} = w x + b$ by minimising $L(w, b)$, which of these are the **parameters**?"
    explanation: "Parameters are what the optimiser is free to change. The data are fixed during training, and the learning rate is a hyperparameter you choose."
    options:
      - text: w and b
        correct: true
        why: The optimiser adjusts w and b to lower the loss.
      - text: The inputs x and targets y
        why: The data are held fixed while we search for good parameters.
      - text: The learning rate
        why: That is a hyperparameter, chosen by you rather than learned by the optimiser.
      - text: The loss value L
        why: The loss is the quantity being minimised, not something we set.
  - id: f6-what-is-optimisation-02
    type: numeric
    prompt: "For $L(w) = (w - 3)^2 + 1$, what is $\\arg\\min_w L(w)$?"
    answer: 3
    tol: 0
    explanation: "The square is smallest (zero) at w = 3. The minimum value is 1, but argmin asks where it happens, which is w = 3."
  - id: f6-what-is-optimisation-03
    type: numeric
    prompt: "For $L(w) = (w - 3)^2 + 1$, what is $\\min_w L(w)$?"
    answer: 1
    tol: 0
    explanation: "min returns the value of the function at its lowest point: (3 - 3)² + 1 = 1."
  - id: f6-what-is-optimisation-04
    type: mcq
    prompt: "You want the parameters that **maximise** a function $g(\\boldsymbol{\\theta})$, but your library only minimises. What do you minimise?"
    explanation: "The highest point of g is the lowest point of -g, so argmax g = argmin (-g)."
    options:
      - text: "-g(θ)"
        correct: true
        why: Flipping the sign turns peaks into valleys at the same place.
      - text: "1 - g(θ) squared"
        why: Squaring changes where the optimum is whenever g can be negative.
      - text: "g(θ) itself, then take the last value"
        why: Minimising g finds its lowest point, the opposite of what you want.
      - text: "The gradient of g"
        why: The gradient is a vector, not a number to minimise, and it is zero at minima too.
  - id: f6-what-is-optimisation-05
    type: numeric
    prompt: "A grid search tries 10 values for each parameter. How many loss evaluations does it need for a model with 6 parameters?"
    answer: 1000000
    tol: 0
    explanation: "Every combination must be tried: 10 × 10 × … six times = 10⁶. The count grows exponentially with the number of parameters."
  - id: f6-what-is-optimisation-06
    type: multi
    prompt: "At a point $\\boldsymbol{\\theta}$, the gradient $\\nabla L(\\boldsymbol{\\theta}) = \\mathbf{0}$. Which could $\\boldsymbol{\\theta}$ be? Select all that apply."
    explanation: "Any stationary point has zero gradient: minima, maxima and saddle points alike. A zero gradient alone does not prove a minimum."
    options:
      - text: A global minimum
        correct: true
        why: The tangent is flat at the lowest point.
      - text: A local minimum that is not global
        correct: true
        why: Every local minimum has a flat tangent too.
      - text: A local maximum
        correct: true
        why: The top of a hill is also flat.
      - text: A saddle point
        correct: true
        why: For example x² - y² at the origin, a minimum along x and a maximum along y.
  - id: f6-what-is-optimisation-07
    type: mcq
    prompt: "Why is convexity such a useful property for an optimisation problem?"
    explanation: "For a convex function every local minimum is a global minimum, so any valley that a descent method settles into is the best one."
    options:
      - text: Every local minimum is also a global minimum
        correct: true
        why: There are no bad valleys to get stuck in.
      - text: The gradient is never zero
        why: A convex function such as x² has zero gradient at its minimum.
      - text: Any learning rate works
        why: Gradient descent can still diverge on a convex function if the step is too large.
      - text: The minimum is always at the origin
        why: (x - 3)² is convex with its minimum at 3.
  - id: f6-what-is-optimisation-08
    type: multi
    prompt: "Which of these functions of one variable are convex? Select all that apply."
    explanation: "x², eˣ and |x| curve upwards everywhere (or are straight pieces), so every chord lies above the graph. x³ curves downwards for x < 0, and sin x alternates."
    options:
      - text: "x²"
        correct: true
        why: Its second derivative is 2, never negative.
      - text: "eˣ"
        correct: true
        why: Its second derivative eˣ is always positive.
      - text: "|x|"
        correct: true
        why: Two straight pieces meeting in a V; every chord lies on or above it.
      - text: "x³"
        why: For x < 0 the second derivative 6x is negative, so chords dip below the graph there.
      - text: "sin x"
        why: It has many hills and valleys; chords across a hill lie below it.
  - id: f6-what-is-optimisation-09
    type: output
    prompt: "What does this print?"
    code: |
      import numpy as np
      f = np.array([5, 2, 4, 1, 3, 0])
      inner = f[1:-1]
      is_min = (inner < f[:-2]) & (inner < f[2:])
      print(np.nonzero(is_min)[0] + 1, np.argmin(f))
    answer: "[1 3] 5"
    explanation: "Interior points 2 (index 1) and 1 (index 3) are lower than both neighbours. The last value 0 is the smallest overall but has only one neighbour, so it is not counted as an interior local minimum, yet argmin finds it at index 5."
  - id: f6-what-is-optimisation-10
    type: mcq
    prompt: "Which loss is **not** convex in its parameters?"
    explanation: "Linear regression with MSE and logistic regression with cross-entropy are convex. A neural network with a hidden layer has a non-convex loss with many local minima and saddles."
    options:
      - text: The MSE loss of a neural network with one hidden layer
        correct: true
        why: Hidden layers make the loss surface non-convex.
      - text: The MSE loss of linear regression
        why: It is a bowl in the weights.
      - text: The cross-entropy loss of logistic regression
        why: That one is convex too, which F7 relies on.
      - text: "L(w) = (w - 3)²"
        why: A shifted parabola is convex.
