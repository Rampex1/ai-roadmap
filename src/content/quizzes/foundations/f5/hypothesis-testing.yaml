items:
  - id: f5-hypothesis-testing-01
    type: mcq
    prompt: "An A/B test gives $p = 0.03$. Which statement is correct?"
    explanation: "A p-value is the probability of data at least this extreme assuming the null hypothesis is true. It is not the probability that the null hypothesis is true."
    options:
      - text: If there were truly no difference, a difference at least this large would appear about 3% of the time
        correct: true
        why: This is the definition, P(data this extreme | H0).
      - text: There is a 3% chance that there is no difference
        why: That is P(H0 | data), which needs a prior; reading p this way flips the conditional.
      - text: There is a 97% chance the new version is better
        why: The p-value does not give the probability of any hypothesis.
      - text: The new version is 3% better
        why: The p-value is not an effect size.
  - id: f5-hypothesis-testing-02
    type: multi
    prompt: "Which of these are **valid** conclusions or practices around p-values? Select all."
    explanation: "Report effect sizes with intervals, pre-register the main comparison, and remember that large p-values do not prove the absence of an effect."
    options:
      - text: Reporting the size of the difference with a confidence interval alongside the p-value
        correct: true
        why: The effect size says whether the difference matters; the CI says how precisely it is known.
      - text: Deciding the main comparison before looking at the data
        correct: true
        why: This guards against p-hacking.
      - text: "Concluding there is no effect because p = 0.4"
        why: A large p-value means the data are consistent with no effect, not that the effect is zero; the study may be too small.
      - text: Running 30 analyses and reporting only the one with p below 0.05
        why: That is p-hacking; with 30 tests a false positive is likely.
  - id: f5-hypothesis-testing-03
    type: order
    prompt: "Put the steps of a permutation test for an A/B experiment in order."
    items:
      - "Compute the observed difference in means between B and A"
      - "Pool both groups together"
      - "Shuffle the pool and split it into fake groups of the original sizes, recording their difference"
      - "Repeat the shuffling thousands of times"
      - "Report the fraction of shuffled differences at least as extreme as the observed one"
    explanation: "Observe, pool, shuffle and record, repeat, then compare the observed difference with the shuffled ones."
  - id: f5-hypothesis-testing-04
    type: mcq
    prompt: "Why is shuffling the group labels a valid way to simulate the null hypothesis in a randomised A/B test?"
    explanation: "Under H0 the page has no effect, so each visitor's outcome would be the same whichever group they were in; the labels are interchangeable, and shuffling them produces the differences chance alone would create."
    options:
      - text: If the change has no effect, each outcome would be the same in either group, so the labels are interchangeable
        correct: true
        why: Random assignment plus no effect makes the labels exchangeable.
      - text: Shuffling makes the groups larger
        why: The group sizes stay the same.
      - text: Shuffling removes outliers
        why: Every value stays in the pool.
      - text: Shuffling makes the data normally distributed
        why: The permutation test needs no normality assumption at all.
  - id: f5-hypothesis-testing-05
    type: numeric
    prompt: "You run 10 independent tests where the null hypothesis is true in every case, each at the 0.05 level. What is the probability of **at least one** false positive? Give a decimal."
    answer: 0.4013
    tol: 0.001
    explanation: "1 - 0.95^10 ≈ 1 - 0.5987 = 0.4013. Testing many things makes a fluke likely."
  - id: f5-hypothesis-testing-06
    type: output
    prompt: "What does this print?"
    code: |
      import numpy as np
      diffs = np.array([0.5, -2.0, 1.0, -0.2, 3.0, -1.5, 0.1, 2.5])
      observed = 2.0
      print(np.mean(np.abs(diffs) >= abs(observed)))
    answer: "0.375"
    explanation: "The absolute shuffled differences at least 2.0 are 2.0, 3.0 and 2.5: 3 of 8, so the two-sided p-value is 0.375."
  - id: f5-hypothesis-testing-07
    type: mcq
    prompt: "With 5 million users per group, a test finds the new design raises conversion from 10.00% to 10.02%, with $p = 0.001$. What is the best reading?"
    explanation: "Huge samples detect tiny differences. The effect is real but may be too small to matter; statistical significance is not practical significance."
    options:
      - text: The difference is probably real but tiny; whether it matters is a business question, not a statistical one
        correct: true
        why: Statistical significance says the effect is unlikely to be zero, not that it is large.
      - text: The new design is a big improvement because p is very small
        why: A small p-value does not mean a large effect.
      - text: The result must be a false positive because the difference is so small
        why: With millions of users, small real differences are detectable.
      - text: The p-value should be ignored with large samples
        why: It is valid; it just answers a narrower question than effect size.
  - id: f5-hypothesis-testing-08
    type: numeric
    prompt: "With the Bonferroni correction, what p-value threshold should each of 20 tests use to keep the overall false positive rate at about 0.05?"
    answer: 0.0025
    tol: 0.00001
    explanation: "Divide the level by the number of tests: 0.05 / 20 = 0.0025."
  - id: f5-hypothesis-testing-09
    type: cloze
    prompt: "The default, \"nothing is going on\" explanation that a test assumes in order to compute a p-value is called the ________ hypothesis."
    accept: ["null"]
    explanation: "The null hypothesis H0, for example \"the coin is fair\" or \"the page makes no difference\"."
  - id: f5-hypothesis-testing-10
    type: mcq
    prompt: "Model B beats model A by 0.4 accuracy points on one run each. What is the most useful next step to judge whether B is really better?"
    explanation: "A single run mixes the true difference with noise from the test sample and the random seed. Repeating over seeds and testing per-example results (permutation or bootstrap) shows whether the gap is larger than the noise."
    options:
      - text: Repeat both with several random seeds and test the difference, for example with a permutation test on per-example results
        correct: true
        why: This measures how big chance differences are.
      - text: Accept B, because any improvement counts
        why: The gap may be pure noise.
      - text: Tune B on the test set until the gap is larger
        why: That leaks the test set and is a form of p-hacking.
      - text: Report the larger number to more decimal places
        why: More digits do not reduce noise.
