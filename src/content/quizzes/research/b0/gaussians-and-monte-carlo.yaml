items:
  - id: b0-gaussians-and-monte-carlo-01
    type: mcq
    prompt: "`Z` has shape (n, d) with independent standard normal entries, `L = np.linalg.cholesky(Sigma)`, and `mu` has length d. Which line gives n samples from N(mu, Sigma) as rows?"
    options:
      - text: "mu + Z @ L.T"
        correct: true
        why: "Row i is (μ + Lz_i)ᵀ = μᵀ + z_iᵀLᵀ, with covariance LLᵀ = Σ."
      - text: "mu + Z @ L"
        why: "Each row would be μ + Lᵀz, whose covariance is LᵀL, generally not Σ."
      - text: "mu + Z @ Sigma"
        why: "The covariance would be Σ², not Σ."
      - text: "mu + Z * np.diag(Sigma)"
        why: "This ignores the correlations and scales by variances instead of standard deviations."
    explanation: "Cov(Lz) = L Lᵀ = Σ. With samples stored as rows, the product becomes Z @ L.T."
  - id: b0-gaussians-and-monte-carlo-02
    type: numeric
    prompt: |
      $(x_1, x_2)$ is Gaussian with mean $(0, 0)$ and covariance $\begin{pmatrix} 2 & 1 \\ 1 & 1 \end{pmatrix}$. What is $\mathbb{E}[x_1 \mid x_2 = 3]$?
    answer: 3
    tol: 0.001
    explanation: "μ₁ + Σ₁₂Σ₂₂⁻¹(x₂ − μ₂) = 0 + (1/1)(3 − 0) = 3."
  - id: b0-gaussians-and-monte-carlo-03
    type: numeric
    prompt: |
      Same Gaussian: mean $(0, 0)$, covariance $\begin{pmatrix} 2 & 1 \\ 1 & 1 \end{pmatrix}$. What is $\operatorname{Var}(x_1 \mid x_2 = 3)$?
    answer: 1
    tol: 0.001
    explanation: "Σ₁₁ − Σ₁₂Σ₂₂⁻¹Σ₂₁ = 2 − 1·1·1 = 1. It does not depend on the observed value 3, and it is smaller than the marginal variance 2."
  - id: b0-gaussians-and-monte-carlo-04
    type: mcq
    prompt: "X is uniform on (0, 1) and Y = 2X. What is the density of Y on (0, 2)?"
    options:
      - text: "y/2"
        why: "A linear map of a uniform variable stays uniform."
      - text: "2"
        why: "The stretch divides the density; it does not multiply it."
      - text: "1/2"
        correct: true
        why: "p_Y(y) = p_X(y/2) · |d(y/2)/dy| = 1 · 1/2."
      - text: "1"
        why: "That forgets the Jacobian factor: a density of 1 on an interval of length 2 would integrate to 2."
    explanation: "Change of variables: the same probability is spread over twice the length, so the density halves."
  - id: b0-gaussians-and-monte-carlo-05
    type: numeric
    prompt: "A Monte Carlo estimate averages f over N = 10,000 independent samples, and f(X) has standard deviation 2. What is the standard error of the estimate?"
    answer: 0.02
    rtol: 0.001
    explanation: "σ_f/√N = 2/100 = 0.02. A 95% error bar is about ± 0.039."
  - id: b0-gaussians-and-monte-carlo-06
    type: mcq
    prompt: "How many times more samples do you need to halve a Monte Carlo error bar?"
    options:
      - text: "4"
        correct: true
        why: "1/√(4N) = (1/2)(1/√N)."
      - text: "2"
        why: "The error shrinks like 1/√N, so doubling N only divides it by √2."
      - text: "8"
        why: "That would be needed for an error shrinking like 1/N^(1/3)."
      - text: "It depends on the dimension of X"
        why: "The 1/√N rate does not depend on the dimension, which is Monte Carlo's great strength."
    explanation: "Standard error σ_f/√N: 4× the samples for 2× the accuracy, 100× for 10×."
  - id: b0-gaussians-and-monte-carlo-07
    type: multi
    prompt: "For a jointly Gaussian vector split into blocks x₁ and x₂, which statements are true?"
    options:
      - text: "The conditional mean is an affine function of x₂"
        correct: true
        why: "μ₁ + Σ₁₂Σ₂₂⁻¹(x₂ − μ₂) is a linear map plus a constant offset."
      - text: "The conditional covariance does not depend on the observed value of x₂"
        correct: true
        why: "Σ₁₁ − Σ₁₂Σ₂₂⁻¹Σ₂₁ has no x₂ in it."
      - text: "The conditional distribution of x₁ given x₂ is Gaussian"
        correct: true
        why: "Gaussians are closed under conditioning."
      - text: "The marginal of x₁ has to be found by numerical integration"
        why: "It is just N(μ₁, Σ₁₁): drop the other blocks."
    explanation: "Closed-form marginals and conditionals are why Gaussians power Kalman filters and Gaussian processes."
  - id: b0-gaussians-and-monte-carlo-08
    type: output
    prompt: "What does this print?"
    code: |
      import numpy as np
      L = np.linalg.cholesky(np.array([[4.0, 2.0], [2.0, 2.0]]))
      print(L)
    answer: |
      [[2. 0.]
       [1. 1.]]
    explanation: "L₁₁ = √4 = 2, L₂₁ = 2/2 = 1, L₂₂ = √(2 − 1²) = 1. Check: L Lᵀ = [[4, 2], [2, 2]]."
  - id: b0-gaussians-and-monte-carlo-09
    type: mcq
    prompt: "You estimate E[f(X)] by Monte Carlo where f(X) has a very heavy right tail. What typically goes wrong?"
    options:
      - text: "Nothing: the error bar accounts for it"
        why: "The error bar is estimated from the same samples, which have usually missed the rare huge values."
      - text: "The estimate is biased upwards"
        why: "The estimator is unbiased on average; a typical run is too low, balanced by rare runs that are far too high."
      - text: "A typical run underestimates both the mean and its error bar, so the interval can confidently miss the truth"
        correct: true
        why: "As in the lesson's E[exp(3X)] run: 56.56 ± 10.89 when the truth was 90.02."
      - text: "The estimate does not converge as N grows"
        why: "If the variance is finite, it does converge, only slowly and erratically."
    explanation: "Warning signs: error bars that jump between seeds and a mean dominated by a few samples."
  - id: b0-gaussians-and-monte-carlo-10
    type: cloze
    prompt: "The eigenvectors of a Gaussian's covariance matrix give the axes of its density's contour ____ (one word, plural)."
    accept: [ "ellipses", "ellipsoids" ]
    explanation: "The contours are ellipses (ellipsoids in higher dimensions) with axes along the eigenvectors and half-lengths proportional to the square roots of the eigenvalues."
