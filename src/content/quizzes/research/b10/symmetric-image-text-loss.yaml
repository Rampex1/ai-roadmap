  - id: b10-symmetric-image-text-loss-01
    type: mcq
    prompt: What does one row represent?
    explanation: Rows anchor image-to-text retrieval.
    options:
      - text: All images compared with one caption
        why: That is one column.
      - text: One image compared with every caption
        why: Rows anchor image-to-text retrieval.
        correct: true
      - text: Only already correct matches
        why: The row includes competitors.
  - id: b10-symmetric-image-text-loss-02
    type: mcq
    prompt: How many losses are averaged for N pairs?
    explanation: Each image and each caption anchors a row loss.
    options:
      - text: 2N
        why: Each image and each caption anchors a row loss.
        correct: true
      - text: N squared
        why: Each entry is a score, not a complete row loss.
      - text: Only one
        why: The loss aggregates anchors.
  - id: b10-symmetric-image-text-loss-03
    type: mcq
    prompt: Why require identical pair order?
    explanation: Reordering one modality changes label identity.
    options:
      - text: The positives are assumed to lie on the diagonal
        why: Reordering one modality changes label identity.
        correct: true
      - text: Matrix multiplication changes its dtype otherwise
        why: Ordering is semantic.
      - text: The temperature equals the number of pairs
        why: Temperature is independent.
  - id: b10-symmetric-image-text-loss-04
    type: mcq
    prompt: What can duplicate valid matches require?
    explanation: Treating valid matches as negative is misleading.
    options:
      - text: Ignoring one retrieval direction always
        why: That does not solve the pairing assumption.
      - text: An unconditional ban on duplicate words
        why: Duplicates in a caption are a different issue.
      - text: A multiple-positive objective or suitable deduplication
        why: Treating valid matches as negative is misleading.
