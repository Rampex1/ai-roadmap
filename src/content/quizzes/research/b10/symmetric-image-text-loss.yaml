  - id: b10-symmetric-image-text-loss-06
    type: cloze
    prompt: A symmetric matrix-based training loss scores rows and ______.
    accept:
      - columns
      - column
    explanation: They anchor the other retrieval direction.
  - id: b10-symmetric-image-text-loss-07
    type: order
    prompt: Order the bidirectional loss.
    items:
      - Align image and caption IDs
      - Build the similarity matrix
      - Evaluate anchored losses in both directions
      - Average the row and column losses
    explanation: Alignment establishes correct positive targets.
  - id: b10-symmetric-image-text-loss-08
    type: output
    prompt: What does this print?
    code: |
      def symmetric_loss(matrix,temperature):
          if not matrix or any(len(row)!=len(matrix) for row in matrix):
              raise ValueError("expected a nonempty square batch")
          from math import exp,log
          if temperature<=0:
              raise ValueError("temperature must be positive")
          def contrastive_row(scores,positive,temperature):
              high=max(scores)
              scaled=[(score-high)/temperature for score in scores]
              return log(sum(exp(value) for value in scaled))-scaled[positive]
          n=len(matrix)
          row_losses=[contrastive_row(row,i,temperature) for i,row in enumerate(matrix)]
          column_losses=[contrastive_row(list(column),i,temperature) for i,column in enumerate(zip(*matrix))]
          return sum(row_losses+column_losses)/(2*n)

      print(symmetric_loss([[7]], 1))
    answer: "0.0"
    explanation: A single candidate gets probability one in both directions.
