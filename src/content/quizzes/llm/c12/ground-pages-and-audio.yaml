items:
  - id: c12-ground-pages-and-audio-01
    type: mcq
    prompt: Which interval covers time 4 if segments are [0,4) and [4,8)?
    explanation: The start is included and the end is excluded.
    options:
      - text: Both
        why: The first excludes time 4.
      - text: Neither
        why: The second starts at 4.
      - text: The second
        why: The start is included and the end is excluded.
        correct: true
  - id: c12-ground-pages-and-audio-02
    type: mcq
    prompt: Why store coordinate units for page boxes?
    explanation: A viewer needs the convention to locate the region.
    options:
      - text: Pixels and normalised coordinates are different scales
        why: A viewer needs the convention to locate the region.
        correct: true
      - text: Units change the model vocabulary
        why: They describe metadata.
      - text: It guarantees zero OCR errors
        why: Coordinates do not validate text.
  - id: c12-ground-pages-and-audio-03
    type: mcq
    prompt: What supports verifying a disputed quote?
    explanation: A reviewer can listen to the cited segment.
    options:
      - text: Only the transcript length
        why: Length cannot recover the quote.
      - text: Only a confidence estimate
        why: Confidence does not replace evidence.
      - text: The source recording and time range
        why: A reviewer can listen to the cited segment.
        correct: true
  - id: c12-ground-pages-and-audio-04
    type: mcq
    prompt: When should missing evidence trigger abstention?
    explanation: Missing source support matters to correctness.
    options:
      - text: Never if the text looks fluent
        why: Fluency is not evidence.
      - text: When the required claim cannot be supported
        why: Missing source support matters to correctness.
        correct: true
      - text: Only when a time is exactly on a boundary
        why: Boundary handling is separate.
  - id: c12-ground-pages-and-audio-05
    type: multi
    prompt: Which are useful provenance fields?
    explanation: It identifies the original media. They locate the evidence within the media.
    options:
      - text: A made-up source title
        why: It breaks traceability.
      - text: Stable source ID
        why: It identifies the original media.
        correct: true
      - text: Time offsets or page coordinates
        why: They locate the evidence within the media.
        correct: true
  - id: c12-ground-pages-and-audio-06
    type: cloze
    prompt: An interval that includes the start and excludes the end is ______.
    accept:
      - half-open
      - half open
    explanation: Adjacent ranges then do not double-count a boundary.
  - id: c12-ground-pages-and-audio-07
    type: order
    prompt: Order a timestamped evidence lookup.
    items:
      - Transcribe and retain segment offsets
      - Retrieve relevant segment text
      - Check the claimed time range
      - Cite the source and verified range
    explanation: Time provenance enables source inspection.
  - id: c12-ground-pages-and-audio-08
    type: output
    prompt: What does this print?
    code: |
      def transcript_segment(segments, time):
          for start, end, text in segments:
              if start <= time < end:
                  return text
          return None

      print(transcript_segment([(1,3,"speech")], 3))
    answer: None
    explanation: The end is excluded, so the timestamp matches no segment.
