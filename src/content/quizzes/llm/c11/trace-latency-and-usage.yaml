items:
  - id: c11-trace-latency-and-usage-01
    type: mcq
    prompt: Which signal captures the wait to see streaming text?
    explanation: It measures the first displayable milestone.
    options:
      - text: Time to first visible text
        why: It measures the first displayable milestone.
        correct: true
      - text: Only total completion latency
        why: The final milestone comes later.
      - text: Input token count
        why: A count does not measure time.
  - id: c11-trace-latency-and-usage-02
    type: mcq
    prompt: Why can the model and tool span times exceed wall time when summed?
    explanation: Concurrent operations occupy common time.
    options:
      - text: Tracing changes the number of milliseconds in a second
        why: Units stay fixed.
      - text: Tokens are counted twice by definition
        why: A token count is separate.
      - text: Spans may overlap
        why: Concurrent operations occupy common time.
        correct: true
  - id: c11-trace-latency-and-usage-03
    type: mcq
    prompt: What is a useful low-cardinality metric label?
    explanation: A bounded set of versions supports aggregation.
    options:
      - text: Deployment version
        why: A bounded set of versions supports aggregation.
        correct: true
      - text: A distinct request ID for every call
        why: That creates many metric series.
      - text: Raw prompt text
        why: It can be sensitive and creates many values.
  - id: c11-trace-latency-and-usage-04
    type: mcq
    prompt: What does p95 over successes omit?
    explanation: Only successful observations contribute.
    options:
      - text: Failed requests such as timeouts
        why: Only successful observations contribute.
        correct: true
      - text: The slowest successful requests entirely
        why: The percentile is calculated from their distribution.
      - text: All responses with input tokens
        why: Success is the given filter.
  - id: c11-trace-latency-and-usage-05
    type: multi
    prompt: Which are helpful operational measures?
    explanation: They support a meaningful error rate. Timing is interpretable only with a definition.
    options:
      - text: Latency and its defined milestone
        why: Timing is interpretable only with a definition.
        correct: true
      - text: Failure counts and attempts
        why: They support a meaningful error rate.
        correct: true
      - text: Raw user content as a metric label
        why: Content is high-cardinality and may be private.
  - id: c11-trace-latency-and-usage-06
    type: cloze
    prompt: An operation with timing inside a trace is a ______.
    accept:
      - span
      - trace span
      - "spans"
    explanation: A span describes one operation.
  - id: c11-trace-latency-and-usage-07
    type: order
    prompt: Order a telemetry pipeline.
    items:
      - Choose the measurement and allowed fields
      - Capture request and operation timing
      - Project permitted metadata
      - Aggregate and inspect outcomes
    explanation: The collection contract determines what is stored.
  - id: c11-trace-latency-and-usage-08
    type: output
    prompt: What does this print?
    code: |
      def trace_metadata(event):
          fields = ("trace_id", "operation", "status", "duration_ms", "input_tokens", "output_tokens")
          return {field: event[field] for field in fields if field in event}

      print(trace_metadata({"status":"timeout","completion":"sample","input_tokens":1}))
    answer: "{'status': 'timeout', 'input_tokens': 1}"
    explanation: The status and input count are allowed.
