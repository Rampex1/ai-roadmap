items:
  - id: c11-bound-operating-cost-01
    type: mcq
    prompt: Why budget the output cap before admitting a call?
    explanation: Reserve a defensible upper estimate.
    options:
      - text: The output length is unknown at admission
        why: Reserve a defensible upper estimate.
        correct: true
      - text: Output tokens are always free
        why: They may have a different unit price.
      - text: The input count includes future output
        why: They are separate billing quantities.
  - id: c11-bound-operating-cost-02
    type: mcq
    prompt: What should reconcile a cost estimate?
    explanation: Estimates omit some billing details.
    options:
      - text: Measured provider usage and billing rules
        why: Estimates omit some billing details.
        correct: true
      - text: Only answer character count
        why: Characters do not directly measure billed tokens.
      - text: Only number of users
        why: Usage varies by request.
  - id: c11-bound-operating-cost-03
    type: mcq
    prompt: Why limit concurrent requests?
    explanation: Uncontrolled work can overload dependencies.
    options:
      - text: To bound admitted work under load
        why: Uncontrolled work can overload dependencies.
        correct: true
      - text: To increase every output limit
        why: Concurrency and output limits differ.
      - text: To make error rates unnecessary
        why: Availability still needs measurement.
  - id: c11-bound-operating-cost-04
    type: mcq
    prompt: What does cost per success include that cost per call can hide?
    explanation: Those calls can consume money without delivering success.
    options:
      - text: Only the fastest request
        why: No timing filter is implied.
      - text: Spend on failures and retries
        why: Those calls can consume money without delivering success.
        correct: true
      - text: Only fixed subscription fees
        why: Request charges still matter.
  - id: c11-bound-operating-cost-05
    type: multi
    prompt: Which budgets can a host enforce?
    explanation: It limits end-to-end time. It bounds repeat generations.
    options:
      - text: An overall deadline
        why: It limits end-to-end time.
        correct: true
      - text: A promise that every user will ask a short question
        why: Input lengths are not guaranteed.
      - text: Maximum model calls
        why: It bounds repeat generations.
        correct: true
  - id: c11-bound-operating-cost-06
    type: cloze
    prompt: The denominator for a price per million tokens is ______.
    accept:
      - "1000000"
      - 1,000,000
      - one million
      - 1000000 tokens
      - "1 million"
      - "a million"
      - "million"
      - "1_000_000"
      - "1e6"
      - "10^6"
      - "1,000,000 tokens"
    explanation: Convert measured token counts to millions.
  - id: c11-bound-operating-cost-07
    type: order
    prompt: Order an admitted request.
    items:
      - Estimate conservative cost and time bounds
      - Reserve remaining budget
      - Execute permitted work
      - Record usage and reconcile the reservation
    explanation: Execution takes place within the reservation.
  - id: c11-bound-operating-cost-08
    type: output
    prompt: What does this print?
    code: |
      def token_cost(input_tokens, output_tokens, input_per_million, output_per_million):
          return (input_tokens * input_per_million + output_tokens * output_per_million) / 1_000_000

      print(token_cost(500000, 250000, 2, 8))
    answer: "3.0"
    explanation: Input costs one dollar and output costs two.
