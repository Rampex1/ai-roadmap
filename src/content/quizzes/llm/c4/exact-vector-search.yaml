items:
  - id: c4-exact-vector-search-01
    type: mcq
    prompt: Why filter before final top-k?
    explanation: If the global top 2 are one tech note and one billing note, filtering afterwards to billing leaves one result, even when other billing notes scored almost as high. Restricting to eligible records first means all k slots go to eligible documents.
    options:
      - text: An ineligible document can consume a ranking slot
        why: Ineligible documents taken before filtering occupy slots that eligible documents should have had.
        correct: true
      - text: Filtering changes vector dimensions
        why: A record filter does not alter its vector.
      - text: Filtering always makes the ranking stochastic
        why: Eligibility can be deterministic.
  - id: c4-exact-vector-search-02
    type: mcq
    prompt: With the lesson's sort key (−score, id), how are documents with equal scores ordered?
    explanation: Python compares tuples element by element. Equal scores give equal first elements, so the second element, the ID, decides in ascending order. The same input then always gives the same output, which makes approximate results comparable run to run.
    options:
      - text: Ascending document ID
        why: When the negated scores are equal, the tuple comparison falls through to the ID, smallest first.
        correct: true
      - text: Random order
        why: The intended result is reproducible.
      - text: Reverse category order
        why: All eligible records share the category.
  - id: c4-exact-vector-search-03
    type: mcq
    prompt: Why keep an exact baseline?
    explanation: Brute force returns the true top-k for the chosen embedding, metric, filter and tie-break. Any faster index is measured by how many of those results it recovers. Without the baseline you cannot tell an index miss from a ranking change.
    options:
      - text: It establishes the top results for the chosen scores
        why: Brute force defines the true top-k that index recall is measured against.
        correct: true
      - text: It always agrees with human relevance
        why: Similarity is a proxy.
      - text: It cannot be measured
        why: Exact search is runnable.
  - id: c4-exact-vector-search-04
    type: mcq
    prompt: How much dot-product scoring work is required for n eligible d-dimensional records?
    explanation: Each of the n scores multiplies and adds d coordinate pairs, so the total is n × d multiply-adds, written O(n·d). Doubling the corpus or the dimension doubles the work.
    options:
      - text: Proportional to n times d
        why: Each of the n scores reads d coordinate pairs.
        correct: true
      - text: Proportional only to d
        why: The number of records affects the work.
      - text: Constant regardless of n and d
        why: Each record and coordinate contributes.
  - id: c4-exact-vector-search-05
    type: multi
    prompt: Which should affect ranked results?
    explanation: Trusted eligibility rules decide which documents may appear at all, and similarity orders the eligible ones. Authorisation must come from application data such as the logged-in user's workspace, never from a model's guess, which a prompt could manipulate.
    options:
      - text: A model guess about a user’s authorisation
        why: Authorisation requires trusted application data.
      - text: Document-to-query similarity
        why: It orders the eligible documents.
        correct: true
      - text: Trusted eligibility rules
        why: They decide which documents may be retrieved at all.
        correct: true
  - id: c4-exact-vector-search-06
    type: cloze
    prompt: Scoring every eligible record is called ______ search.
    accept:
      - exact
      - exhaustive
      - brute-force
      - brute force
      - bruteforce
      - flat
      - linear
    explanation: Exact, exhaustive, brute-force, flat or linear search all mean scoring every eligible vector. It is guaranteed to find the true top-k under the chosen metric, at a cost proportional to n × d per query.
  - id: c4-exact-vector-search-07
    type: order
    prompt: Order a filter-first exact search pipeline.
    items:
      - Look up the trusted eligibility rules for the request
      - Score only the eligible vectors
      - Sort by (−score, id)
      - Return the first k results
    explanation: You need the eligibility rules before you know which vectors to score. Scores must exist before sorting, and k is taken from the sorted eligible list, so every slot goes to an eligible document.
  - id: c4-exact-vector-search-08
    type: output
    prompt: What result is returned?
    code: |
      def top_matches(query, records, category, k):
          if k < 0:
              raise ValueError("k must be nonnegative")
          eligible = []
          for doc_id, tag, vector in records:
              if tag == category:
                  score = sum(x * y for x, y in zip(query, vector))
                  eligible.append((doc_id, score))
          eligible.sort(key=lambda match: (-match[1], match[0]))
          return [doc_id for doc_id, score in eligible[:k]]

      print(top_matches([0, 1], [("a", "p", [1, 0]), ("b", "p", [0, 1])], "p", 1))
    answer: "['b']"
    explanation: Both records are in category p. Against the query (0, 1), b scores 0 × 0 + 1 × 1 = 1 and a scores 0, so b sorts first and k = 1 keeps only b.
  - id: c4-exact-vector-search-09
    type: numeric
    prompt: How many decimal GB does a float32 matrix of 1,000,000 vectors at 384 dimensions need?
    answer: 1.536
    tol: 0.001
    explanation: Each float32 takes 4 bytes, so 1,000,000 × 384 × 4 = 1,536,000,000 bytes = 1.536 GB. Doubling the dimension to 768 doubles it to 3.072 GB.
  - id: c4-exact-vector-search-10
    type: numeric
    prompt: How many multiply-adds does brute-force dot-product search do for one query over 10,000 vectors of dimension 768?
    answer: 7680000
    tol: 0
    explanation: Each of the 10,000 scores needs 768 multiply-adds, so 10,000 × 768 = 7,680,000. That takes well under a millisecond on a laptop, which is why small corpora rarely need an index.
  - id: c4-exact-vector-search-11
    type: mcq
    prompt: A filter leaves 3 eligible documents and the caller asks for k = 5. What should exact search return?
    explanation: k is an upper limit. Returning the 3 eligible documents in ranked order is correct; padding with ineligible documents would break the filter, and raising an error would turn an ordinary narrow filter into a failure.
    options:
      - text: An error, because fewer than k results exist
        why: Fewer eligible results than k is a normal outcome, not a bug.
      - text: The 3 eligible documents, ranked
        why: k is a maximum, and only eligible documents may be returned.
        correct: true
      - text: The 3 eligible documents plus the 2 best ineligible ones
        why: That leaks documents the filter excluded.
