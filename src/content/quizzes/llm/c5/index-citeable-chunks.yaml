items:
  - id: c5-index-citeable-chunks-01
    type: mcq
    prompt: What changes when overlap increases?
    explanation: The stride is width minus overlap, so more overlap means windows start closer together. The same document then produces more windows, each sharing more tokens with its neighbour, which raises embedding and storage cost and can return near-duplicate passages.
    options:
      - text: More content is repeated across chunks
        why: A smaller stride means neighbouring windows share more tokens, so the same text is stored and embedded more than once.
        correct: true
      - text: Document revision becomes unnecessary
        why: Overlap is about window boundaries; a citation still needs to say which version of the document it came from.
      - text: The same width holds more tokens
        why: Width fixes the window size; overlap changes where windows start, not how many tokens each holds.
  - id: c5-index-citeable-chunks-02
    type: mcq
    prompt: What should a repeatable chunk ID include?
    explanation: A chunk ID must mean the same thing on every query and every rebuild of the same revision. Document, revision and offsets are fixed properties of the text; ranks, scores and row numbers are not.
    options:
      - text: Only its rank in the latest query
        why: The same chunk has a different rank for every query, so a rank cannot identify it later.
      - text: Document identity, revision and offset
        why: Together these pin down which document, which version of it, and exactly which span of text the chunk holds.
        correct: true
      - text: Only the embedding dimension
        why: Every chunk embedded by the same model has the same dimension, so it distinguishes nothing.
  - id: c5-index-citeable-chunks-03
    type: mcq
    prompt: What happens during indexing?
    explanation: Indexing is the offline half of RAG. It runs when documents change, before any question arrives, and prepares chunks, their vectors or term statistics, and their metadata so that question-time retrieval is fast.
    options:
      - text: The system stores searchable chunk representations
        why: Indexing prepares the corpus in advance by chunking, encoding and storing each chunk with its metadata.
        correct: true
      - text: The assistant writes its final answer
        why: Generation is the last online step and needs retrieved evidence, which needs an index to exist first.
      - text: The app scores the answer rubric
        why: Grading happens after an answer exists, which is long after indexing.
  - id: c5-index-citeable-chunks-04
    type: mcq
    prompt: Which design helps if a paragraph refers to its heading?
    explanation: Retrieval returns a chunk on its own. If the paragraph says "this limit" and the heading says what the limit applies to, the chunk is only interpretable, for the encoder and for the model, when the heading travels with it.
    options:
      - text: Keep heading context with the paragraph
        why: Prepending the heading lets the chunk be understood and matched on its own, without the rest of the document.
        correct: true
      - text: Discard all headings
        why: Headings often hold exactly the context that a referring paragraph leaves out.
      - text: Use one token per chunk
        why: Single tokens carry no paragraph meaning at all, so the reference problem gets worse, not better.
  - id: c5-index-citeable-chunks-05
    type: multi
    prompt: Which support traceable citations?
    explanation: To follow a citation back to text you need to know which document it came from, and which version and span of that document. A similarity score describes one query's match and locates nothing.
    options:
      - text: A stable document identifier
        why: It says which source document the passage came from, across queries and rebuilds.
        correct: true
      - text: The version and offsets
        why: The revision says which edition of the document, and the offsets say exactly which span of it was cited.
        correct: true
      - text: Only a similarity score
        why: A score changes with every query and says nothing about where the text lives.
  - id: c5-index-citeable-chunks-06
    type: cloze
    prompt: The repeated region shared by adjacent chunks is called ______.
    accept:
      - overlap
      - overlaps
      - chunk overlap
    explanation: The overlap $o$ makes the stride $w - o$ instead of $w$, so a sentence that straddles a boundary appears whole in at least one window. The cost is that the shared tokens are stored and embedded twice.
  - id: c5-index-citeable-chunks-07
    type: order
    prompt: Order the ingestion stages.
    items:
      - Read the document with its revision metadata
      - Create chunks with offsets
      - Encode each chunk
      - Store searchable vectors and source metadata
    explanation: The revision must be known before chunking so it can go into each chunk ID. Offsets are produced by chunking, encoding needs the chunk text, and storage needs both the vector and the ID-to-source metadata.
  - id: c5-index-citeable-chunks-08
    type: output
    prompt: What does this print?
    code: |
      def chunk_tokens(tokens, width, overlap):
          if width <= 0 or not 0 <= overlap < width:
              raise ValueError("require 0 <= overlap < width")
          chunks = []
          for start in range(0, len(tokens), width - overlap):
              end = min(start + width, len(tokens))
              chunks.append((start, end, tokens[start:end]))
              if end == len(tokens):
                  break
          return chunks

      print(chunk_tokens(list("abc"), 2, 0))
    answer: "[(0, 2, ['a', 'b']), (2, 3, ['c'])]"
    explanation: With no overlap the stride equals the width, 2. The first window is offsets 0 to 2. The second starts at 2, but only one token remains, so `end` is clipped to 3 and the window holds just `c`. It reaches the last token, so the loop stops.
  - id: c5-index-citeable-chunks-09
    type: numeric
    prompt: Using the lesson's `chunk_tokens`, how many windows does a 10-token document produce with width 4 and overlap 1?
    answer: 3
    tol: 0
    explanation: The stride is $4 - 1 = 3$, so windows start at 0, 3 and 6, covering offsets 0 to 4, 3 to 7 and 6 to 10. The third reaches the last token, so the loop stops. The formula $\lceil (10-1)/(4-1) \rceil = 3$ agrees.
  - id: c5-index-citeable-chunks-10
    type: mcq
    prompt: A policy changes from revision 1 to revision 2. Why build the new index beside the old one and then repoint the search alias, instead of replacing chunks one document at a time?
    explanation: An alias is a name, such as `policies-current`, that queries use and that points at one physical index. Repointing it is a single step, so a query sees either the complete old index or the complete new one. Replacing in place leaves a window where both revisions are searchable at once.
    options:
      - text: It lets the old revision keep its chunk IDs after the change
        why: Chunk IDs already include the revision, so they stay distinct either way; the point is what queries can see.
      - text: Aliases make embeddings cheaper to compute
        why: Every new chunk is still encoded once; the alias only changes which index is searched.
      - text: Every query then sees one consistent revision, never a mix of old and new passages
        why: The switch happens in one step, so no query can retrieve a revision 1 passage alongside a contradicting revision 2 passage.
        correct: true
