items:
  - id: a2-weighted-validation-01
    type: mcq
    prompt: Why weight batch means by size?
    explanation: Otherwise a small batch can carry disproportionate weight.
    options:
      - text: Each example should contribute equally
        why: Otherwise a small batch can carry disproportionate weight.
        correct: true
      - text: Large batches always have higher loss
        why: Loss can vary either way.
      - text: Weights choose the checkpoint automatically
        why: Selection still has a metric rule.
  - id: a2-weighted-validation-02
    type: mcq
    prompt: What should an empty evaluation report?
    explanation: There is no contributing denominator.
    options:
      - text: An undefined metric
        why: There is no contributing denominator.
        correct: true
      - text: Zero loss by default
        why: Zero would imply observed perfect loss.
      - text: A success rate of one
        why: No cases support that rate.
  - id: a2-weighted-validation-03
    type: mcq
    prompt: How should global F1 be produced?
    explanation: F1 is nonlinear in counts.
    options:
      - text: Only from the last batch
        why: Earlier cases would be ignored.
      - text: From aggregate counts or predictions
        why: F1 is nonlinear in counts.
        correct: true
      - text: Always average per-batch F1 equally
        why: That generally differs from global F1.
  - id: a2-weighted-validation-04
    type: mcq
    prompt: Which transform suits a stable validation pipeline?
    explanation: It measures the planned evaluation path.
    options:
      - text: Deterministic preprocessing used for inference
        why: It measures the planned evaluation path.
        correct: true
      - text: Independent random augmentation for each candidate without recording it
        why: This adds uncontrolled variation.
      - text: Using labels to alter each validation input
        why: That introduces leakage.
  - id: a2-weighted-validation-05
    type: multi
    prompt: What should accompany a reported validation loss?
    explanation: It defines the denominator. It makes comparisons reproducible.
    options:
      - text: The number of contributing examples
        why: It defines the denominator.
        correct: true
      - text: The validation preprocessing version
        why: It makes comparisons reproducible.
        correct: true
      - text: Only the number of training epochs
        why: That cannot interpret the loss calculation.
  - id: a2-weighted-validation-06
    type: cloze
    prompt: To combine uneven batch means, weight them by example ______.
    accept:
      - count
      - counts
      - size
      - sizes
    explanation: Counts recover the global example average.
  - id: a2-weighted-validation-07
    type: order
    prompt: Order validation loss aggregation.
    items:
      - Select the evaluation split and mode
      - Compute each batch mean with its count
      - Add batch loss totals and example counts
      - Divide once to obtain the global mean
    explanation: A single denominator preserves example weighting.
  - id: a2-weighted-validation-08
    type: output
    prompt: What does this print?
    code: |
      def mean_validation_loss(batches):
          weighted = 0.0
          count = 0
          for size, mean in batches:
              weighted += size * mean
              count += size
          return weighted / count if count else None

      print(mean_validation_loss([(3, 1.0), (1, 3.0)]))
    answer: "1.5"
    explanation: The total loss is six across four examples.
