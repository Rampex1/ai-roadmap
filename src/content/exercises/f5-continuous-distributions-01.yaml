id: f5-continuous-distributions-01
lesson: foundations/f5/continuous-distributions
title: Code the normal density
prompt: |
  Write `normal_pdf(x, mu, sigma)` from the formula (do not call scipy):

  $$p(x) = \frac{1}{\sigma\sqrt{2\pi}} \exp\!\left(-\frac{(x - \mu)^2}{2\sigma^2}\right)$$

  It must work when `x` is a NumPy array. Use `np.exp`, `np.sqrt` and `np.pi`. For example
  `normal_pdf(0, 0, 1)` is about `0.3989` and `normal_pdf(0, 0, 0.1)` is about `3.989` (a density can be
  larger than 1). The tests also check that the total area under your curve is 1.
starter: |
  import numpy as np

  def normal_pdf(x, mu, sigma):
      x = np.asarray(x, dtype=float)
      return np.exp(-(x - mu) ** 2)
solution: |
  import numpy as np

  def normal_pdf(x, mu, sigma):
      x = np.asarray(x, dtype=float)
      return np.exp(-((x - mu) ** 2) / (2 * sigma ** 2)) / (sigma * np.sqrt(2 * np.pi))
tests: |
  import numpy as np
  from scipy import stats
  _r = normal_pdf(0.0, 0.0, 1.0)
  assert _r is not None, "normal_pdf returned None: did you forget the return statement?"
  assert abs(float(_r) - 0.39894228) < 1e-7, f"normal_pdf(0, 0, 1) should be about 0.3989, got {_r!r}"
  assert abs(float(normal_pdf(0.0, 0.0, 0.1)) - 3.9894228) < 1e-6, "normal_pdf(0, 0, 0.1) should be about 3.989: did you divide by sigma, and use sigma squared in the exponent?"
  _x = np.linspace(-5, 15, 41)
  for _mu, _s in [(0, 1), (5, 2), (170, 10), (-3, 0.5)]:
      _xs = _x * _s / 2 + _mu
      np.testing.assert_allclose(normal_pdf(_xs, _mu, _s), stats.norm.pdf(_xs, _mu, _s), rtol=1e-9, atol=1e-300, err_msg=f"Values differ from the normal density for mu={_mu}, sigma={_s}")
  _g = np.linspace(150, 190, 40001)
  _area = np.trapezoid(normal_pdf(_g, 170, 4), _g)
  assert abs(_area - 1) < 1e-4, f"The total area under the density should be 1, got {_area}"
hints:
  - "Build it in two parts: the factor 1 / (sigma * np.sqrt(2 * np.pi)) and np.exp(-(x - mu) ** 2 / (2 * sigma ** 2))."
  - "Put brackets around 2 * sigma ** 2 so that you divide by the whole thing."
