id: a6-validated-training-config-01
lesson: mle/a6/validated-training-config
title: Resolve a training configuration
prompt: Implement training_config(options). Recognize only epochs and rate, with defaults 10 and 0.01. Epochs must be a positive exact integer; rate a number, excluding bool, in (0,1]. Return a fresh dictionary and normalize rate to float.
starter: |
  def training_config(options):
      raise NotImplementedError
solution: |
  def training_config(options):
      unknown = options.keys() - {"epochs","rate"}
      if unknown:
          raise ValueError("unknown options")
      epochs, rate = options.get("epochs",10), options.get("rate",0.01)
      if type(epochs) is not int or epochs <= 0 or type(rate) not in (int,float) or not 0 < rate <= 1:
          raise ValueError("invalid training options")
      return {"epochs":epochs,"rate":float(rate)}
tests: |
  assert training_config({}) == {"epochs":10,"rate":0.01}
  assert training_config({"epochs":1,"rate":1}) == {"epochs":1,"rate":1.0}
  for bad in ({"epoch":2},{"epochs":True},{"rate":"0.01"},{"rate":False},{"rate":0},{"epochs":2.5},{"epochs":0},{"rate":1.5}):
      try:
          training_config(bad)
      except ValueError:
          pass
      else:
          raise AssertionError("Reject invalid training options")
  o = {"epochs":2}
  r = training_config(o)
  assert r is not o and o == {"epochs":2}, "Return a fresh dictionary and leave the input unchanged"
hints:
  - Check unknown keys and explicit numeric types.
