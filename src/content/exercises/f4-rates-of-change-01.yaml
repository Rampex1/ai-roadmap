id: f4-rates-of-change-01
lesson: foundations/f4/rates-of-change
title: Average rate of change
prompt: |
  Write `average_rate(f, a, b)` that returns the average rate of change of the function `f`
  between the inputs `a` and `b`: the slope of the secant line through `(a, f(a))` and `(b, f(b))`.

  For example, with `f = lambda x: x ** 2`, `average_rate(f, 1, 3)` is `(9 - 1) / (3 - 1) = 4.0`.
starter: |
  def average_rate(f, a, b):
      """Return the slope of the secant line of f between a and b."""
      pass
solution: |
  def average_rate(f, a, b):
      """Return the slope of the secant line of f between a and b."""
      return (f(b) - f(a)) / (b - a)
tests: |
  import math
  _sq = lambda x: x ** 2
  _r = average_rate(_sq, 1, 3)
  assert _r is not None, "average_rate returned None: did you forget the return statement?"
  assert math.isclose(_r, 4.0), f"For x**2 between 1 and 3 the answer is 4.0, got {_r!r}"
  _line = lambda x: -3 * x + 7
  for _a, _b in [(0, 1), (2, 10), (-5, -1)]:
      _r = average_rate(_line, _a, _b)
      assert math.isclose(_r, -3.0), f"A straight line -3x + 7 has slope -3 between any two points, got {_r!r} for a={_a}, b={_b}"
  _r = average_rate(lambda x: x ** 3, -1, 2)
  assert math.isclose(_r, 3.0), f"For x**3 between -1 and 2 the answer is (8 - (-1)) / 3 = 3.0, got {_r!r}"
  _r = average_rate(_sq, 3, 1)
  assert math.isclose(_r, 4.0), f"Swapping a and b should give the same slope, 4.0, got {_r!r}"
hints:
  - "Change in output divided by change in input."
  - "return (f(b) - f(a)) / (b - a)"
