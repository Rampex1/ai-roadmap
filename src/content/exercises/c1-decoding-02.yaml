id: c1-decoding-02
lesson: llm/c1/decoding
title: From logprobs to probabilities, perplexity and a choice
prompt: |
  An API returned per-token logprobs (natural logs) for a completion. Write three functions.

  1. `completion_stats(logprobs)` returns a dict with
     - `"logprob"`: the sum of the logprobs (the log-probability of the whole completion);
     - `"prob"`: the probability of the whole completion, `exp` of that sum;
     - `"perplexity"`: `exp` of minus the **mean** logprob.
  2. `uncertain_tokens(tokens, logprobs, threshold)` returns the list of `(index, token)` pairs whose
     token probability is **below** `threshold`, in order.
  3. `best_candidate(candidates, per_token=False)` takes a list of candidate answers, each given as a
     list of its token logprobs, and returns the **index** of the best one: the highest total logprob,
     or, if `per_token` is true, the highest **mean** logprob. Return the first index on ties.

  Example: logprobs `[-0.1, -2.0, -0.3]` have sum -2.4, probability about 0.0907 and perplexity
  `exp(0.8)`, about 2.23. With threshold 0.5, only index 1 (probability 0.135) is uncertain.
starter: |
  import math

  def completion_stats(logprobs):
      return {"logprob": 0.0, "prob": 1.0, "perplexity": 1.0}

  def uncertain_tokens(tokens, logprobs, threshold):
      return []

  def best_candidate(candidates, per_token=False):
      return 0
solution: |
  import math

  def completion_stats(logprobs):
      total = sum(logprobs)
      return {"logprob": total, "prob": math.exp(total), "perplexity": math.exp(-total / len(logprobs))}

  def uncertain_tokens(tokens, logprobs, threshold):
      return [(i, t) for i, (t, lp) in enumerate(zip(tokens, logprobs)) if math.exp(lp) < threshold]

  def best_candidate(candidates, per_token=False):
      scores = [sum(c) / len(c) if per_token else sum(c) for c in candidates]
      return scores.index(max(scores))
tests: |
  import math
  s = completion_stats([-0.1, -2.0, -0.3])
  assert math.isclose(s["logprob"], -2.4, rel_tol=1e-9), f"logprob should be the sum, -2.4, got {s['logprob']}"
  assert math.isclose(s["prob"], math.exp(-2.4), rel_tol=1e-9), "prob should be exp of the summed logprob"
  assert math.isclose(s["perplexity"], math.exp(0.8), rel_tol=1e-9), f"perplexity should be exp(-mean) = exp(0.8), got {s['perplexity']}"
  s = completion_stats([0.0, 0.0])
  assert math.isclose(s["prob"], 1.0) and math.isclose(s["perplexity"], 1.0), "logprobs of 0 mean certainty: probability 1 and perplexity 1"
  s = completion_stats([math.log(0.25)] * 4)
  assert math.isclose(s["perplexity"], 4.0, rel_tol=1e-9), "four tokens each with probability 1/4 have perplexity 4: use the mean, not the sum"
  toks = ["The", " author", " J", "humpa"]
  lps = [-0.2, -0.1, -3.3, -0.3]
  assert list(uncertain_tokens(toks, lps, 0.5)) == [(2, " J")], f"only token 2 has probability below 0.5, got {uncertain_tokens(toks, lps, 0.5)}"
  assert list(uncertain_tokens(toks, lps, 0.9)) == [(0, "The"), (2, " J"), (3, "humpa")], "with threshold 0.9 tokens 0, 2 and 3 fall below it (exp(-0.1) is about 0.905)"
  assert list(uncertain_tokens(toks, lps, 0.01)) == [], "nothing is below a threshold of 0.01"
  cands = [[-0.5, -0.5, -0.5, -0.5], [-1.2], [-0.2, -2.0]]
  assert best_candidate(cands) == 1, "by total logprob, the one-token answer (-1.2) beats -2.0 and -2.2"
  assert best_candidate(cands, per_token=True) == 0, "by mean logprob per token, candidate 0 (-0.5 per token) is best"
  assert best_candidate([[-1.0], [-1.0]]) == 0, "on a tie return the first index"
  assert best_candidate([[-3.0], [-0.1, -0.1]]) == 1, "compare the sums: -0.2 beats -3.0"
hints:
  - "The probability of the whole completion is the product of the token probabilities, which is exp of the sum of the logprobs."
  - "Perplexity divides the summed logprob by the number of tokens before negating and exponentiating."
  - "Build a list of scores, then scores.index(max(scores)) gives the first best index."
