id: f7-linear-regression-with-scikit-learn-02
lesson: foundations/f7/linear-regression-with-scikit-learn
title: R² from scratch
prompt: |
  Write `r2(y, y_hat)` that returns the coefficient of determination

  $$R^2 = 1 - \frac{\sum_i (y_i - \hat{y}_i)^2}{\sum_i (y_i - \bar{y})^2}$$

  where $\bar{y}$ is the mean of `y`. The tests compare it with `sklearn.metrics.r2_score`, including
  predictions worse than the mean (negative $R^2$).
starter: |
  import numpy as np

  def r2(y, y_hat):
      # TODO
      return 0.0

  y = np.array([3.0, 5.0, 7.0, 9.0])
  print(r2(y, np.array([2.8, 5.3, 6.9, 9.2])))
solution: |
  import numpy as np

  def r2(y, y_hat):
      y, y_hat = np.asarray(y, float), np.asarray(y_hat, float)
      ss_res = np.sum((y - y_hat) ** 2)
      ss_tot = np.sum((y - y.mean()) ** 2)
      return 1 - ss_res / ss_tot

  y = np.array([3.0, 5.0, 7.0, 9.0])
  print(r2(y, np.array([2.8, 5.3, 6.9, 9.2])))
tests: |
  import numpy as np
  from sklearn.metrics import r2_score
  _rng = np.random.default_rng(5)
  _y = _rng.normal(size=40)
  for _yh in [_y + _rng.normal(0, 0.1, 40), _y + _rng.normal(0, 1.5, 40), np.full(40, _y.mean()), -_y]:
      _got = r2(_y, _yh)
      _want = r2_score(_y, _yh)
      assert np.isclose(_got, _want, atol=1e-10), f"expected R² = {_want:.4f}, got {_got}"
  assert np.isclose(r2([1, 2, 3], [1, 2, 3]), 1.0), "a perfect prediction has R² = 1"
hints:
  - "ss_res is the sum of squared residuals; ss_tot is the sum of squared deviations from y.mean()."
  - "Predicting the mean everywhere gives exactly 0; doing worse than that gives a negative value."
