id: f4-integrals-01
lesson: foundations/f4/integrals
title: A midpoint Riemann sum
prompt: |
  Write `midpoint_integral(f, a, b, n)` that estimates $\int_a^b f(x)\,dx$ with `n` strips of equal
  width, evaluating `f` at the **midpoint** of each strip. Assume `f` works on NumPy arrays, and
  avoid a Python loop if you can.

  With one strip, `midpoint_integral(lambda x: x**2, 0, 2, 1)` is `f(1) * 2 = 2.0`.
starter: |
  import numpy as np

  def midpoint_integral(f, a, b, n):
      width = (b - a) / n
      return 0.0
solution: |
  import numpy as np

  def midpoint_integral(f, a, b, n):
      width = (b - a) / n
      mids = a + width * (np.arange(n) + 0.5)
      return np.sum(f(mids)) * width
tests: |
  import numpy as np
  _sq = lambda x: x ** 2
  _r = midpoint_integral(_sq, 0, 2, 1)
  assert _r is not None, "midpoint_integral returned None: did you forget the return statement?"
  assert abs(_r - 2.0) < 1e-12, f"With one strip on [0, 2], the midpoint is 1, so the answer is 1**2 * 2 = 2.0, got {_r!r}"
  _r = midpoint_integral(_sq, 0, 1, 10)
  assert abs(_r - 0.3325) < 1e-12, f"x**2 on [0, 1] with 10 strips should give 0.3325, got {_r!r}"
  assert abs(midpoint_integral(_sq, 0, 1, 1000) - 1 / 3) < 1e-6, "x**2 on [0, 1] with 1000 strips should be close to 1/3"
  assert abs(midpoint_integral(np.sin, 0, np.pi, 1000) - 2.0) < 1e-5, "sin on [0, pi] should be close to 2"
  assert abs(midpoint_integral(lambda x: 3 * x + 1, -1, 3, 7) - 16.0) < 1e-9, "The midpoint rule is exact for straight lines: 3x + 1 on [-1, 3] is 16"
hints:
  - "The midpoints are a + width * (k + 0.5) for k = 0, 1, ..., n - 1. np.arange(n) gives the k values."
  - "Add up f at all midpoints and multiply by the width."
