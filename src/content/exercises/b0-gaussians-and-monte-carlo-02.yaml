id: b0-gaussians-and-monte-carlo-02
lesson: research/b0/gaussians-and-monte-carlo
title: Monte Carlo with error bars
prompt: |
  Write `mc_estimate(f, sampler, n, rng)` that estimates $\mathbb{E}[f(X)]$:

  - draw `x = sampler(rng, n)` (an array of `n` samples),
  - compute `fx = f(x)`,
  - return the tuple `(estimate, half_width)`, where `estimate` is the mean of `fx` and `half_width` is
    `1.96` times the standard error, `fx.std(ddof=1) / sqrt(n)`.

  So `estimate ± half_width` is an approximate 95% confidence interval. Then use it to set `est, hw` for
  $\mathbb{E}[\cos X]$ with $X \sim \mathcal{N}(0, 1)$, using `n = 100_000` and `rng = np.random.default_rng(0)`
  (the exact answer is $e^{-1/2} \approx 0.6065$).

  The tests also check that your intervals cover the truth about 95% of the time.
starter: |
  import numpy as np

  def mc_estimate(f, sampler, n, rng):
      x = sampler(rng, n)
      fx = f(x)
      return fx.mean(), fx.std()

  rng = np.random.default_rng(0)
  est, hw = None, None
solution: |
  import numpy as np

  def mc_estimate(f, sampler, n, rng):
      x = sampler(rng, n)
      fx = f(x)
      return float(fx.mean()), float(1.96 * fx.std(ddof=1) / np.sqrt(n))

  rng = np.random.default_rng(0)
  est, hw = mc_estimate(np.cos, lambda r, n: r.standard_normal(n), 100_000, rng)
tests: |
  import math
  import numpy as np
  assert est is not None and hw is not None, "Set est, hw = mc_estimate(np.cos, ..., 100_000, rng)"
  _fx = np.cos(np.random.default_rng(0).standard_normal(100_000))
  assert math.isclose(est, _fx.mean(), rel_tol=1e-12), f"est should be the mean of cos(X) over 100,000 standard normal draws from default_rng(0), {_fx.mean():.5f}; got {est!r}"
  assert math.isclose(hw, 1.96 * _fx.std(ddof=1) / math.sqrt(100_000), rel_tol=1e-9), f"hw should be 1.96 * fx.std(ddof=1) / sqrt(n), about {1.96 * _fx.std(ddof=1) / math.sqrt(100_000):.5f}; got {hw!r}"
  assert abs(est - math.exp(-0.5)) < hw, "The interval est +/- hw should contain exp(-1/2)"
  _e, _h = mc_estimate(np.square, lambda r, n: r.uniform(0, 1, n), 50, np.random.default_rng(3))
  _u = np.random.default_rng(3).uniform(0, 1, 50) ** 2
  assert math.isclose(_e, _u.mean(), rel_tol=1e-12) and math.isclose(_h, 1.96 * _u.std(ddof=1) / math.sqrt(50), rel_tol=1e-9), "mc_estimate is wrong for f = square, uniform samples, n = 50: check ddof=1 and the division by sqrt(n)"
  _rng = np.random.default_rng(42)
  _hits = 0
  for _ in range(400):
      _e, _h = mc_estimate(lambda x: x ** 2, lambda r, n: r.standard_normal(n), 400, _rng)
      _hits += abs(_e - 1.0) < _h
  assert 0.90 <= _hits / 400 <= 0.99, f"Intervals for E[X^2] = 1 should cover the truth about 95% of the time; yours covered {_hits / 400:.1%}"
hints:
  - "The standard error of a mean is the sample standard deviation divided by the square root of n."
  - "Use fx.std(ddof=1), the sample standard deviation."
  - "est, hw = mc_estimate(np.cos, lambda r, n: r.standard_normal(n), 100_000, rng)"
