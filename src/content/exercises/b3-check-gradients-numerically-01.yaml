id: b3-check-gradients-numerically-01
lesson: research/b3/check-gradients-numerically
title: Estimate derivatives one coordinate at a time
prompt: Implement numerical_gradient(objective,values,step) for a scalar callable and list of finite values. Step is a finite positive size or an invalid nonpositive value to reject. Use symmetric perturbations and preserve the original list.
starter: |
  def numerical_gradient(objective,values,step):
      raise NotImplementedError
solution: |
  def numerical_gradient(objective,values,step):
      if not step > 0:
          raise ValueError("step must be positive")
      result = []
      for i in range(len(values)):
          plus,minus = list(values),list(values)
          plus[i] += step
          minus[i] -= step
          result.append((objective(plus)-objective(minus))/(2*step))
      return result
tests: |
  values = [2.,3.]
  grad = numerical_gradient(lambda v:v[0]**2+v[1]**3,values,1e-4)
  assert len(grad) == 2 and all(abs(a-b)<1e-5 for a,b in zip(grad,[4,27]))
  assert values == [2.,3.]
  assert numerical_gradient(sum,[],1e-4) == []
  assert abs(numerical_gradient(lambda v:7*v[0],[0.],1e-4)[0]-7) < 1e-12
  point = [1.5,-2.0,0.25]
  grad = numerical_gradient(lambda v:v[0]*v[1]+v[2]**2,point,1e-4)
  assert len(grad) == 3 and all(abs(a-b)<1e-8 for a,b in zip(grad,[-2,1.5,0.5]))
  for bad in (0,-1e-4):
      try:
          numerical_gradient(sum,[2.],bad)
      except ValueError:
          pass
      else:
          raise AssertionError("reject nonpositive step")
hints:
  - Perturb exactly one coordinate in each copy.
