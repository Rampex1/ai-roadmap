id: b1-approximation-and-estimation-01
lesson: research/b1/approximation-and-estimation
title: Compute excess-risk components
prompt: Implement excess_parts(selected,best_in_class,reference). Inputs are finite population risks for bounded loss. Enforce 0 <= reference <= best_in_class <= selected <= 1. Return approximation and estimation errors in that order.
starter: |
  def excess_parts(selected, best_in_class, reference):
      raise NotImplementedError
solution: |
  def excess_parts(selected, best_in_class, reference):
      if not 0 <= reference <= best_in_class <= selected <= 1:
          raise ValueError("invalid ordered risks")
      return best_in_class-reference, selected-best_in_class
tests: |
  assert excess_parts(0.5,0.25,0.125) == (0.125,0.25)
  assert excess_parts(0.25,0.25,0.25) == (0,0)
  for args in ((0.2,0.3,0.1),(0.5,0.25,0.3),(1.1,0.3,0.1),(0.5,0.25,-0.1)):
      try:
          excess_parts(*args)
      except ValueError:
          pass
      else:
          raise AssertionError("reject inconsistent risks")
hints:
  - Subtract adjacent ordered population risks.
