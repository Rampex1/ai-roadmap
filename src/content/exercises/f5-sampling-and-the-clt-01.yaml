id: f5-sampling-and-the-clt-01
lesson: foundations/f5/sampling-and-the-clt
title: Running means without a loop
prompt: |
  Write `running_mean(x)` that returns an array whose entry `i` is the mean of the first `i + 1` values of `x`.
  Do it without a Python loop: use `np.cumsum` for the running totals and divide by `1, 2, 3, ...`
  (`np.arange(1, len(x) + 1)`).

  For `x = [2, 4, 6, 0]` the result is `[2.0, 3.0, 4.0, 3.0]`.
starter: |
  import numpy as np

  def running_mean(x):
      x = np.asarray(x, dtype=float)
      return np.cumsum(x)
solution: |
  import numpy as np

  def running_mean(x):
      x = np.asarray(x, dtype=float)
      return np.cumsum(x) / np.arange(1, len(x) + 1)
tests: |
  import numpy as np
  _r = running_mean([2, 4, 6, 0])
  assert _r is not None, "running_mean returned None: did you forget the return statement?"
  np.testing.assert_allclose(_r, [2.0, 3.0, 4.0, 3.0], err_msg="running_mean([2, 4, 6, 0]) should be [2, 3, 4, 3]")
  np.testing.assert_allclose(running_mean([5]), [5.0], err_msg="A single value is its own mean")
  _rng = np.random.default_rng(0)
  _x = _rng.normal(size=50)
  np.testing.assert_allclose(running_mean(_x), [_x[: i + 1].mean() for i in range(50)], rtol=1e-10, atol=1e-12, err_msg="Entry i should be the mean of x[: i + 1]")
  _rolls = _rng.integers(1, 7, size=200_000)
  _m = running_mean(_rolls)
  assert len(_m) == 200_000, "The result should have one entry per value"
  assert abs(_m[-1] - 3.5) < 0.02, "By the law of large numbers, the running mean of 200,000 die rolls should be close to 3.5"
hints:
  - "np.cumsum(x) gives the running totals."
  - "Divide element by element by np.arange(1, len(x) + 1)."
