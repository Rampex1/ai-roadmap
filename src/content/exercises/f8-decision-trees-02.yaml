id: f8-decision-trees-02
lesson: foundations/f8/decision-trees
title: The best split on one feature
prompt: |
  Write `best_split(x, y)` that finds the best threshold for one numeric feature `x` (a 1-D array) and class labels
  `y`, the way a tree does:

  1. The candidate thresholds are the **midpoints between consecutive distinct sorted values** of `x`
     (use `np.unique(x)`, which sorts and removes duplicates).
  2. A threshold `t` sends rows with `x <= t` left and the rest right.
  3. Score each candidate by the **weighted Gini impurity** of the two children:
     $\frac{n_L}{n}\,\text{Gini}(\text{left}) + \frac{n_R}{n}\,\text{Gini}(\text{right})$.

  Return a tuple `(threshold, score)` for the candidate with the **lowest** score. If several tie, return the
  smallest threshold. If `x` has only one distinct value there is nothing to split: return `(None, gini(y))`.

  A `gini(labels)` helper is provided. Check with the lesson's customers:
  `best_split(contract, churn)` is `(10.5, 0.16)`.
starter: |
  import numpy as np

  def gini(labels):
      _, counts = np.unique(labels, return_counts=True)
      p = counts / counts.sum()
      return float(1 - np.sum(p ** 2))

  def best_split(x, y):
      x, y = np.asarray(x), np.asarray(y)
      best_t, best_score = None, gini(y)
      # TODO: try every midpoint threshold and keep the one with the lowest weighted Gini
      return best_t, best_score

  churn = np.array([1, 1, 0, 1, 1, 0, 0, 0, 0, 0])
  contract = np.array([1, 3, 6, 6, 9, 12, 12, 24, 24, 36])
  print(best_split(contract, churn))
solution: |
  import numpy as np

  def gini(labels):
      _, counts = np.unique(labels, return_counts=True)
      p = counts / counts.sum()
      return float(1 - np.sum(p ** 2))

  def best_split(x, y):
      x, y = np.asarray(x), np.asarray(y)
      values = np.unique(x)
      if len(values) < 2:
          return None, gini(y)
      best_t, best_score = None, np.inf
      for t in (values[:-1] + values[1:]) / 2:
          left, right = y[x <= t], y[x > t]
          score = len(left) / len(y) * gini(left) + len(right) / len(y) * gini(right)
          if score < best_score - 1e-12:
              best_t, best_score = float(t), float(score)
      return best_t, best_score

  churn = np.array([1, 1, 0, 1, 1, 0, 0, 0, 0, 0])
  contract = np.array([1, 3, 6, 6, 9, 12, 12, 24, 24, 36])
  print(best_split(contract, churn))
tests: |
  import math
  import numpy as np
  def _g(lab):
      _, c = np.unique(lab, return_counts=True); p = c / c.sum(); return 1 - np.sum(p ** 2)
  def _ref(x, y):
      v = np.unique(x)
      if len(v) < 2:
          return None, _g(y)
      bt, bs = None, np.inf
      for t in (v[:-1] + v[1:]) / 2:
          s = (x <= t).mean() * _g(y[x <= t]) + (x > t).mean() * _g(y[x > t])
          if s < bs - 1e-12:
              bt, bs = t, s
      return bt, bs
  _churn = np.array([1, 1, 0, 1, 1, 0, 0, 0, 0, 0])
  _contract = np.array([1, 3, 6, 6, 9, 12, 12, 24, 24, 36])
  _charge = np.array([85, 40, 90, 75, 55, 45, 30, 80, 60, 50])
  _r = best_split(_contract, _churn)
  assert _r is not None and len(_r) == 2, "Return a tuple (threshold, score)"
  assert _r[0] is not None and math.isclose(_r[0], 10.5), f"For contract the best threshold is the midpoint 10.5, got {_r[0]}"
  assert math.isclose(_r[1], 0.16, abs_tol=1e-9), f"For contract the best weighted Gini is 0.16, got {_r[1]}"
  _t, _s = best_split(_charge, _churn)
  _rt, _rs = _ref(_charge, _churn)
  assert _t is not None and math.isclose(_t, _rt) and math.isclose(_s, _rs, abs_tol=1e-9), f"For charge expected ({_rt}, {_rs:.4f}), got ({_t}, {_s})"
  _rng = np.random.default_rng(1)
  for _ in range(15):
      _n = int(_rng.integers(5, 40))
      _x = _rng.integers(0, 15, _n).astype(float)
      _y = (_x + _rng.normal(0, 4, _n) > 7).astype(int)
      _t, _s = best_split(_x, _y)
      _rt, _rs = _ref(_x, _y)
      if _rt is None:
          assert _t is None, "With a single distinct x value return (None, gini(y))"
      else:
          assert _t is not None and math.isclose(_t, _rt), f"x={_x.tolist()}, y={_y.tolist()}: best threshold should be {_rt}, got {_t}"
          assert math.isclose(_s, _rs, abs_tol=1e-9), f"x={_x.tolist()}, y={_y.tolist()}: best score should be {_rs:.6f}, got {_s}"
  _t, _s = best_split(np.array([3.0, 3.0, 3.0]), np.array([0, 1, 1]))
  assert _t is None and math.isclose(_s, 4 / 9, abs_tol=1e-9), f"With a single distinct x value return (None, gini(y)), got ({_t}, {_s})"
  _t, _s = best_split(np.array([1.0, 2.0, 3.0, 4.0]), np.array([0, 1, 0, 1]))
  assert _t is not None and math.isclose(_t, 1.5), f"On ties return the smallest threshold: expected 1.5, got {_t}"
hints:
  - "values = np.unique(x); the midpoints are (values[:-1] + values[1:]) / 2."
  - "For each t, left = y[x <= t] and right = y[x > t]; weight each Gini by its share of the rows."
  - "Only replace the best when the score is strictly lower, so ties keep the smallest threshold."
