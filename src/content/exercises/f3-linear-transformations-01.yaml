id: f3-linear-transformations-01
lesson: foundations/f3/linear-transformations
title: Rotate a shape
prompt: |
  1. Write `rotation_matrix(theta)` that returns the $2 \times 2$ matrix rotating by `theta` radians
     counterclockwise.
  2. Write `rotate_points(P, theta)` where `P` has shape `(N, 2)`, one point per **row**. Return the
     rotated points, same shape, using one matrix product (no loop). Remember that points are rows,
     as with a batch through a linear layer.

  The code at the bottom draws a triangle and its rotated copy so you can check by eye.
