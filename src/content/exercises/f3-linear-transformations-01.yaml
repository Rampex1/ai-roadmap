solution: |
  import numpy as np
  import matplotlib.pyplot as plt

  def rotation_matrix(theta):
      c, s = np.cos(theta), np.sin(theta)
      return np.array([[c, -s], [s, c]])

  def rotate_points(P, theta):
      return P @ rotation_matrix(theta).T

  tri = np.array([[0.0, 0.0], [2.0, 0.0], [2.0, 1.0], [0.0, 0.0]])
  rot = rotate_points(tri, np.pi / 3)
  plt.plot(tri[:, 0], tri[:, 1], label="original")
  plt.plot(rot[:, 0], rot[:, 1], label="rotated 60 degrees")
  plt.axis("equal")
  plt.legend()
tests: |
  import numpy as np
  np.testing.assert_allclose(rotation_matrix(np.pi / 2) @ np.array([1.0, 0.0]), [0.0, 1.0], atol=1e-12, err_msg="Rotating e1 by 90 degrees should give (0, 1)")
  np.testing.assert_allclose(rotation_matrix(np.pi / 2) @ np.array([0.0, 1.0]), [-1.0, 0.0], atol=1e-12, err_msg="Rotating e2 by 90 degrees should give (-1, 0): counterclockwise")
  np.testing.assert_allclose(rotation_matrix(0.3) @ rotation_matrix(0.5), rotation_matrix(0.8), atol=1e-12, err_msg="Rotating by 0.5 then 0.3 should equal rotating by 0.8")
  _rng = np.random.default_rng(9)
  _P = _rng.normal(size=(7, 2))
  for _t in (0.4, -1.2, np.pi):
      _Q = rotate_points(_P, _t)
      assert np.shape(_Q) == (7, 2), f"rotate_points should return shape (7, 2), got {np.shape(_Q)}"
      _c, _s = np.cos(_t), np.sin(_t)
      np.testing.assert_allclose(_Q, np.array([[_c * x - _s * y, _s * x + _c * y] for x, y in _P]), atol=1e-12, err_msg=f"Each row should be rotated by theta = {_t}")
      np.testing.assert_allclose(np.linalg.norm(_Q, axis=1), np.linalg.norm(_P, axis=1), err_msg="A rotation should keep every length")
hints:
  - "e1 = (1, 0) goes to (cos t, sin t) and e2 = (0, 1) goes to (-sin t, cos t). Those are the columns."
  - "Points are rows, so use P @ R.T rather than R @ P."
