id: b13-summarize-reproduction-discrepancies-01
lesson: research/b13/summarize-reproduction-discrepancies
title: Implement summarise reproduction discrepancies
prompt: Implement discrepancy_summary(pairs). Each item is (reference, repeat) with finite values or None. Count complete and incomplete pairs. For complete pairs report mean repeat-minus-reference and min/max range; otherwise both summary values are None.
starter: |
  def discrepancy_summary(pairs):
      raise NotImplementedError
solution: |
  def discrepancy_summary(pairs):
      diffs=[repeat-reference for reference,repeat in pairs if reference is not None and repeat is not None]
      return {"paired":len(diffs),"missing":len(pairs)-len(diffs),
              "mean":sum(diffs)/len(diffs) if diffs else None,
              "range":(min(diffs),max(diffs)) if diffs else None}
tests: |
  assert discrepancy_summary([(1,2),(4,2),(None,3)])=={"paired":2,"missing":1,"mean":-0.5,"range":(-2,1)}
  assert discrepancy_summary([(0,0)])=={"paired":1,"missing":0,"mean":0,"range":(0,0)}
  assert discrepancy_summary([(1,None)])=={"paired":0,"missing":1,"mean":None,"range":None}
  assert discrepancy_summary([])["paired"]==0
hints:
  - Filter complete pairs before subtracting.
