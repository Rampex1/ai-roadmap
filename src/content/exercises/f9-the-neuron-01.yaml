id: f9-the-neuron-01
lesson: foundations/f9/the-neuron
title: One neuron on a whole batch
prompt: |
  Write two functions for a single sigmoid neuron.

  - `neuron_batch(X, w, b)` returns the activations $\sigma(X\mathbf{w} + b)$ for every row of `X`.
    `X` has shape `(n, d)`, `w` has shape `(d,)` and `b` is a number, so the result has shape `(n,)`.
    Use one matrix-vector product, not a Python loop.
  - `predict(X, w, b)` returns the predicted class for every row: `1` where the activation is above
    0.5 and `0` otherwise, as an integer array of shape `(n,)`.

  Check: with `w = np.array([10.0, 10.0])` and `b = -15`, the four rows `[0, 0], [0, 1], [1, 0], [1, 1]`
  give predictions `[0, 0, 0, 1]` (logical AND).
starter: |
  import numpy as np

  def neuron_batch(X, w, b):
      z = X @ w + b
      return z

  def predict(X, w, b):
      pass
solution: |
  import numpy as np

  def neuron_batch(X, w, b):
      z = X @ w + b
      return 1 / (1 + np.exp(-z))

  def predict(X, w, b):
      return (neuron_batch(X, w, b) > 0.5).astype(int)
tests: |
  import numpy as np
  _X = np.array([[0, 0], [0, 1], [1, 0], [1, 1]], dtype=float)
  _a = neuron_batch(_X, np.array([10.0, 10.0]), -15.0)
  assert _a is not None and np.shape(_a) == (4,), "neuron_batch should return one activation per row, shape (n,)"
  np.testing.assert_allclose(_a, 1 / (1 + np.exp(-np.array([-15.0, -5.0, -5.0, 5.0]))), rtol=1e-9, err_msg="For the AND weights expected sigmoid of [-15, -5, -5, 5]; did you apply the sigmoid?")
  _rng = np.random.default_rng(4)
  for _n, _d in [(7, 3), (1, 5), (20, 1)]:
      _Xr = _rng.normal(size=(_n, _d)); _wr = _rng.normal(size=_d); _br = float(_rng.normal())
      np.testing.assert_allclose(neuron_batch(_Xr, _wr, _br), 1 / (1 + np.exp(-(_Xr @ _wr + _br))), rtol=1e-9, err_msg=f"Wrong activations for a random batch of shape ({_n}, {_d})")
  _p = predict(_X, np.array([10.0, 10.0]), -15.0)
  assert _p is not None, "predict should return an array of 0s and 1s"
  assert np.array_equal(np.asarray(_p), [0, 0, 0, 1]), f"AND weights should predict [0, 0, 0, 1], got {_p}"
  assert np.array_equal(np.asarray(predict(_X, np.array([10.0, 10.0]), -5.0)), [0, 1, 1, 1]), "OR weights (bias -5) should predict [0, 1, 1, 1]"
  _Xr = _rng.normal(size=(50, 4)); _wr = _rng.normal(size=4)
  assert np.array_equal(np.asarray(predict(_Xr, _wr, 0.3)), (_Xr @ _wr + 0.3 > 0).astype(int)), "predict should be 1 exactly where the activation is above 0.5, that is where z > 0"
hints:
  - "The sigmoid is 1 / (1 + np.exp(-z)), applied to the whole array z at once."
  - "A comparison such as a > 0.5 gives a boolean array; .astype(int) turns it into 0s and 1s."
