id: f7-overfitting-and-bias-variance-02
lesson: foundations/f7/overfitting-and-bias-variance
title: Pick the degree on the validation set
prompt: |
  Write `choose_degree(x_tr, y_tr, x_val, y_val, degrees)`. The `x` arrays are 1-D. For each degree
  in `degrees`, fit `make_pipeline(PolynomialFeatures(degree), LinearRegression())` on the training
  data and compute the mean squared error on the **validation** data.

  Return `(best_degree, val_errors)`: the degree with the lowest validation MSE, and the list of
  validation MSEs in the same order as `degrees`. The plot shows training and validation error
  against the degree.
starter: |
  import numpy as np
  import matplotlib.pyplot as plt
  from sklearn.pipeline import make_pipeline
  from sklearn.preprocessing import PolynomialFeatures
  from sklearn.linear_model import LinearRegression
  from sklearn.metrics import mean_squared_error

  def choose_degree(x_tr, y_tr, x_val, y_val, degrees):
      val_errors = []
      # TODO: fit one pipeline per degree and record its validation MSE
      return degrees[0], val_errors

  rng = np.random.default_rng(0)
  x = rng.uniform(-1, 1, 60)
  y = np.sin(3 * x) + rng.normal(0, 0.3, 60)
  degrees = list(range(1, 13))
  best, errs = choose_degree(x[:40], y[:40], x[40:], y[40:], degrees)
  print("best degree:", best)
  plt.plot(degrees[:len(errs)], errs, marker="o")
  plt.yscale("log")
  plt.xlabel("degree")
  plt.ylabel("validation MSE")
solution: |
  import numpy as np
  import matplotlib.pyplot as plt
  from sklearn.pipeline import make_pipeline
  from sklearn.preprocessing import PolynomialFeatures
  from sklearn.linear_model import LinearRegression
  from sklearn.metrics import mean_squared_error

  def choose_degree(x_tr, y_tr, x_val, y_val, degrees):
      val_errors = []
      for d in degrees:
          model = make_pipeline(PolynomialFeatures(d), LinearRegression())
          model.fit(x_tr.reshape(-1, 1), y_tr)
          val_errors.append(mean_squared_error(y_val, model.predict(x_val.reshape(-1, 1))))
      best = degrees[int(np.argmin(val_errors))]
      return best, val_errors

  rng = np.random.default_rng(0)
  x = rng.uniform(-1, 1, 60)
  y = np.sin(3 * x) + rng.normal(0, 0.3, 60)
  degrees = list(range(1, 13))
  best, errs = choose_degree(x[:40], y[:40], x[40:], y[40:], degrees)
  print("best degree:", best)
  plt.plot(degrees[:len(errs)], errs, marker="o")
  plt.yscale("log")
  plt.xlabel("degree")
  plt.ylabel("validation MSE")
tests: |
  import numpy as np
  from sklearn.pipeline import make_pipeline
  from sklearn.preprocessing import PolynomialFeatures
  from sklearn.linear_model import LinearRegression
  def _ref(xt, yt, xv, yv, degs):
      e = []
      for d in degs:
          m = make_pipeline(PolynomialFeatures(d), LinearRegression()).fit(xt.reshape(-1, 1), yt)
          e.append(np.mean((m.predict(xv.reshape(-1, 1)) - yv) ** 2))
      return degs[int(np.argmin(e))], e
  _rng = np.random.default_rng(8)
  _cases = []
  for _f in [lambda t: 2 * t + 1, lambda t: np.sin(4 * t)]:
      _x = _rng.uniform(-1, 1, 80)
      _y = _f(_x) + _rng.normal(0, 0.2, 80)
      _cases.append((_x[:50], _y[:50], _x[50:], _y[50:]))
  _bests = set()
  for _c in _cases:
      _degs = [1, 2, 3, 5, 7, 9]
      _wb, _we = _ref(*_c, _degs)
      _gb, _ge = choose_degree(*_c, _degs)
      assert len(_ge) == len(_degs), f"val_errors should have one entry per degree ({len(_degs)}), got {len(_ge)}"
      np.testing.assert_allclose(_ge, _we, rtol=1e-6, err_msg="validation MSEs should match: fit on the training data, score on the validation data")
      assert _gb == _wb, f"best degree should be {_wb} (lowest validation MSE), got {_gb}"
      _bests.add(_wb)
  assert len(_bests) == 2, "internal check: the two test datasets should prefer different degrees"
hints:
  - "x_tr.reshape(-1, 1) makes the 2-D input the pipeline expects."
  - "Use mean_squared_error(y_val, model.predict(x_val.reshape(-1, 1)))."
  - "degrees[int(np.argmin(val_errors))] picks the winner."
