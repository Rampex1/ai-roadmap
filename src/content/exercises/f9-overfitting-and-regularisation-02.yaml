id: f9-overfitting-and-regularisation-02
lesson: foundations/f9/overfitting-and-regularisation
title: When to stop early
prompt: |
  During training you record the validation loss after every epoch. Write
  `early_stopping(val_losses, patience)` that replays that list and returns a pair
  `(best_epoch, stop_epoch)` of **0-based** indices:

  - Go through the losses in order, remembering the best (lowest) loss so far and where it was. Only a
    strictly lower loss counts as an improvement.
  - Stop at the first epoch that is `patience` epochs after the best one with no improvement in between.
    That epoch is `stop_epoch`.
  - If that never happens, training runs to the end: `stop_epoch` is the last index.
  - `best_epoch` is the index of the best loss seen up to and including `stop_epoch`. Those are the weights
    you would restore.

  Example: `early_stopping([0.9, 0.7, 0.6, 0.65, 0.62, 0.61, 0.5], patience=3)` returns `(2, 5)`. The best
  is 0.6 at index 2, and indices 3, 4 and 5 bring no improvement, so training stops at 5 and never sees
  the 0.5.
starter: |
  def early_stopping(val_losses, patience):
      best_epoch = min(range(len(val_losses)), key=lambda i: val_losses[i])
      return best_epoch, len(val_losses) - 1
solution: |
  def early_stopping(val_losses, patience):
      best_epoch = 0
      best = val_losses[0]
      for epoch, loss in enumerate(val_losses):
          if loss < best:
              best, best_epoch = loss, epoch
          elif epoch - best_epoch >= patience:
              return best_epoch, epoch
      return best_epoch, len(val_losses) - 1
tests: |
  _r = early_stopping([0.9, 0.7, 0.6, 0.65, 0.62, 0.61, 0.5], 3)
  assert _r is not None and len(_r) == 2, "Return a pair: return best_epoch, stop_epoch"
  assert tuple(_r) == (2, 5), f"Lesson example with patience 3 should give (2, 5), got {_r}"
  assert tuple(early_stopping([0.9, 0.7, 0.6, 0.65, 0.62, 0.61, 0.5], 5)) == (6, 6), "With patience 5 training never stops early and finds 0.5 at index 6: expected (6, 6)"
  assert tuple(early_stopping([1.0, 0.9, 0.8, 0.7], 2)) == (3, 3), "Always improving: best is the last epoch and training runs to the end"
  assert tuple(early_stopping([0.5, 0.6, 0.7, 0.8, 0.9], 2)) == (0, 2), "Best at epoch 0, two epochs without improvement: stop at 2"
  assert tuple(early_stopping([0.5, 0.5, 0.5, 0.4], 2)) == (0, 2), "An equal loss is not an improvement: best stays at 0 and training stops at 2"
  assert tuple(early_stopping([0.8], 3)) == (0, 0), "A single epoch: best and stop are both 0"
  import random
  _rng = random.Random(4)
  for _ in range(20):
      _v = [round(_rng.uniform(0, 1), 3) for _ in range(_rng.randint(1, 15))]
      _pat = _rng.randint(1, 4)
      _b, _bi, _stop = _v[0], 0, len(_v) - 1
      for _i, _l in enumerate(_v):
          if _l < _b:
              _b, _bi = _l, _i
          elif _i - _bi >= _pat:
              _stop = _i
              break
      assert tuple(early_stopping(list(_v), _pat)) == (_bi, _stop), f"Wrong result for losses {_v} with patience {_pat}: expected {(_bi, _stop)}"
hints:
  - "Keep two variables, best and best_epoch, and update them only when loss < best."
  - "Inside the loop, if epoch - best_epoch >= patience, return straight away."
