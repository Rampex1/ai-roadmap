id: f8-gradient-boosting-01
lesson: foundations/f8/gradient-boosting
title: Gradient boosting with stumps, by hand
prompt: |
  Implement gradient boosting for regression with squared error, using **stumps** (depth-1 trees) as weak learners.

  `fit_boost(X, y, n_trees, lr)` returns a tuple `(f0, trees)`:

  1. `f0` is the mean of `y`, the starting prediction for every row.
  2. Repeat `n_trees` times: compute the residuals `y - pred`, fit
     `DecisionTreeRegressor(max_depth=1, random_state=0)` to `(X, residuals)`, append it to `trees`, and update
     `pred += lr * tree.predict(X)`.

  `predict_boost(f0, trees, lr, X)` returns `f0` plus `lr` times the sum of every tree's prediction on `X`.

  The tests compare your predictions with scikit-learn's
  `GradientBoostingRegressor(n_estimators=n_trees, learning_rate=lr, max_depth=1)`, which runs the same algorithm.
