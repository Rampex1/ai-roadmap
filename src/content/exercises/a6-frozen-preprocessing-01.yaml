id: a6-frozen-preprocessing-01
lesson: mle/a6/frozen-preprocessing
title: Apply frozen scaler state
prompt: Implement apply_scaler(values, centers, scales). Require matching lengths and positive finite scales. Inputs are finite. Return each centered value divided by the fitted scale.
starter: |
  def apply_scaler(values, centers, scales):
      raise NotImplementedError
solution: |
  import math
  def apply_scaler(values, centers, scales):
      if not (len(values) == len(centers) == len(scales)) or any(not (math.isfinite(s) and s > 0) for s in scales):
          raise ValueError("invalid fitted scaler")
      return [(value-center)/scale for value,center,scale in zip(values,centers,scales)]
tests: |
  assert apply_scaler([9,5],[5,5],[2,1]) == [2,0]
  assert apply_scaler([],[],[]) == []
  for args in [([1],[0,1],[1]),([1],[0],[0]),([1],[0],[float("inf")]),([1],[0],[float("nan")]),([1],[1],[1,2])]:
      try:
          apply_scaler(*args)
      except ValueError:
          pass
      else:
          raise AssertionError("Reject invalid state")
hints:
  - Validate lengths before zip to avoid silent truncation.
