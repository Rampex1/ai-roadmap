id: b6-lstm-gated-state-01
lesson: research/b6/lstm-gated-state
title: Implement lstm gated state
prompt: Implement lstm_from_gates. Inputs are an old cell value, activated forget, input and output gates within [0,1], and an activated candidate in [-1,1]. Return (new cell, hidden output).
starter: |
  def lstm_from_gates(cell,forget,insert,candidate,expose):
      raise NotImplementedError
solution: |
  def lstm_from_gates(cell,forget,insert,candidate,expose):
      from math import tanh
      next_cell = forget*cell + insert*candidate
      return next_cell,expose*tanh(next_cell)
tests: |
  from math import tanh
  assert lstm_from_gates(2,0.5,1,0.5,0)==(1.5,0)
  assert lstm_from_gates(3,1,0,-1,1)==(3,tanh(3))
  assert lstm_from_gates(3,0,1,-1,0.5)==(-1,0.5*tanh(-1))
  assert lstm_from_gates(1,0,0,1,1)==(0,0)
hints:
  - The output gate scales tanh of the new cell.
