id: a4-record-experiment-runs-01
lesson: mle/a4/record-experiment-runs
title: Build a recorded run
prompt: Implement run_record with keys id, dataset, revision, seed, params, metrics and artifact in the output. Copy the parameter and metric mappings so later top-level edits do not change the record.
starter: |
  def run_record(run_id, dataset, revision, seed, params, metrics, artifact):
      raise NotImplementedError
solution: |
  def run_record(run_id, dataset, revision, seed, params, metrics, artifact):
      return {"id": run_id, "dataset": dataset, "revision": revision, "seed": seed,
              "params": dict(params), "metrics": dict(metrics), "artifact": artifact}
tests: |
  params, metrics = {"lr":0.02}, {"loss":0.2}
  row = run_record("r1","d1","c1",4,params,metrics,"blob:1")
  assert row == {"id":"r1","dataset":"d1","revision":"c1","seed":4,"params":{"lr":0.02},"metrics":{"loss":0.2},"artifact":"blob:1"}
  params["lr"], metrics["loss"] = 1, 9
  assert row["params"]["lr"] == 0.02 and row["metrics"]["loss"] == 0.2
  assert run_record("r2","d2","c2",0,{},{},"blob:2")["params"] == {}
hints:
  - Copy mappings before storing them inside the result.
