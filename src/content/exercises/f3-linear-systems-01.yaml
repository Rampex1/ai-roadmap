id: f3-linear-systems-01
lesson: foundations/f3/linear-systems
title: Invert a 2x2 matrix by formula
prompt: |
  Write `det2(M)` and `inverse2(M)` for a $2 \times 2$ array `M` $= \begin{pmatrix} a & b \\ c & d \end{pmatrix}$,
  using the formulas from the lesson (no `np.linalg`):

  - `det2(M)` returns $ad - bc$.
  - `inverse2(M)` returns $\frac{1}{ad - bc}\begin{pmatrix} d & -b \\ -c & a \end{pmatrix}$ as a NumPy array.
    If the determinant is 0 the matrix is singular: raise a `ValueError`.

  The tests check that `inverse2(M) @ M` gives the identity.
starter: |
  import numpy as np

  def det2(M):
      a, b = M[0]
      c, d = M[1]
      # TODO
      return 0.0

  def inverse2(M):
      # TODO
      return M
solution: |
  import numpy as np

  def det2(M):
      a, b = M[0]
      c, d = M[1]
      return a * d - b * c

  def inverse2(M):
      a, b = M[0]
      c, d = M[1]
      det = det2(M)
      if det == 0:
          raise ValueError("matrix is singular")
      return np.array([[d, -b], [-c, a]]) / det
tests: |
  import math
  import numpy as np
  _A = np.array([[2.0, 3.0], [1.0, 1.0]])
  assert math.isclose(det2(_A), -1.0), f"det of [[2, 3], [1, 1]] should be -1, got {det2(_A)}"
  np.testing.assert_allclose(inverse2(_A), [[-1.0, 3.0], [1.0, -2.0]], err_msg="inverse of [[2, 3], [1, 1]] should be [[-1, 3], [1, -2]]")
  _rng = np.random.default_rng(11)
  for _ in range(3):
      _M = _rng.normal(size=(2, 2))
      assert math.isclose(det2(_M), float(np.linalg.det(_M)), rel_tol=1e-9, abs_tol=1e-12), "det2 disagrees with np.linalg.det for a random matrix"
      np.testing.assert_allclose(inverse2(_M) @ _M, np.eye(2), atol=1e-9, err_msg="inverse2(M) @ M should be the identity")
  for _S in (np.array([[1.0, 2.0], [2.0, 4.0]]), np.array([[1.0, 0.0], [0.0, 0.0]])):
      try:
          inverse2(_S)
      except ValueError:
          pass
      else:
          raise AssertionError(f"inverse2 should raise ValueError for the singular matrix {_S.tolist()}")
hints:
  - "a, b = M[0] unpacks the first row."
  - "Build np.array([[d, -b], [-c, a]]) and divide it by the determinant."
  - "Check det == 0 before dividing and raise ValueError."
