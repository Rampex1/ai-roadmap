id: f6-momentum-and-adam-01
lesson: foundations/f6/momentum-and-adam
title: A momentum step
prompt: |
  Write `momentum_step(theta, v, g, lr, beta)` that performs one step of gradient descent with
  momentum and returns the pair `(new_theta, new_v)`:

  $$\mathbf{v} \leftarrow \beta\,\mathbf{v} + \mathbf{g}, \qquad \boldsymbol{\theta} \leftarrow \boldsymbol{\theta} - \eta\,\mathbf{v}$$

  `g` is the gradient at the current `theta` (already computed for you). Use the **new** velocity in the
  parameter update. Do not modify the input arrays.

  Check: `momentum_step(np.array([1.0]), np.array([2.0]), np.array([4.0]), 0.1, 0.9)` returns
  `(array([0.42]), array([5.8]))`, since $v = 0.9 \cdot 2 + 4 = 5.8$ and $\theta = 1 - 0.1 \cdot 5.8$.
starter: |
  import numpy as np

  def momentum_step(theta, v, g, lr, beta):
      return theta - lr * g, v
solution: |
  import numpy as np

  def momentum_step(theta, v, g, lr, beta):
      v = beta * v + g
      theta = theta - lr * v
      return theta, v
tests: |
  import numpy as np
  _r = momentum_step(np.array([1.0]), np.array([2.0]), np.array([4.0]), 0.1, 0.9)
  assert _r is not None and len(_r) == 2, "Return a pair: return theta, v"
  np.testing.assert_allclose(_r[1], [5.8], err_msg="New velocity should be beta * v + g = 0.9 * 2 + 4 = 5.8")
  np.testing.assert_allclose(_r[0], [0.42], err_msg="New theta should use the new velocity: 1 - 0.1 * 5.8 = 0.42")
  _t, _v = np.array([3.0, 1.0]), np.zeros(2)
  _t2, _v2 = momentum_step(_t, _v, np.array([6.0, 100.0]), 0.01, 0.9)
  np.testing.assert_allclose(_t, [3.0, 1.0], err_msg="Do not modify theta in place")
  np.testing.assert_allclose(_v, [0.0, 0.0], err_msg="Do not modify v in place")
  np.testing.assert_allclose(_t2, [2.94, 0.0], err_msg="From v = 0 the first momentum step equals a plain gradient step")
  _grad = lambda p: np.array([2 * p[0], 100 * p[1]])
  _th, _vv = np.array([3.0, 1.0]), np.zeros(2)
  _rt, _rv = _th.copy(), _vv.copy()
  for _ in range(200):
      _th, _vv = momentum_step(_th, _vv, _grad(_th), 0.01, 0.9)
      _rv = 0.9 * _rv + _grad(_rt); _rt = _rt - 0.01 * _rv
  np.testing.assert_allclose(_th, _rt, rtol=1e-9, atol=1e-14, err_msg="After 200 momentum steps on x^2 + 50y^2 your theta differs from the reference")
  _t3, _v3 = momentum_step(np.array([1.0, -1.0]), np.array([0.5, 0.5]), np.array([1.0, -2.0]), 0.2, 0.0)
  np.testing.assert_allclose(_t3, [0.8, -0.6], err_msg="With beta = 0 momentum is plain gradient descent")
hints:
  - "Update the velocity first: v = beta * v + g."
  - "Then theta = theta - lr * v, and return both."
