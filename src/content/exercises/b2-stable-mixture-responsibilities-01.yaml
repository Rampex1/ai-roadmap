id: b2-stable-mixture-responsibilities-01
lesson: research/b2/stable-mixture-responsibilities
title: Normalise log-joint mixture scores
prompt: Implement responsibilities(log_joint). Values are finite or negative infinity. Reject empty inputs and vectors entirely negative infinity. Return normalised probabilities without underflow for equal very negative scores.
starter: |
  def responsibilities(log_joint):
      raise NotImplementedError
solution: |
  def responsibilities(log_joint):
      from math import exp
      if not log_joint or max(log_joint) == float("-inf"):
          raise ValueError("observation has no supported component")
      high = max(log_joint)
      weights = [exp(value-high) for value in log_joint]
      total = sum(weights)
      return [weight/total for weight in weights]
tests: |
  import math
  def close(a,b): return len(a)==len(b) and all(math.isclose(x,y,rel_tol=1e-9,abs_tol=1e-12) for x,y in zip(a,b))
  assert close(responsibilities([-1000,-1000]),[0.5,0.5])
  assert close(responsibilities([-2,float("-inf")]),[1,0])
  assert close(responsibilities([-5]),[1])
  assert close(responsibilities([-1000,0]),[0,1]), "subtract the maximum: exp(1000) overflows"
  assert close(responsibilities([math.log(1)-700,math.log(3)-700]),[0.25,0.75])
  for values in ([],[float("-inf")]*2):
      try:
          responsibilities(values)
      except ValueError:
          pass
      else:
          raise AssertionError("reject undefined responsibilities")
hints:
  - Subtract a common maximum before exponentiating.
