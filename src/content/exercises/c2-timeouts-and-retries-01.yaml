id: c2-timeouts-and-retries-01
lesson: llm/c2/timeouts-and-retries
title: Budget the next retry
prompt: Implement retry_delay(status, attempt, max_attempts, base, remaining, retry_after=0). Attempts start at one. Retry only status 408, 429, 500, 502, 503 or 504, before the attempt limit. Use the greater of the hinted delay and exponential delay, and return None if the wait leaves no time for another attempt.
starter: |
  def retry_delay(status, attempt, max_attempts, base, remaining, retry_after=0):
      raise NotImplementedError
solution: |
  def retry_delay(status, attempt, max_attempts, base, remaining, retry_after=0):
      transient = status in {408, 429, 500, 502, 503, 504}
      if not transient or attempt >= max_attempts:
          return None
      delay = max(base * 2 ** (attempt - 1), retry_after)
      return delay if delay < remaining else None
tests: |
  assert retry_delay(503, 3, 5, 0.5, 3) == 2, "Double the base for each retry"
  assert retry_delay(429, 1, 5, 0.5, 3, 2) == 2, "Respect the server hint"
  assert retry_delay(429, 1, 5, 0.5, 2, 2) is None, "Respect the deadline"
  assert retry_delay(503, 5, 5, 0.5, 30) is None, "Respect the attempt limit"
  assert retry_delay(400, 1, 5, 0.5, 30) is None, "Fix invalid input instead"
  assert retry_delay(501, 1, 5, 0.5, 30) is None, "501 Not Implemented is not in the transient list"
  assert retry_delay(408, 2, 5, 0.5, 30) == 1, "A 408 timeout is transient: the second attempt waits base times 2"
  assert retry_delay(503, 3, 5, 0.5, 30, 1) == 2, "When the hint is smaller than the backoff, use the backoff"
hints:
  - The first retry waits base seconds.
  - An equal deadline leaves no time to start.
