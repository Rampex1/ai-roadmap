id: b11-discounted-trajectory-return-01
lesson: research/b11/discounted-trajectory-return
title: Implement discounted trajectory return
prompt: Implement discounted_returns for a complete finite reward list and gamma in [0,1]. Return one return per index in chronological order. Reject invalid discounts.
starter: |
  def discounted_returns(rewards,gamma):
      raise NotImplementedError
solution: |
  def discounted_returns(rewards,gamma):
      if not 0<=gamma<=1:
          raise ValueError("invalid discount")
      future=0.0
      returns=[]
      for reward in reversed(rewards):
          future=reward+gamma*future
          returns.append(future)
      return list(reversed(returns))
tests: |
  assert discounted_returns([1,2,4],0.5)==[3,4,4]
  assert discounted_returns([1,-2,3],1)==[2,1,3]
  assert discounted_returns([1,5],0)==[1,5]
  assert discounted_returns([],0.5)==[]
  try:
      discounted_returns([1],1.5)
  except ValueError:
      pass
  else:
      raise AssertionError("reject gamma outside [0,1]")
hints:
  - Walk backward with the return from the following step.
