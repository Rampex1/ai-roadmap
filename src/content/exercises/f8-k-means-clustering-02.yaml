id: f8-k-means-clustering-02
lesson: foundations/f8/k-means-clustering
title: The silhouette score from scratch
prompt: |
  Write `silhouette(X, labels)` that returns the mean silhouette of a clustering, using Euclidean distances. For
  each point $i$:

  - $a_i$: the mean distance from $i$ to the **other** points of its own cluster;
  - $b_i$: for every other cluster, the mean distance from $i$ to its points; $b_i$ is the **smallest** of these;
  - $s_i = (b_i - a_i) / \max(a_i, b_i)$, except that $s_i = 0$ when $i$ is alone in its cluster.

  Return the mean of $s_i$ over all points. You may assume at least 2 clusters. Tip: build the full distance matrix
  once with broadcasting, `D = np.sqrt(((X[:, None, :] - X[None, :, :]) ** 2).sum(axis=2))`.

  The tests compare your result with `sklearn.metrics.silhouette_score`.
starter: |
