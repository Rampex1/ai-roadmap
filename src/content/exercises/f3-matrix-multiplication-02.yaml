id: f3-matrix-multiplication-02
lesson: foundations/f3/matrix-multiplication
title: Batches and collapsing layers
prompt: |
  1. Write `batch_layer(X, W, b)` that applies the linear layer $W\mathbf{x} + \mathbf{b}$ to every row of
     the batch `X` at once and returns an array of shape `(N, n_outputs)`. `W` has shape
     `(n_outputs, n_inputs)` and `X` has shape `(N, n_inputs)`. Use one matrix product, no loop.
  2. Two linear layers with no activation in between compute $W_2(W_1\mathbf{x})$. Write
     `collapse(W1, W2)` that returns the **single** matrix $M$ with $M\mathbf{x} = W_2(W_1\mathbf{x})$ for
     every $\mathbf{x}$. Think about the order.
starter: |
  import numpy as np

  def batch_layer(X, W, b):
      # TODO: one product, then add b
      return X

  def collapse(W1, W2):
      # TODO
      return W1 @ W2
solution: |
  import numpy as np

  def batch_layer(X, W, b):
      return X @ W.T + b

  def collapse(W1, W2):
      return W2 @ W1
tests: |
  import numpy as np
  _rng = np.random.default_rng(8)
  for _N, _i, _o in [(4, 3, 2), (1, 5, 5), (6, 2, 3)]:
      _X, _W, _b = _rng.normal(size=(_N, _i)), _rng.normal(size=(_o, _i)), _rng.normal(size=_o)
      _Y = batch_layer(_X, _W, _b)
      assert np.shape(_Y) == (_N, _o), f"A batch of {_N} through a {_i}->{_o} layer should have shape ({_N}, {_o}), got {np.shape(_Y)}"
      np.testing.assert_allclose(_Y, np.array([_W @ _x + _b for _x in _X]), err_msg="Row i of the result should equal W @ X[i] + b")
  _W1, _W2 = _rng.normal(size=(4, 3)), _rng.normal(size=(2, 4))
  _M = collapse(_W1, _W2)
  assert np.shape(_M) == (2, 3), f"W1 maps 3 -> 4 and W2 maps 4 -> 2, so the collapsed matrix should be (2, 3), got {np.shape(_M)}"
  for _ in range(3):
      _x = _rng.normal(size=3)
      np.testing.assert_allclose(_M @ _x, _W2 @ (_W1 @ _x), err_msg="collapse(W1, W2) @ x should equal W2 @ (W1 @ x)")
  _S1, _S2 = _rng.normal(size=(3, 3)), _rng.normal(size=(3, 3))
  np.testing.assert_allclose(collapse(_S1, _S2), _S2 @ _S1, err_msg="For square matrices the order still matters: first W1, then W2")
hints:
  - "X has examples as rows, so multiply by the transpose: X @ W.T."
  - "AB means first B, then A. Which matrix acts on x first?"
