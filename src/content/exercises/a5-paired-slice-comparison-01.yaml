id: a5-paired-slice-comparison-01
lesson: mle/a5/paired-slice-comparison
title: Summarise matched decisions
prompt: Implement paired_slices(rows) for (tag, before_correct, after_correct) with booleans or None. Use gain, regression, tie and missing keys for each observed tag. A missing side wins over any other category.
starter: |
  def paired_slices(rows):
      raise NotImplementedError
solution: |
  def paired_slices(rows):
      counts = {}
      for tag, before, after in rows:
          outcome = "missing" if before is None or after is None else (
              "gain" if after and not before else "regression" if before and not after else "tie")
          summary = counts.setdefault(tag, dict.fromkeys(("gain","regression","tie","missing"),0))
          summary[outcome] += 1
      return counts
tests: |
  assert paired_slices([("a",False,True),("a",True,False),("a",False,False),("a",None,True)]) == {"a":{"gain":1,"regression":1,"tie":1,"missing":1}}
  assert paired_slices([("b",True,None)])["b"]["missing"] == 1
  assert paired_slices([]) == {}
hints:
  - Check missingness before comparing correctness.
