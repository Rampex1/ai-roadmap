id: f9-autograd-engine-01
lesson: foundations/f9/autograd-engine
title: Your own autograd Value
prompt: |
  Finish the `Value` class. Addition is done for you as a model. Write:

  - `__mul__(self, other)`: returns a new Value for `self * other`, whose `_backward` adds
    `other.data * out.grad` to `self.grad` and `self.data * out.grad` to `other.grad`.
  - `tanh(self)`: returns a new Value for $\tanh$ of `self.data`, whose `_backward` adds
    $(1 - t^2)\cdot$`out.grad` to `self.grad`, where $t$ is the output.
  - `backward(self)`: builds a topological order of the graph (each node after its children), sets
    `self.grad = 1.0`, then calls `_backward()` on every node in **reverse** order.

  Accumulate gradients with `+=` so that a value used several times gets every contribution. Plain numbers
  must work on either side, so `2 * v` and `v * 2` both work (`__rmul__` is already set up).

  Check: for `a = Value(3.0)` and `b = a * a + a`, after `b.backward()` you get `a.grad == 7.0`.
starter: |
