id: f2-indexing-and-masks-03
lesson: foundations/f2/indexing-and-masks
title: Count values in a range
prompt: |
  Write `count_in_range(x, lo, hi)` that returns how many values of `x` satisfy
  `lo <= value < hi`, and `fraction_in_range(x, lo, hi)` that returns what fraction of the values do.
  Use a combined boolean mask, no loop.

  For `x = np.array([1, 5, 7, 10, 12])`, `count_in_range(x, 5, 10)` is `2` (5 and 7; 10 is excluded)
  and `fraction_in_range(x, 5, 10)` is `0.4`.
starter: |
  import numpy as np

  def count_in_range(x, lo, hi):
      """Return how many values of x satisfy lo <= value < hi."""
      return 0

  def fraction_in_range(x, lo, hi):
      """Return the fraction of values of x with lo <= value < hi."""
      return 0.0
solution: |
  import numpy as np

  def count_in_range(x, lo, hi):
      """Return how many values of x satisfy lo <= value < hi."""
      return int(((x >= lo) & (x < hi)).sum())

  def fraction_in_range(x, lo, hi):
      """Return the fraction of values of x with lo <= value < hi."""
      return float(((x >= lo) & (x < hi)).mean())
tests: |
  import math
  import numpy as np
  _x = np.array([1, 5, 7, 10, 12])
  assert count_in_range(_x, 5, 10) == 2, f"count_in_range(x, 5, 10) should be 2 (5 and 7), got {count_in_range(_x, 5, 10)!r}"
  assert count_in_range(_x, 0, 100) == 5, "Every value is in [0, 100)"
  assert count_in_range(_x, 13, 20) == 0, "No value is in [13, 20)"
  assert math.isclose(fraction_in_range(_x, 5, 10), 0.4), f"fraction_in_range(x, 5, 10) should be 0.4, got {fraction_in_range(_x, 5, 10)!r}"
  _y = np.array([0.1, 0.2, 0.3, 0.4])
  assert count_in_range(_y, 0.2, 0.4) == 2 and math.isclose(fraction_in_range(_y, 0.2, 0.4), 0.5), "For [0.1, 0.2, 0.3, 0.4] and the range [0.2, 0.4), the count is 2 and the fraction 0.5"
hints:
  - "Build the mask with `(x >= lo) & (x < hi)`, with brackets around each comparison."
  - "`mask.sum()` counts the True values and `mask.mean()` gives the fraction."
