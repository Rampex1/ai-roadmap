id: b0-gaussians-and-monte-carlo-01
lesson: research/b0/gaussians-and-monte-carlo
title: Sample a multivariate Gaussian with Cholesky
prompt: |
  Write two functions.

  1. `sample_gaussian(mu, Sigma, n, rng)`: return an `(n, d)` array whose rows are independent draws from
     $\mathcal{N}(\boldsymbol{\mu}, \Sigma)$. Compute the Cholesky factor `L` of `Sigma`, draw **all** the standard
     normals with a single call `Z = rng.standard_normal((n, d))`, and return `mu + Z @ L.T`. (Do not use
     `rng.multivariate_normal`.)
  2. `max_cov_error(X, Sigma)`: the largest absolute difference between the sample covariance of the rows of `X`
     (use `np.cov` with `rowvar=False`) and `Sigma`.

  The tests draw from several 2- and 3-dimensional Gaussians and check the sample mean and covariance.
starter: |
  import numpy as np

  def sample_gaussian(mu, Sigma, n, rng):
      d = len(mu)
      Z = rng.standard_normal((n, d))
      return mu + Z * np.sqrt(np.diag(Sigma))

  def max_cov_error(X, Sigma):
      return 0.0
solution: |
  import numpy as np

  def sample_gaussian(mu, Sigma, n, rng):
      mu = np.asarray(mu, dtype=float)
      L = np.linalg.cholesky(Sigma)
      Z = rng.standard_normal((n, len(mu)))
      return mu + Z @ L.T

  def max_cov_error(X, Sigma):
      return float(np.max(np.abs(np.cov(X, rowvar=False) - Sigma)))
tests: |
  import numpy as np
  _mu = np.array([1.0, -1.0]); _S = np.array([[2.0, 1.2], [1.2, 1.0]])
  _X = sample_gaussian(_mu, _S, 5, np.random.default_rng(0))
  assert _X is not None and np.shape(_X) == (5, 2), f"sample_gaussian should return shape (n, d) = (5, 2), got {np.shape(_X)}"
  _Z = np.random.default_rng(0).standard_normal((5, 2))
  np.testing.assert_allclose(_X, _mu + _Z @ np.linalg.cholesky(_S).T, rtol=1e-12, err_msg="Draw Z with one call rng.standard_normal((n, d)) and return mu + Z @ L.T, where L = np.linalg.cholesky(Sigma)")
  _cases = [(_mu, _S), (np.array([0.0, 2.0, 5.0]), np.array([[1.0, 0.8, -0.3], [0.8, 2.0, 0.5], [-0.3, 0.5, 0.7]]))]
  for _m, _C in _cases:
      _Y = sample_gaussian(_m, _C, 200_000, np.random.default_rng(1))
      np.testing.assert_allclose(_Y.mean(axis=0), _m, atol=0.02, err_msg="The sample mean is far from mu")
      np.testing.assert_allclose(np.cov(_Y, rowvar=False), _C, atol=0.03, err_msg="The sample covariance is far from Sigma: the correlations are missing. Use the Cholesky factor, not just the diagonal")
      _e = max_cov_error(_Y, _C)
      _want = np.max(np.abs(np.cov(_Y, rowvar=False) - _C))
      assert abs(_e - _want) < 1e-12, f"max_cov_error should be {_want:.5f}, got {_e!r}"
  _W = np.array([[0.0, 0.0], [2.0, 2.0], [4.0, 1.0]])
  assert abs(max_cov_error(_W, np.eye(2)) - np.max(np.abs(np.cov(_W, rowvar=False) - np.eye(2)))) < 1e-12, "max_cov_error is wrong on a small example: use np.cov(X, rowvar=False)"
hints:
  - "L = np.linalg.cholesky(Sigma) is lower triangular with L @ L.T equal to Sigma."
  - "With samples in rows, x_i^T = mu^T + z_i^T L^T, so the batch is mu + Z @ L.T."
  - "np.max(np.abs(np.cov(X, rowvar=False) - Sigma))"
