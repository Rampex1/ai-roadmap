id: f9-loss-functions-02
lesson: foundations/f9/loss-functions
title: Cross-entropy and its gradient
prompt: |
  Write `cross_entropy(Z, y)` that returns a pair `(loss, dZ)`:

  - `Z` holds logits, shape `(n, k)`; `y` holds integer class labels in `0..k-1`, shape `(n,)`.
  - `loss` is the **mean** cross-entropy $-\frac{1}{n}\sum_i \log p_{i, y_i}$, a float.
  - `dZ` is its gradient with respect to `Z`: $(P - Y)/n$, where $P$ is the softmax of each row and $Y$
    the one-hot labels. Shape `(n, k)`.

  The `log_softmax` helper from the lesson is given. The tests check `dZ` against finite differences and
  use logits large enough to break a naive softmax.
starter: |
  import numpy as np

  def log_softmax(Z):
      m = Z.max(axis=1, keepdims=True)
      return Z - m - np.log(np.exp(Z - m).sum(axis=1, keepdims=True))

  def cross_entropy(Z, y):
      n = len(y)
      logp = log_softmax(Z)
      loss = -logp[:, y].mean()
      dZ = np.zeros_like(Z)
      return loss, dZ
solution: |
  import numpy as np

  def log_softmax(Z):
      m = Z.max(axis=1, keepdims=True)
      return Z - m - np.log(np.exp(Z - m).sum(axis=1, keepdims=True))

  def cross_entropy(Z, y):
      n = len(y)
      logp = log_softmax(Z)
      loss = -logp[np.arange(n), y].mean()
      dZ = np.exp(logp)
      dZ[np.arange(n), y] -= 1
      return loss, dZ / n
tests: |
  import numpy as np
  _Z = np.array([[2.0, 1.0, 0.1], [0.5, 2.5, -1.0], [-50.0, 0.0, 800.0]])
  _y = np.array([0, 1, 0])
  _r = cross_entropy(_Z, _y)
  assert _r is not None and len(_r) == 2, "Return a pair: return loss, dZ"
  _loss, _dZ = _r
  assert abs(float(_loss) - 283.5231) < 1e-3, f"Mean cross-entropy for the lesson example should be about 283.523, got {_loss}: pick each row's true class with logp[np.arange(n), y]"
  assert np.shape(_dZ) == (3, 3), "dZ must have the same shape as Z"
  np.testing.assert_allclose(_dZ, [[-0.113666, 0.080811, 0.032855], [0.038705, -0.047341, 0.008636], [-1 / 3, 0.0, 1 / 3]], atol=1e-4, err_msg="dZ should be (softmax(Z) - one_hot(y)) / n")
  def _ce(Z, y):
      m = Z.max(axis=1, keepdims=True)
      lp = Z - m - np.log(np.exp(Z - m).sum(axis=1, keepdims=True))
      return -lp[np.arange(len(y)), y].mean()
  _rng = np.random.default_rng(11)
  for _n, _k in [(5, 4), (1, 3), (8, 10)]:
      _Zr = _rng.normal(0, 2, size=(_n, _k)); _yr = _rng.integers(0, _k, size=_n)
      _l, _g = cross_entropy(_Zr.copy(), _yr)
      assert abs(float(_l) - _ce(_Zr, _yr)) < 1e-10, f"Wrong loss for a random batch of {_n} examples and {_k} classes"
      _num = np.zeros_like(_Zr); _h = 1e-6
      for _i in range(_n):
          for _j in range(_k):
              _E = np.zeros_like(_Zr); _E[_i, _j] = _h
              _num[_i, _j] = (_ce(_Zr + _E, _yr) - _ce(_Zr - _E, _yr)) / (2 * _h)
      np.testing.assert_allclose(_g, _num, atol=1e-7, err_msg=f"dZ disagrees with finite differences for {_n} examples and {_k} classes: did you divide by n?")
hints:
  - "logp[np.arange(n), y] picks one entry per row: row i, column y[i]. logp[:, y] picks whole columns instead."
  - "Start from the probabilities np.exp(logp), subtract 1 at each true class with dZ[np.arange(n), y] -= 1, then divide by n."
