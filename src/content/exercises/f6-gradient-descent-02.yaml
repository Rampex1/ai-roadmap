id: f6-gradient-descent-02
lesson: foundations/f6/gradient-descent
title: A gradient descent loop that keeps its history
prompt: |
  Write `gradient_descent(grad, theta0, lr, steps)` that runs `steps` gradient descent steps from
  `theta0` and returns the **history**: a 2-D NumPy array with `steps + 1` rows, where row `t` is the
  parameter vector after `t` steps (row 0 is `theta0` itself).

  Add an optional early stop: `gradient_descent(grad, theta0, lr, steps, tol=None)`. When `tol` is a
  number, check the gradient **before** each step and stop as soon as `np.linalg.norm(grad(theta)) < tol`,
  so the history can have fewer than `steps + 1` rows. With `tol=None` always take all `steps` steps.

  Also write `final_loss(f, history)` that returns `f` evaluated at the last row.

  Check: for $f(x) = x^2$ (`grad = lambda p: 2 * p`) from `[1.0]` with `lr = 0.1` and 3 steps, the
  history is `[[1.0], [0.8], [0.64], [0.512]]`.
starter: |
  import numpy as np

  def gradient_descent(grad, theta0, lr, steps, tol=None):
      theta = np.array(theta0, dtype=float)
      history = [theta.copy()]
      return np.array(history)

  def final_loss(f, history):
      return None
solution: |
  import numpy as np

  def gradient_descent(grad, theta0, lr, steps, tol=None):
      theta = np.array(theta0, dtype=float)
      history = [theta.copy()]
      for _ in range(steps):
          g = grad(theta)
          if tol is not None and np.linalg.norm(g) < tol:
              break
          theta = theta - lr * g
          history.append(theta.copy())
      return np.array(history)

  def final_loss(f, history):
      return f(history[-1])
tests: |
  import numpy as np
  _h = gradient_descent(lambda p: 2 * p, [1.0], 0.1, 3)
  assert _h is not None, "Return the history array"
  _h = np.asarray(_h)
  assert _h.shape == (4, 1), f"With 3 steps and 1 parameter the history should have shape (4, 1), got {_h.shape}"
  np.testing.assert_allclose(_h[:, 0], [1.0, 0.8, 0.64, 0.512], err_msg="For x^2 from 1 with lr 0.1 expected 1, 0.8, 0.64, 0.512")
  _f = lambda p: p[0]**2 + 10 * p[1]**2
  _g = lambda p: np.array([2 * p[0], 20 * p[1]])
  _h2 = np.asarray(gradient_descent(_g, [3.0, 1.0], 0.09, 6))
  assert _h2.shape == (7, 2), f"6 steps with 2 parameters should give shape (7, 2), got {_h2.shape}"
  np.testing.assert_allclose(_h2[0], [3.0, 1.0], err_msg="Row 0 must be the starting point")
  np.testing.assert_allclose(_h2[1], [2.46, -0.8], err_msg="Row 1 should be one step from the start")
  _ref = np.array([3.0, 1.0])
  for _ in range(6):
      _ref = _ref - 0.09 * _g(_ref)
  np.testing.assert_allclose(_h2[-1], _ref, err_msg="The last row should be the point after all 6 steps")
  assert abs(final_loss(_f, _h2) - _f(_ref)) < 1e-12, "final_loss should evaluate f at the last row of the history"
  assert len(np.unique(_h2[:, 0])) == 7, "Rows must be different points: append a copy of theta after every step"
  _h0 = np.asarray(gradient_descent(_g, [3.0, 1.0], 0.09, 0))
  assert _h0.shape == (1, 2), "With 0 steps the history is just the starting point, shape (1, 2)"
  _ht = np.asarray(gradient_descent(lambda p: 2 * p, [1.0], 0.5, 10, tol=1e-9))
  assert _ht.shape == (2, 1), f"For x^2 from 1 with lr 0.5 the first step lands on 0, so with tol the history should stop at shape (2, 1), got {_ht.shape}"
  _ht2 = np.asarray(gradient_descent(lambda p: 2 * p, [1.0], 0.1, 1000, tol=1e-3))
  _k = int(np.ceil(np.log(1e-3 / 2) / np.log(0.8)))
  assert len(_ht2) == _k + 1, f"With tol 1e-3, x^2 from 1 and lr 0.1 should stop after {_k} steps (history length {_k + 1}), got {len(_ht2)}"
  assert np.linalg.norm(2 * _ht2[-1]) < 1e-3 and np.linalg.norm(2 * _ht2[-2]) >= 1e-3, "Stop at the first point whose gradient norm is below tol"
  assert len(gradient_descent(lambda p: 2 * p, [1.0], 0.1, 50)) == 51, "With tol=None take all the steps"
hints:
  - "Loop steps times: update theta with theta - lr * grad(theta), then append theta.copy() to the list."
  - "np.array(list_of_1d_arrays) stacks them into rows."
  - "For the early stop compute g = grad(theta) first and break out of the loop if tol is not None and np.linalg.norm(g) < tol."
