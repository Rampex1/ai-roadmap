id: a1-when-to-use-ml-01
lesson: mle/a1/when-to-use-ml
title: Measure a fraud rule like a model
prompt: |
  Write two functions.

  1. `rule_flags(df, amount_limit)` takes a DataFrame with columns `amount` (float), `new_device` (bool)
     and `foreign` (bool). It returns a boolean Series that is `True` where the amount is **strictly
     greater** than `amount_limit` **and** the transaction is from a new device **or** a foreign merchant.
  2. `evaluate(y, flags)` takes the true labels `y` and the flags (boolean arrays or Series of the same
     length) and returns a dict with keys `"precision"`, `"recall"` and `"flag_rate"` (the share of
     rows flagged). If nothing is flagged, precision is `0.0`; if there are no positives, recall is `0.0`.

  For the small table below, `evaluate(df["fraud"], rule_flags(df, 200))` should give precision `0.5`,
  recall `0.5` and flag rate `0.4`.
starter: |
  import numpy as np
  import pandas as pd

  df = pd.DataFrame({
      "amount":     [250.0, 900.0, 50.0, 300.0, 1200.0],
      "new_device": [True,  False, True, False, False],
      "foreign":    [False, True,  False, False, False],
      "fraud":      [True,  False, True,  False, False],
  })

  def rule_flags(df, amount_limit):
      pass

  def evaluate(y, flags):
      pass

  print(evaluate(df["fraud"], rule_flags(df, 200)))
solution: |
  import numpy as np
  import pandas as pd

  df = pd.DataFrame({
      "amount":     [250.0, 900.0, 50.0, 300.0, 1200.0],
      "new_device": [True,  False, True, False, False],
      "foreign":    [False, True,  False, False, False],
      "fraud":      [True,  False, True,  False, False],
  })

  def rule_flags(df, amount_limit):
      return (df["amount"] > amount_limit) & (df["new_device"] | df["foreign"])

  def evaluate(y, flags):
      y = np.asarray(y, dtype=bool)
      flags = np.asarray(flags, dtype=bool)
      tp = np.sum(y & flags)
      precision = tp / flags.sum() if flags.sum() > 0 else 0.0
      recall = tp / y.sum() if y.sum() > 0 else 0.0
      return {"precision": float(precision), "recall": float(recall), "flag_rate": float(flags.mean())}

  print(evaluate(df["fraud"], rule_flags(df, 200)))
tests: |
  import math
  import numpy as np
  import pandas as pd
  assert callable(rule_flags) and callable(evaluate), "Define both rule_flags and evaluate"
  _f = rule_flags(df, 200)
  assert _f is not None, "rule_flags should return a boolean Series, not None"
  assert list(np.asarray(_f, dtype=bool)) == [True, True, False, False, False], f"rule_flags(df, 200) should be [True, True, False, False, False], got {list(np.asarray(_f))}"
  assert list(np.asarray(rule_flags(df, 1000), dtype=bool)) == [False] * 5, "With amount_limit=1000 nothing qualifies: the 1200 row is neither a new device nor foreign"
  _d = pd.DataFrame({"amount": [200.0, 200.01, 10.0], "new_device": [True, True, False], "foreign": [True, False, True]})
  assert list(np.asarray(rule_flags(_d, 200), dtype=bool)) == [False, True, False], "The amount must be strictly greater than the limit"
  _r = evaluate(df["fraud"], rule_flags(df, 200))
  assert isinstance(_r, dict), "evaluate should return a dict"
  for _k, _v in {"precision": 0.5, "recall": 0.5, "flag_rate": 0.4}.items():
      assert _k in _r, f"The dict needs the key {_k!r}"
      assert math.isclose(_r[_k], _v), f"{_k} should be {_v} for the example table, got {_r[_k]}"
  _r = evaluate(np.array([1, 1, 1, 0, 0, 0, 0, 0], dtype=bool), np.array([1, 0, 0, 1, 1, 1, 0, 0], dtype=bool))
  assert math.isclose(_r["precision"], 0.25) and math.isclose(_r["recall"], 1 / 3) and math.isclose(_r["flag_rate"], 0.5), f"For 1 TP, 3 FP, 2 FN out of 8 rows expected precision 0.25, recall 1/3, flag_rate 0.5, got {_r}"
  _r = evaluate(np.array([True, False]), np.array([False, False]))
  assert math.isclose(_r["precision"], 0.0) and math.isclose(_r["flag_rate"], 0.0), f"Nothing flagged: precision and flag_rate should be 0.0, got {_r}"
  _r = evaluate(np.array([False, False]), np.array([True, False]))
  assert math.isclose(_r["recall"], 0.0), f"No positives: recall should be 0.0, got {_r}"
hints:
  - "Combine boolean Series with & and |, and wrap each comparison in brackets."
  - "Convert both inputs with np.asarray(..., dtype=bool), then true positives are np.sum(y & flags)."
  - "Guard the divisions: only divide by flags.sum() or y.sum() when it is greater than zero."
