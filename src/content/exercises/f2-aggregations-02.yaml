id: f2-aggregations-02
lesson: foundations/f2/aggregations
title: Rows that sum to one
prompt: |
  Write `row_normalise(m)` that divides every row of the 2D array `m` by that row's sum, so that
  each row of the result adds up to 1. Use `keepdims=True` so the row sums broadcast correctly.

  For example `row_normalise(np.array([[1, 3], [2, 2]]))` is `[[0.25, 0.75], [0.5, 0.5]]`.
starter: |
  import numpy as np

  def row_normalise(m):
      """Return m with each row divided by its sum."""
      return m / m.sum()
solution: |
  import numpy as np

  def row_normalise(m):
      """Return m with each row divided by its sum."""
      return m / m.sum(axis=1, keepdims=True)
tests: |
  import numpy as np
  np.testing.assert_allclose(row_normalise(np.array([[1, 3], [2, 2]])), [[0.25, 0.75], [0.5, 0.5]], err_msg="Divide each row by its own sum, not by the sum of the whole array")
  _m = np.array([[3.0, 5.0, 2.0, 4.0], [6.0, 1.0, 7.0, 2.0], [4.0, 4.0, 4.0, 4.0]])
  _r = row_normalise(_m)
  assert _r.shape == _m.shape, f"The result should keep the shape {_m.shape}, got {_r.shape}"
  np.testing.assert_allclose(_r.sum(axis=1), [1.0, 1.0, 1.0], err_msg="Every row of the result should sum to 1")
  np.testing.assert_allclose(_r[2], [0.25, 0.25, 0.25, 0.25])
  np.testing.assert_allclose(row_normalise(np.array([[2.0, 6.0, 2.0]])), [[0.2, 0.6, 0.2]], err_msg="A single row should work too")
hints:
  - "`m.sum(axis=1)` gives one sum per row, but its shape (n,) lines up with the columns."
  - "`m.sum(axis=1, keepdims=True)` has shape (n, 1), a column that broadcasts across each row."
