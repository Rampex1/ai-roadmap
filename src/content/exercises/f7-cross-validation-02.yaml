id: f7-cross-validation-02
lesson: foundations/f7/cross-validation
title: Cross-validation by hand
prompt: |
  Write `cv_mse(model, X, y, k)` that returns the mean validation MSE over `k` folds. Split with
  `KFold(n_splits=k)` (no shuffling). For each fold, fit a **fresh copy** of the model,
  `clone(model)`, on the training rows and compute the MSE on the validation rows. Then average.

  Why `clone`? Fitting the same object again would work for most models, but a fresh copy guarantees
  that nothing learned on one fold leaks into the next. The tests compare with
  `cross_val_score(..., scoring="neg_mean_squared_error")`.
starter: |
