id: a3-join-point-in-time-features-01
lesson: mle/a3/join-point-in-time-features
title: Select an eligible historical value
prompt: Implement available_value(rows, entity, decision). Rows are (entity, event_time, available_time, revision_id, value), with distinct comparable IDs for ties. Filter on entity and both timestamps. Choose maximum (event_time, available_time, revision_id), else None.
starter: |
  def available_value(rows, entity, decision):
      raise NotImplementedError
solution: |
  def available_value(rows, entity, decision):
      eligible = [row for row in rows if row[0] == entity and row[1] <= decision and row[2] <= decision]
      best = max(eligible, key=lambda row: (row[1], row[2], row[3]), default=None)
      return best[4] if best is not None else None
tests: |
  rows = [("a",1,2,"x",4),("a",3,8,"y",9),("b",4,4,"z",100),("a",2,5,"w",0)]
  assert available_value(rows,"a",4) == 4
  assert available_value(rows,"a",5) == 0
  assert available_value(rows,"a",8) == 9
  assert available_value(rows,"a",0) is None
  assert available_value([("a",1,1,"b",2),("a",1,1,"a",3)],"a",1) == 2
  assert available_value([("a",1,5,"r",1),("a",2,3,"s",2)],"a",5) == 2, "Choose the latest event_time first; available_time only breaks ties"
hints:
  - Filter availability before selecting the latest event.
