id: f2-matplotlib-02
lesson: foundations/f2/matplotlib
title: Two plots side by side
prompt: |
  Write `plot_overview(df)` for a table with columns `city` and `price`. Make a figure with **two axes side
  by side** using `plt.subplots(1, 2)` and return the figure:

  1. left: a **histogram** of `price` with 10 bins, x label `"price"`, y label `"count"`;
  2. right: a **bar chart** of the **mean price per city** (use `groupby`), one bar per city in the order
     groupby returns them, with y label `"mean price"`.
starter: |
