id: f3-vectors-02
lesson: foundations/f3/vectors
title: The centre of a point cloud
prompt: |
  A dataset is a stack of row vectors. Write `centroid(X)` that returns the mean of the rows of the
  2-D array `X`: the vector whose $j$-th component is the average of column $j$.

  Do it as a linear combination: loop over the rows, add them up, then scale by $1/n$ where $n$ is the
  number of rows. Do not use `X.mean`, `np.mean` or `np.sum` (the tests compare your answer with them).

  Then write `centre(X)` that returns `X` with the centroid subtracted from every row, so the new
  cloud of points is centred on the origin. (You will need this for PCA at the end of the module.)
starter: |
  import numpy as np

  def centroid(X):
      total = np.zeros(X.shape[1])
      # TODO: add every row, then divide by the number of rows
      return total

  def centre(X):
      # TODO: subtract the centroid from every row
      return X
solution: |
  import numpy as np

  def centroid(X):
      total = np.zeros(X.shape[1])
      for row in X:
          total = total + row
      return total / X.shape[0]

  def centre(X):
      return X - centroid(X)
tests: |
  import numpy as np
  _X = np.array([[120.0, 3.0, 15.0], [85.0, 2.0, 40.0], [200.0, 4.0, 5.0]])
  np.testing.assert_allclose(centroid(_X), [135.0, 3.0, 20.0], err_msg="centroid of the three houses should be [135, 3, 20]")
  _rng = np.random.default_rng(1)
  for _shape in [(10, 2), (7, 4), (1, 3)]:
      _Y = _rng.normal(size=_shape) * 5 + 2
      np.testing.assert_allclose(centroid(_Y), _Y.mean(axis=0), err_msg=f"centroid is wrong for a {_shape} array")
      _C = centre(_Y)
      assert _C.shape == _Y.shape, f"centre should keep the shape {_shape}, got {_C.shape}"
      np.testing.assert_allclose(_C.mean(axis=0), np.zeros(_shape[1]), atol=1e-12, err_msg="After centre(X) every column should average to 0")
      np.testing.assert_allclose(_Y - _C, np.tile(_Y.mean(axis=0), (_shape[0], 1)), err_msg="centre should subtract the same centroid from every row")
hints:
  - "for row in X: gives each row as a 1-D array."
  - "Divide the total by X.shape[0], the number of rows."
  - "X - centroid(X) subtracts the vector from every row thanks to broadcasting."
