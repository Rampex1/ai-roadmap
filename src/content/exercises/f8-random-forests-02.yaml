  from sklearn.ensemble import RandomForestRegressor

  def perm_importance(model, X, y, n_repeats, rng):
      base = model.score(X, y)
      importances = np.zeros(X.shape[1])
      # TODO
      return importances

  rng = np.random.default_rng(0)
  X = rng.normal(size=(400, 3))
  y = 3 * X[:, 0] + X[:, 1] + rng.normal(0, 0.5, 400)
  model = RandomForestRegressor(n_estimators=30, random_state=0).fit(X[:300], y[:300])
  print(np.round(perm_importance(model, X[300:], y[300:], 5, np.random.default_rng(1)), 3))
solution: |
  import numpy as np
  from sklearn.ensemble import RandomForestRegressor

  def perm_importance(model, X, y, n_repeats, rng):
      base = model.score(X, y)
      importances = np.zeros(X.shape[1])
      for j in range(X.shape[1]):
          drops = []
          for _ in range(n_repeats):
              Xp = X.copy()
              Xp[:, j] = rng.permutation(X[:, j])
              drops.append(base - model.score(Xp, y))
          importances[j] = np.mean(drops)
      return importances

  rng = np.random.default_rng(0)
  X = rng.normal(size=(400, 3))
  y = 3 * X[:, 0] + X[:, 1] + rng.normal(0, 0.5, 400)
  model = RandomForestRegressor(n_estimators=30, random_state=0).fit(X[:300], y[:300])
  print(np.round(perm_importance(model, X[300:], y[300:], 5, np.random.default_rng(1)), 3))
tests: |
  import numpy as np
  from sklearn.linear_model import LinearRegression, LogisticRegression
  def _ref(model, X, y, n_repeats, rng):
      base = model.score(X, y)
      out = []
      for j in range(X.shape[1]):
          d = []
          for _ in range(n_repeats):
              Xp = X.copy(); Xp[:, j] = rng.permutation(X[:, j]); d.append(base - model.score(Xp, y))
          out.append(np.mean(d))
      return np.array(out)
  _rng = np.random.default_rng(0)
  _X = _rng.normal(size=(200, 4))
  _y = 2 * _X[:, 0] - _X[:, 2] + _rng.normal(0, 0.3, 200)
  _m = LinearRegression().fit(_X[:100], _y[:100])
  _Xt, _yt = _X[100:], _y[100:]
  _keep = _Xt.copy()
  _got = np.asarray(perm_importance(_m, _Xt, _yt, 4, np.random.default_rng(5)), dtype=float)
  assert np.array_equal(_Xt, _keep), "perm_importance must not modify X: shuffle a copy"
  assert _got.shape == (4,), f"Return one importance per column, shape (4,), got {_got.shape}"
  _want = _ref(_m, _Xt, _yt, 4, np.random.default_rng(5))
  assert np.allclose(_got, _want), f"Expected {np.round(_want, 4).tolist()}, got {np.round(_got, 4).tolist()}. Check the loop order (columns outer, repeats inner) and that each drop is base - permuted score"
  assert _got[0] > _got[2] > 0.05 and abs(_got[1]) < 0.05 and abs(_got[3]) < 0.05, "Column 0 should matter most, column 2 next, columns 1 and 3 not at all"
  _Xc = _rng.normal(size=(300, 3)); _yc = (_Xc[:, 1] > 0).astype(int)
  _mc = LogisticRegression().fit(_Xc[:150], _yc[:150])
  _got2 = np.asarray(perm_importance(_mc, _Xc[150:], _yc[150:], 3, np.random.default_rng(2)), dtype=float)
  _want2 = _ref(_mc, _Xc[150:], _yc[150:], 3, np.random.default_rng(2))
  assert np.allclose(_got2, _want2), f"For a classifier expected {np.round(_want2, 4).tolist()}, got {np.round(_got2, 4).tolist()}"
hints:
  - "Inside the inner loop: Xp = X.copy(); Xp[:, j] = rng.permutation(X[:, j])."
  - "Each drop is base - model.score(Xp, y); average the n_repeats drops for column j."
