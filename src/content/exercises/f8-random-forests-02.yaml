id: f8-random-forests-02
lesson: foundations/f8/random-forests
title: Permutation importance from scratch
prompt: |
  Write `perm_importance(model, X, y, n_repeats, rng)` for any fitted scikit-learn model and held-out data `X, y`.
  Return a 1-D array with one importance per column of `X`:

  1. `base = model.score(X, y)`.
  2. For each column `j` (outer loop), repeat `n_repeats` times (inner loop): copy `X`, replace column `j` with
     `rng.permutation(X[:, j])`, and record `base - model.score(X_perm, y)`.
  3. The importance of column `j` is the mean of its `n_repeats` drops.

  Keep the loops in exactly that order so that results match a reference with the same generator. Do not modify
  `X` itself.

  The starter fits a forest where column 2 is pure noise: its importance should be close to 0.
starter: |
