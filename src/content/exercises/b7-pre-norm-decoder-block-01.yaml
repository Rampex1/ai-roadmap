id: b7-pre-norm-decoder-block-01
lesson: research/b7/pre-norm-decoder-block
title: Implement token-wise layer normalisation
prompt: Implement normalize_token(row, epsilon=1e-5) with population variance within one token row and epsilon inside the square root. Reject empty rows and nonpositive epsilon.
starter: |
  def normalize_token(row,epsilon=1e-5):
      raise NotImplementedError
solution: |
  def normalize_token(row,epsilon=1e-5):
      from math import sqrt
      if not row or epsilon<=0:
          raise ValueError("need a nonempty row and positive epsilon")
      mean = sum(row)/len(row)
      centered = [value-mean for value in row]
      variance = sum(value*value for value in centered)/len(row)
      return [value/sqrt(variance+epsilon) for value in centered]
tests: |
  a=normalize_token([1,3],3)
  assert a==[-0.5,0.5]
  assert normalize_token([7,7])==[0,0]
  assert normalize_token([2])==[0]
  try:
      normalize_token([],1)
  except ValueError:
      pass
  else:
      raise AssertionError("reject empty row")
  try:
      normalize_token([1,3],0)
  except ValueError:
      pass
  else:
      raise AssertionError("reject zero epsilon")
hints:
  - Divide squared deviations by the feature count.
