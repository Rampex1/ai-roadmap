id: c3-validate-structured-output-01
lesson: llm/c3/validate-structured-output
title: Validate a routing reply
prompt: Write parse_label(text). Parse JSON and return the label only if the object has exactly the label field and its value is billing, technical or other. Return None for invalid text or shape.
starter: |
  def parse_label(text):
      raise NotImplementedError
solution: |
  def parse_label(text):
      import json
      try:
          value = json.loads(text)
      except json.JSONDecodeError:
          return None
      if not isinstance(value, dict) or set(value) != {"label"}:
          return None
      label = value["label"]
      return label if label in ("billing", "technical", "other") else None
tests: |
  assert parse_label('{"label": "technical"}') == "technical", "Accept a valid enum"
  assert parse_label('{"label": "other"}') == "other", "Other is a valid decision"
  for invalid in ('{"label":', '["billing"]', '{"label": ["technical"]}', '{"label": "typo"}', '{"label": "billing", "comment": ""}'):
      assert parse_label(invalid) is None, f"Reject invalid reply: {invalid}"
hints:
  - Handle JSON syntax errors before inspecting keys.
