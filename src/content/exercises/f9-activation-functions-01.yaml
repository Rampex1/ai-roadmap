id: f9-activation-functions-01
lesson: foundations/f9/activation-functions
title: Activations and their derivatives
prompt: |
  Write six functions. Each takes a NumPy array `z` (any shape) and returns an array of the same shape,
  computed element by element:

  | Function | Returns |
  |---|---|
  | `sigmoid(z)` | $1 / (1 + e^{-z})$ |
  | `sigmoid_grad(z)` | $\sigma(z)(1 - \sigma(z))$ |
  | `tanh(z)` | $\tanh z$ (you may use `np.tanh`) |
  | `tanh_grad(z)` | $1 - \tanh^2 z$ |
  | `relu(z)` | $\max(0, z)$ |
  | `relu_grad(z)` | `1.0` where $z > 0$, else `0.0` (so 0 at exactly 0) |

  The tests compare every derivative with a central finite difference, so a wrong formula will show up.
starter: |
  import numpy as np

  def sigmoid(z):
      return 1 / (1 + np.exp(-z))

  def sigmoid_grad(z):
      return sigmoid(z)

  def tanh(z):
      return np.tanh(z)

  def tanh_grad(z):
      return 1 - z ** 2

  def relu(z):
      return np.max(z)

  def relu_grad(z):
      pass
solution: |
  import numpy as np

  def sigmoid(z):
      return 1 / (1 + np.exp(-z))

  def sigmoid_grad(z):
      s = sigmoid(z)
      return s * (1 - s)

  def tanh(z):
      return np.tanh(z)

  def tanh_grad(z):
      return 1 - np.tanh(z) ** 2

  def relu(z):
      return np.maximum(0, z)

  def relu_grad(z):
      return (z > 0).astype(float)
tests: |
  import numpy as np
  _z = np.array([-3.0, -1.0, 0.0, 1.0, 3.0])
  np.testing.assert_allclose(sigmoid(_z), [0.04742587, 0.26894142, 0.5, 0.73105858, 0.95257413], rtol=1e-6, err_msg="sigmoid values are wrong")
  np.testing.assert_allclose(tanh(_z), np.tanh(_z), rtol=1e-12, err_msg="tanh values are wrong")
  _r = relu(_z)
  assert np.shape(_r) == _z.shape, "relu must work element by element and keep the shape: use np.maximum, not np.max"
  np.testing.assert_allclose(_r, [0, 0, 0, 1, 3], err_msg="relu should replace negatives with 0 and keep positives")
  _rng = np.random.default_rng(2)
  _Z = _rng.normal(0, 2, size=(4, 3)); _Z[np.abs(_Z) < 1e-3] = 0.5
  _h = 1e-6
  for _name, _f, _df in [("sigmoid", sigmoid, sigmoid_grad), ("tanh", tanh, tanh_grad), ("relu", relu, relu_grad)]:
      _g = _df(_Z)
      assert _g is not None and np.shape(_g) == _Z.shape, f"{_name}_grad must return an array with the same shape as z"
      _num = (_f(_Z + _h) - _f(_Z - _h)) / (2 * _h)
      np.testing.assert_allclose(_g, _num, atol=1e-6, err_msg=f"{_name}_grad disagrees with a finite difference of {_name}")
  np.testing.assert_allclose(sigmoid_grad(np.array([0.0])), [0.25], err_msg="sigmoid_grad(0) should be 0.25")
  np.testing.assert_allclose(tanh_grad(np.array([0.0, 2.0])), [1.0, 1 - np.tanh(2.0) ** 2], err_msg="tanh_grad(0) should be 1; use 1 - tanh(z)**2, not 1 - z**2")
  np.testing.assert_allclose(relu_grad(np.array([-2.0, 0.0, 0.5])), [0.0, 0.0, 1.0], err_msg="relu_grad should be 0 for z <= 0 and 1 for z > 0")
hints:
  - "np.maximum(0, z) compares element by element; np.max(z) returns a single number."
  - "For tanh_grad, compute t = np.tanh(z) first and return 1 - t ** 2."
  - "(z > 0) is a boolean array; .astype(float) turns it into 0.0 and 1.0."
