title: Train logistic regression by gradient descent
prompt: |
  Write `fit_logistic(X, y, lr=0.5, steps=3000)` that trains logistic regression with full-batch
  gradient descent from `w = 0`, `b = 0` and returns `(w, b)`. Each step computes
  $\mathbf{p} = \sigma(X\mathbf{w} + b)$ and moves `w` and `b` against the gradients from the lesson.

  The tests compare with `LogisticRegression(C=1e6)`, which is almost unpenalised, so both should
  find the same minimum of the log loss. The plot shows the data and your decision boundary
  $w_1 x_1 + w_2 x_2 + b = 0$.
