id: c11-bound-operating-cost-01
lesson: llm/c11/bound-operating-cost
title: Estimate a token bill
prompt: Implement token_cost for nonnegative counts and USD prices per million tokens. Return the USD estimate. The fixture ignores cache discounts and per-tool fees.
starter: |
  def token_cost(input_tokens, output_tokens, input_per_million, output_per_million):
      raise NotImplementedError
solution: |
  def token_cost(input_tokens, output_tokens, input_per_million, output_per_million):
      return (input_tokens * input_per_million + output_tokens * output_per_million) / 1_000_000
tests: |
  assert abs(token_cost(1000,100,2,8) - 0.0028) < 1e-12
  assert token_cost(0,1_000_000,2,8) == 8
  assert token_cost(1_000_000,0,2,8) == 2
  assert token_cost(0,0,2,8) == 0
hints:
  - Price input and output separately before converting from millions.
