id: f2-numpy-arrays-01
lesson: foundations/f2/numpy-arrays
title: Vectorise a conversion
prompt: |
  Write `fahrenheit(celsius)` that converts an array of temperatures in Celsius to Fahrenheit
  with $F = \frac{9}{5}C + 32$. It must return a NumPy array of the same shape, and it must
  **not** use a loop: write the formula once and let NumPy apply it to every element.

  For example `fahrenheit(np.array([0.0, 100.0]))` returns `array([ 32., 212.])`. The tests also
  pass a 2D array.
starter: |
  import numpy as np

  def fahrenheit(celsius):
      """Return the temperatures in celsius converted to Fahrenheit."""
      result = []
      # TODO: replace this with one vectorised line
      return result
solution: |
  import numpy as np

  def fahrenheit(celsius):
      """Return the temperatures in celsius converted to Fahrenheit."""
      return celsius * 9 / 5 + 32
tests: |
  import numpy as np
  _r = fahrenheit(np.array([0.0, 100.0]))
  assert isinstance(_r, np.ndarray), f"fahrenheit should return a NumPy array, got {type(_r).__name__}"
  np.testing.assert_allclose(_r, [32.0, 212.0], err_msg="0 C is 32 F and 100 C is 212 F")
  np.testing.assert_allclose(fahrenheit(np.array([-40.0, 37.0, 21.5])), [-40.0, 98.6, 70.7], err_msg="Check the formula F = 9/5 * C + 32")
  _m = np.array([[0.0, 10.0], [20.0, 30.0]])
  _r2 = fahrenheit(_m)
  assert isinstance(_r2, np.ndarray) and _r2.shape == (2, 2), "For a 2D input, return a 2D array of the same shape: a vectorised formula does this for free"
  np.testing.assert_allclose(_r2, [[32.0, 50.0], [68.0, 86.0]])
hints:
  - "Arithmetic on an array applies to every element, so `celsius * 9 / 5` already multiplies them all."
  - "The whole body can be `return celsius * 9 / 5 + 32`."
