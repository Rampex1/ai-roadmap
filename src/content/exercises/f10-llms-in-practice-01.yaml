id: f10-llms-in-practice-01
lesson: foundations/f10/llms-in-practice
title: Fitting a chat history into the context window
prompt: |
  A chat application stores its conversation as a list of token counts, one per message, oldest first.
  Message 0 is always the system prompt. Before each call it must choose what to send.

  1. `cost(input_tokens, output_tokens, price_in, price_out)` returns the cost in dollars, with both
     prices given **per million tokens**.
  2. `fit_history(counts, budget)` returns the **indices** of the messages to send, in increasing
     order:
     - always include message 0;
     - then add messages starting from the **newest** and working backwards, stopping at the first
       message that would push the total over `budget`, so the kept messages are always the most recent
       run with no gaps;
     - if message 0 alone is over `budget`, raise `ValueError`.

  Example: `fit_history([50, 400, 300, 200, 100], 400)` returns `[0, 3, 4]` (50 + 200 + 100 = 350;
  adding the 300 would make 650).
starter: |
  def cost(input_tokens, output_tokens, price_in, price_out):
      return input_tokens * price_in + output_tokens * price_out

  def fit_history(counts, budget):
      return list(range(len(counts)))
solution: |
  def cost(input_tokens, output_tokens, price_in, price_out):
      return (input_tokens * price_in + output_tokens * price_out) / 1_000_000

  def fit_history(counts, budget):
      if counts[0] > budget:
          raise ValueError("the system prompt alone does not fit")
      total = counts[0]
      kept = []
      for i in range(len(counts) - 1, 0, -1):
          if total + counts[i] > budget:
              break
          total += counts[i]
          kept.append(i)
      return [0] + kept[::-1]
tests: |
  import math
  assert math.isclose(cost(2000, 500, 3.0, 15.0), 0.0135, rel_tol=1e-9), "2,000 input and 500 output tokens at 3 and 15 per million should cost 0.0135: divide by one million"
  assert math.isclose(cost(1_000_000, 0, 0.5, 99.0), 0.5, rel_tol=1e-9), "one million input tokens at 0.5 per million cost 0.5"
  assert math.isclose(cost(0, 10, 3.0, 15.0), 0.00015, rel_tol=1e-9), "output tokens use price_out"
  assert list(fit_history([50, 400, 300, 200, 100], 400)) == [0, 3, 4], f"expected [0, 3, 4], got {fit_history([50, 400, 300, 200, 100], 400)}"
  assert list(fit_history([50, 400, 300, 200, 100], 10_000)) == [0, 1, 2, 3, 4], "when everything fits, send every message"
  assert list(fit_history([50, 10, 500, 20], 100)) == [0, 3], "stop at the first message that does not fit, even if older ones are small: no gaps"
  assert list(fit_history([100], 100)) == [0], "a total exactly equal to the budget fits"
  assert list(fit_history([90, 20, 30], 100)) == [0], "if even the newest message does not fit, send only the system prompt"
  assert list(fit_history([10, 30, 30, 30], 100)) == [0, 1, 2, 3], "10 + 30 + 30 + 30 = 100 fits exactly"
  try:
      fit_history([500, 10], 100)
  except ValueError:
      pass
  else:
      raise AssertionError("fit_history should raise ValueError when the system prompt alone is over budget")
hints:
  - "Prices are per million tokens, so divide by 1_000_000."
  - "Loop i from len(counts) - 1 down to 1 with range(len(counts) - 1, 0, -1) and break at the first message that does not fit."
  - "Collect the kept indices newest first, then reverse them and put 0 in front."
