id: f6-practical-optimisation-02
lesson: foundations/f6/practical-optimisation
title: Standardise with training statistics
prompt: |
  Write `standardise(X_train, X_test)` that returns `(Z_train, Z_test)`. Each column of both matrices is
  shifted and scaled with the **training** column mean and standard deviation:

  $$z_{ij} = \frac{x_{ij} - \mu_j}{\sigma_j}$$

  Use `X_train.mean(axis=0)` and `X_train.std(axis=0)` (NumPy's default `std`). Never compute
  statistics from `X_test`.

  Check: each column of `Z_train` has mean 0 and standard deviation 1. `Z_test` usually does not, and
  that is correct.
starter: |
  import numpy as np

  def standardise(X_train, X_test):
      Z_train = (X_train - X_train.mean(axis=0)) / X_train.std(axis=0)
      Z_test = (X_test - X_test.mean(axis=0)) / X_test.std(axis=0)
      return Z_train, Z_test
solution: |
  import numpy as np

  def standardise(X_train, X_test):
      mu = X_train.mean(axis=0)
      sigma = X_train.std(axis=0)
      return (X_train - mu) / sigma, (X_test - mu) / sigma
tests: |
  import numpy as np
  _rng = np.random.default_rng(0)
  _Xtr = _rng.normal(size=(100, 3)) * [1.0, 50.0, 0.01] + [5.0, -200.0, 1.0]
  _Xte = _rng.normal(size=(20, 3)) * [1.0, 50.0, 0.01] + [6.0, -150.0, 1.0]
  _r = standardise(_Xtr, _Xte)
  assert _r is not None and len(_r) == 2, "Return a pair: return Z_train, Z_test"
  _Ztr, _Zte = _r
  assert np.shape(_Ztr) == (100, 3) and np.shape(_Zte) == (20, 3), "Keep the shapes of X_train and X_test"
  np.testing.assert_allclose(np.mean(_Ztr, axis=0), 0, atol=1e-12, err_msg="Each column of Z_train should have mean 0")
  np.testing.assert_allclose(np.std(_Ztr, axis=0), 1, rtol=1e-12, err_msg="Each column of Z_train should have standard deviation 1")
  _mu, _sd = _Xtr.mean(axis=0), _Xtr.std(axis=0)
  np.testing.assert_allclose(_Zte, (_Xte - _mu) / _sd, rtol=1e-12, err_msg="Z_test must use the TRAINING mean and standard deviation")
  _a = np.array([[1.0, 10.0], [3.0, 30.0]]); _b = np.array([[2.0, 50.0]])
  _za, _zb = standardise(_a, _b)
  np.testing.assert_allclose(_za, [[-1, -1], [1, 1]], err_msg="For training rows [1, 10] and [3, 30] expected [[-1, -1], [1, 1]]")
  np.testing.assert_allclose(_zb, [[0, 3]], err_msg="The test row [2, 50] scaled with training statistics is [0, 3]")
hints:
  - "Compute mu = X_train.mean(axis=0) and sigma = X_train.std(axis=0) once."
  - "Apply (X - mu) / sigma to both matrices with those same two arrays."
