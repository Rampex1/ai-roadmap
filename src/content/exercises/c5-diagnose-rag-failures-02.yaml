id: c5-diagnose-rag-failures-02
lesson: llm/c5/diagnose-rag-failures
title: Score a retriever with recall@k and MRR
prompt: |
  Implement `retrieval_scores(runs, k)`. Each run is a pair `(relevant, ranked)`: a collection of relevant chunk IDs (never empty) and a ranked list of retrieved IDs, best first.

  Return a tuple `(mean_recall_at_k, mrr)`:

  - recall@k for one run is the number of distinct relevant IDs in `ranked[:k]` divided by the number of distinct relevant IDs;
  - the reciprocal rank for one run is `1 / rank` of the first relevant ID, with ranks starting at 1, or `0.0` if none is retrieved;
  - average each over all runs. Return `(0.0, 0.0)` for an empty list of runs.
starter: |
  def retrieval_scores(runs, k):
      return 0.0, 0.0
solution: |
  def retrieval_scores(runs, k):
      if not runs:
          return 0.0, 0.0
      recalls, rrs = [], []
      for relevant, ranked in runs:
          gold = set(relevant)
          recalls.append(len(gold.intersection(ranked[:k])) / len(gold))
          rr = 0.0
          for rank, chunk_id in enumerate(ranked, 1):
              if chunk_id in gold:
                  rr = 1 / rank
                  break
          rrs.append(rr)
      return sum(recalls) / len(runs), sum(rrs) / len(runs)
tests: |
  import math
  runs = [({"a"}, ["c", "a", "d", "b"]), ({"b", "e"}, ["b", "f", "g", "e"]), ({"h"}, ["x", "y", "h", "w"])]
  r, m = retrieval_scores(runs, 3)
  assert math.isclose(r, 2.5 / 3), f"Mean recall@3 should be 0.833 for the lesson example, got {r}"
  assert math.isclose(m, (0.5 + 1 + 1 / 3) / 3), f"MRR should be 0.611 for the lesson example, got {m}"
  r, m = retrieval_scores([({"a", "b"}, ["b", "z", "a"]), ({"q"}, ["x", "y"])], 2)
  assert math.isclose(r, 0.25), f"Count only the top k results for recall: expected 0.25, got {r}"
  assert math.isclose(m, 0.5), f"A run with no relevant result has reciprocal rank 0: expected MRR 0.5, got {m}"
  r, m = retrieval_scores([(["a", "a"], ["a", "a"])], 1)
  assert math.isclose(r, 1.0) and math.isclose(m, 1.0), "Count distinct relevant IDs"
  assert retrieval_scores([], 5) == (0.0, 0.0), "Return (0.0, 0.0) for no runs"
hints:
  - Slice ranked[:k] before intersecting with the relevant set.
  - Stop at the first relevant ID; enumerate(ranked, 1) gives ranks from 1.
