id: f7-preprocessing-and-pipelines-03
lesson: foundations/f7/preprocessing-and-pipelines
title: A leakage-free pipeline for a mixed table
prompt: |
  Write `make_model(numeric, categorical)` that returns an **unfitted** `Pipeline` for a pandas
  DataFrame with the given numeric and categorical column names:

  1. a `ColumnTransformer` that sends the numeric columns through `SimpleImputer(strategy="median")`
     then `StandardScaler()`, and the categorical columns through
     `SimpleImputer(strategy="most_frequent")` then `OneHotEncoder(handle_unknown="ignore")`;
  2. a `LogisticRegression()` at the end.

  Because every learned step is inside the pipeline, `fit` learns medians, means and categories from
  the training rows only. The tests fit it on a table with missing values and score it on rows that
  include a category never seen in training.
