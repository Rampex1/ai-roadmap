id: f4-derivative-rules-01
lesson: foundations/f4/derivative-rules
title: Differentiate a polynomial
prompt: |
  A polynomial can be stored as a list of coefficients, **lowest power first**:
  `[5, -2, 0, 0, 3]` means $5 - 2x + 0x^2 + 0x^3 + 3x^4$.

  Write `poly_derivative(coeffs)` that returns the coefficient list of the derivative, using the
  power, constant multiple and sum rules. For the example above the derivative is
  $-2 + 12x^3$, so the answer is `[-2, 0, 0, 12]`.

  The derivative of a constant (a list of length 1) is `[0]`.
starter: |
  def poly_derivative(coeffs):
      """Return the coefficients (lowest power first) of the derivative."""
      return coeffs
solution: |
  def poly_derivative(coeffs):
      """Return the coefficients (lowest power first) of the derivative."""
      if len(coeffs) <= 1:
          return [0]
      return [n * c for n, c in enumerate(coeffs)][1:]
tests: |
  def _chk(_c, _want):
      _r = poly_derivative(list(_c))
      assert _r is not None, "poly_derivative returned None: did you forget the return statement?"
      assert list(_r) == _want, f"poly_derivative({_c}) should be {_want}, got {list(_r)}"
  _chk([5, -2, 0, 0, 3], [-2, 0, 0, 12])
  _chk([1, 2, 3], [2, 6])
  _chk([0, 1], [1])
  _chk([7], [0])
  _chk([0, 0, 0, 1], [0, 0, 3])
hints:
  - "The coefficient at position n belongs to x to the power n. Its derivative is n times the coefficient, at position n - 1."
  - "enumerate(coeffs) gives (n, c) pairs. Build n * c for each, then drop the first entry."
  - "Handle a list of length 1 separately and return [0]."
