id: a3-fingerprint-dataset-lineage-01
lesson: mle/a3/fingerprint-dataset-lineage
title: Fingerprint a JSON manifest
prompt: Implement manifest_digest(manifest) for JSON data with string keys. Serialize with sorted keys, compact separators, unescaped Unicode, and disallow nonfinite numeric values. Return lowercase SHA-256 of UTF-8 bytes. Preserve list order.
starter: |
  def manifest_digest(manifest):
      raise NotImplementedError
solution: |
  def manifest_digest(manifest):
      import hashlib
      import json
      encoded = json.dumps(manifest, sort_keys=True, separators=(",", ":"), ensure_ascii=False, allow_nan=False)
      return hashlib.sha256(encoded.encode("utf-8")).hexdigest()
tests: |
  import hashlib
  assert manifest_digest({"b":2,"a":1}) == hashlib.sha256(b'{"a":1,"b":2}').hexdigest()
  assert manifest_digest({"schema":1,"split":"train"}) != manifest_digest({"schema":1,"split":"test"})
  assert manifest_digest({"ids":["a","b"]}) != manifest_digest({"ids":["b","a"]})
  assert manifest_digest({"city":"Québec"}) == hashlib.sha256('{"city":"Québec"}'.encode()).hexdigest()
  try:
      manifest_digest({"x":float("nan")})
  except ValueError:
      pass
  else:
      raise AssertionError("reject NaN")
hints:
  - Sort object keys, then hash the final UTF-8 bytes.
