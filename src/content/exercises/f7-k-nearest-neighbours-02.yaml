id: f7-k-nearest-neighbours-02
lesson: foundations/f7/k-nearest-neighbours
title: Choose k with cross-validation
prompt: |
  Write `best_k(X, y, ks)` that returns the `k` in `ks` with the highest mean 5-fold cross-validated
  accuracy for `make_pipeline(StandardScaler(), KNeighborsClassifier(n_neighbors=k))`. Use
  `cross_val_score(model, X, y, cv=5)`. If two values tie, return the first one in `ks`.

  Putting the scaler inside the pipeline means it is refitted on each training fold, so the
  validation fold never influences the scaling.
