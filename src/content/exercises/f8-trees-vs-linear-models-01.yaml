lesson: foundations/f8/trees-vs-linear-models
title: A fair comparison
prompt: |
  Write `compare(X, y)` that returns a dictionary with the **mean 5-fold cross-validated $R^2$** of two models:

  - `"linear"`: `Ridge(alpha=1.0)`
  - `"boosting"`: `HistGradientBoostingRegressor(max_iter=50, random_state=0)`

  Both must be scored on the **same folds**: `cv = KFold(n_splits=5, shuffle=True, random_state=0)`, passed to
  `cross_val_score` (whose default score for a regressor is $R^2$).

  Then write `winner(X, y)` that returns the key (`"linear"` or `"boosting"`) with the higher score.

  The starter builds two datasets like the lesson's: a linear signal with few rows, and an XOR pattern. Each should
  have a different winner.
