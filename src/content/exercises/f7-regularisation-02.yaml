id: f7-regularisation-02
lesson: foundations/f7/regularisation
title: Choose the penalty on validation data
prompt: |
  Write `choose_alpha(X_tr, y_tr, X_val, y_val, alphas)`. For each `alpha`, fit
  `make_pipeline(StandardScaler(), Ridge(alpha=alpha))` on the training data and compute the mean
  squared error on the validation data. Return the `alpha` with the lowest validation MSE.

  The two datasets below need very different amounts of penalty. Which gets the larger one, and why?
