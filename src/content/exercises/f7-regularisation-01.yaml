id: f7-regularisation-01
lesson: foundations/f7/regularisation
title: Ridge regression in closed form
prompt: |
  Write `ridge_fit(X, y, alpha)` that returns `(w, b)` minimising scikit-learn's ridge objective

  $$\lVert \mathbf{y} - X\mathbf{w} - b \rVert^2 + \alpha \lVert \mathbf{w} \rVert^2$$

  with the intercept $b$ **not** penalised. Centre first: subtract the column means from `X` and the
  mean from `y`, solve $(X_c^\top X_c + \alpha I)\,\mathbf{w} = X_c^\top \mathbf{y}_c$, then recover
  $b = \bar{y} - \bar{\mathbf{x}} \cdot \mathbf{w}$. The tests compare with `Ridge(alpha)`.
starter: |
  import numpy as np

  def ridge_fit(X, y, alpha):
      # TODO: centre, solve, recover the intercept
      return np.zeros(X.shape[1]), float(np.mean(y))

  rng = np.random.default_rng(0)
  X = rng.normal(size=(50, 3))
  y = X @ np.array([1.0, 2.0, -1.0]) + 5 + rng.normal(0, 0.5, 50)
  for alpha in [0.0, 10.0, 1000.0]:
      w, b = ridge_fit(X, y, alpha)
      print(alpha, np.round(w, 3), round(b, 3))
solution: |
  import numpy as np

  def ridge_fit(X, y, alpha):
      x_mean, y_mean = X.mean(axis=0), y.mean()
      Xc, yc = X - x_mean, y - y_mean
      d = X.shape[1]
      w = np.linalg.solve(Xc.T @ Xc + alpha * np.eye(d), Xc.T @ yc)
      b = y_mean - x_mean @ w
      return w, float(b)

  rng = np.random.default_rng(0)
  X = rng.normal(size=(50, 3))
  y = X @ np.array([1.0, 2.0, -1.0]) + 5 + rng.normal(0, 0.5, 50)
  for alpha in [0.0, 10.0, 1000.0]:
      w, b = ridge_fit(X, y, alpha)
      print(alpha, np.round(w, 3), round(b, 3))
tests: |
  import numpy as np
  from sklearn.linear_model import Ridge
  _rng = np.random.default_rng(21)
  for _n, _d in [(40, 2), (100, 5)]:
      _X = _rng.normal(size=(_n, _d)) + _rng.normal(size=_d) * 3
      _y = _X @ _rng.normal(size=_d) + 4 + _rng.normal(0, 1, _n)
      for _a in [0.1, 5.0, 300.0]:
          _w, _b = ridge_fit(_X, _y, _a)
          _sk = Ridge(alpha=_a).fit(_X, _y)
          np.testing.assert_allclose(_w, _sk.coef_, rtol=1e-6, atol=1e-9, err_msg=f"alpha={_a}: w should match Ridge(alpha).coef_")
          assert np.isclose(_b, _sk.intercept_, rtol=1e-6, atol=1e-9), f"alpha={_a}: b should be {_sk.intercept_:.5f}, got {_b}"
hints:
  - "Xc = X - X.mean(axis=0) and yc = y - y.mean()"
  - "w = np.linalg.solve(Xc.T @ Xc + alpha * np.eye(d), Xc.T @ yc)"
  - "b = y.mean() - X.mean(axis=0) @ w"
