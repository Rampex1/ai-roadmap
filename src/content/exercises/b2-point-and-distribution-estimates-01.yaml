id: b2-point-and-distribution-estimates-01
lesson: research/b2/point-and-distribution-estimates
title: Compare an interior mode with the mean
prompt: Implement beta_interior_summaries(a,b) for finite Beta parameters. Reject either shape at or below one. Return (interior mode, mean).
starter: |
  def beta_interior_summaries(a,b):
      raise NotImplementedError
solution: |
  def beta_interior_summaries(a,b):
      if not (a > 1 and b > 1):
          raise ValueError("require an interior Beta mode")
      return (a-1)/(a+b-2), a/(a+b)
tests: |
  import math
  def close(a,b): return len(a)==len(b) and all(math.isclose(x,y,rel_tol=1e-9,abs_tol=1e-12) for x,y in zip(a,b))
  assert close(beta_interior_summaries(2,2),(0.5,0.5))
  assert close(beta_interior_summaries(2,5),(0.2,2/7))
  assert close(beta_interior_summaries(5.5,2.5),(0.75,5.5/8))
  for shapes in ((1,1), (1,3), (4,0.5)):
      try:
          beta_interior_summaries(*shapes)
      except ValueError:
          pass
      else:
          raise AssertionError("both Beta shapes must exceed one")
hints:
  - Solve the derivative of the log density before substituting parameters.
