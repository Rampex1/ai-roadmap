id: f3-dot-product-03
lesson: foundations/f3/dot-product
title: A tiny semantic search
prompt: |
  `E` is a 2-D array whose rows are embeddings (one per document) and `query` is one embedding of the
  same length. Write `top_k(query, E, k)` that returns the row indices of the `k` rows with the
  **highest cosine similarity** to `query`, most similar first, as a list of ints.

  Loop over the rows, compute each similarity (write the formula inline or define your own helper),
  then sort. `np.argsort` sorts ascending; `np.argsort(-scores)` gives descending order.
starter: |
  import numpy as np

  def top_k(query, E, k):
      scores = []
      # TODO: one cosine similarity per row of E
      return []
solution: |
  import numpy as np

  def top_k(query, E, k):
      scores = []
      for row in E:
          scores.append((query @ row) / (np.linalg.norm(query) * np.linalg.norm(row)))
      order = np.argsort(-np.array(scores))
      return [int(i) for i in order[:k]]
tests: |
  import numpy as np
  _E = np.array([[0.9, 0.8, 0.1, 0.0],    # cat
                 [0.1, 0.0, 0.9, 0.8],    # car
                 [0.8, 0.9, 0.2, 0.1],    # kitten
                 [0.0, 0.1, 0.8, 0.9]])   # truck
  _q = np.array([1.0, 1.0, 0.0, 0.0])
  assert list(top_k(_q, _E, 2)) == [0, 2], f"For an animal-like query expected [0, 2] (cat, then kitten), got {top_k(_q, _E, 2)}"
  assert list(top_k(np.array([0.0, 0.0, 1.0, 1.0]), _E, 1)) in ([1], [3]), "For a vehicle-like query the top row should be car or truck"
  _E2 = np.array([[1.0, 0.0], [100.0, 1.0], [0.0, 1.0], [-1.0, 0.0]])
  _got = list(top_k(np.array([1.0, 0.0]), _E2, 4))
  assert _got == [0, 1, 2, 3], f"Cosine similarity ignores length: expected [0, 1, 2, 3], got {_got}"
  _rng = np.random.default_rng(4)
  _R, _qq = _rng.normal(size=(30, 6)), _rng.normal(size=6)
  _s = _R @ _qq / (np.linalg.norm(_R, axis=1) * np.linalg.norm(_qq))
  assert list(top_k(_qq, _R, 5)) == [int(i) for i in np.argsort(-_s)[:5]], "Wrong top 5 for 30 random 6-D embeddings"
hints:
  - "Build a list scores with one cosine similarity per row, in row order."
  - "np.argsort(-np.array(scores)) lists row indices from most to least similar; take the first k."
