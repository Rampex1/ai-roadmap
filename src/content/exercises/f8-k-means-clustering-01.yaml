id: f8-k-means-clustering-01
lesson: foundations/f8/k-means-clustering
title: k-means from scratch
prompt: |
  Write `kmeans(X, init, n_iter=100)` that runs Lloyd's algorithm starting from the given centroids `init` (a
  `(k, d)` array) and returns a tuple `(labels, centroids, inertia)`:

  1. **Assign**: `labels[i]` is the index of the centroid nearest to `X[i]` (squared Euclidean distance).
  2. **Update**: each centroid becomes the mean of its points. If a cluster has no points, keep its old centroid.
  3. Stop when the centroids no longer move (`np.allclose`) or after `n_iter` iterations.
  4. Return the final labels (assigned to the final centroids), the centroids, and the **inertia**: the sum of
     squared distances from each point to its assigned centroid.

  The tests start scikit-learn's `KMeans(n_clusters=k, init=init, n_init=1)` from the same centroids and compare
  your inertia with its `inertia_`.
starter: |
  import numpy as np
  from sklearn.datasets import make_blobs

  def kmeans(X, init, n_iter=100):
      centroids = np.array(init, dtype=float)
      labels = np.zeros(len(X), dtype=int)
      # TODO: alternate assign and update steps
      inertia = 0.0
      return labels, centroids, inertia

  X, _ = make_blobs(n_samples=300, centers=4, random_state=7)
  labels, centroids, inertia = kmeans(X, X[:4])
  print(round(inertia, 1))
solution: |
  import numpy as np
  from sklearn.datasets import make_blobs

  def kmeans(X, init, n_iter=100):
      centroids = np.array(init, dtype=float)
      for _ in range(n_iter):
          d = ((X[:, None, :] - centroids[None, :, :]) ** 2).sum(axis=2)
          labels = d.argmin(axis=1)
          new = np.array([X[labels == j].mean(axis=0) if np.any(labels == j) else centroids[j]
                          for j in range(len(centroids))])
          moved = not np.allclose(new, centroids)
          centroids = new
          if not moved:
              break
      d = ((X[:, None, :] - centroids[None, :, :]) ** 2).sum(axis=2)
      labels = d.argmin(axis=1)
      inertia = float(d[np.arange(len(X)), labels].sum())
      return labels, centroids, inertia

  X, _ = make_blobs(n_samples=300, centers=4, random_state=7)
  labels, centroids, inertia = kmeans(X, X[:4])
  print(round(inertia, 1))
tests: |
  import warnings
  import numpy as np
  from sklearn.cluster import KMeans
  from sklearn.datasets import make_blobs
  warnings.simplefilter("ignore")
  for _seed, _k, _d in [(7, 4, 2), (1, 3, 2), (3, 5, 4), (0, 2, 3)]:
      _X, _ = make_blobs(n_samples=250, centers=_k, n_features=_d, random_state=_seed)
      _init = _X[np.random.default_rng(_seed).choice(len(_X), _k, replace=False)]
      _labels, _cent, _inertia = kmeans(_X, _init.copy())
      _sk = KMeans(n_clusters=_k, init=_init, n_init=1, max_iter=300, tol=1e-8).fit(_X)
      assert np.isclose(_inertia, _sk.inertia_, rtol=1e-3), f"k={_k}, {_d} features: inertia should be {_sk.inertia_:.2f} like scikit-learn's, got {_inertia}"
      _labels = np.asarray(_labels)
      _c = np.asarray(_cent)
      _check = ((_X - _c[_labels]) ** 2).sum()
      assert np.isclose(_inertia, _check, rtol=1e-9), "The inertia must be the sum of squared distances from each point to the centroid of its label"
      _dist = ((_X[:, None, :] - _c[None, :, :]) ** 2).sum(axis=2)
      assert np.array_equal(_labels, _dist.argmin(axis=1)), "Each label must be the index of the nearest final centroid"
  _X = np.array([[0.0, 0.0], [0.0, 1.0], [10.0, 0.0], [10.0, 1.0]])
  _l, _c, _i = kmeans(_X, np.array([[0.0, 0.5], [10.0, 0.5], [100.0, 100.0]]))
  assert np.allclose(np.asarray(_c)[2], [100.0, 100.0]), "A centroid with no points should stay where it was"
  assert np.isclose(_i, 1.0), f"Inertia of the empty-cluster example should be 1.0, got {_i}"
hints:
  - "d = ((X[:, None, :] - centroids[None, :, :]) ** 2).sum(axis=2) gives an (n, k) array of squared distances."
  - "labels = d.argmin(axis=1); the new centroid j is X[labels == j].mean(axis=0) when that cluster is not empty."
  - "After the loop, recompute the labels and distances for the final centroids before summing the inertia."
