id: c11-trace-latency-and-usage-01
lesson: llm/c11/trace-latency-and-usage
title: Project safe trace fields
prompt: Implement trace_metadata(event). Input fields have already been type-validated. Keep only trace_id, operation, status, duration_ms, input_tokens and output_tokens. Do not invent missing fields. Preserve zero-valued counts.
starter: |
  def trace_metadata(event):
      raise NotImplementedError
solution: |
  def trace_metadata(event):
      fields = ("trace_id", "operation", "status", "duration_ms", "input_tokens", "output_tokens")
      return {field: event[field] for field in fields if field in event}
tests: |
  assert trace_metadata({"trace_id":"a","prompt":"fixture","duration_ms":0,"unknown":3}) == {"trace_id":"a","duration_ms":0}
  assert trace_metadata({"output_tokens":0,"input_tokens":5,"status":"error","completion":"fixture"}) == {"status":"error","input_tokens":5,"output_tokens":0}
  assert trace_metadata({}) == {}
hints:
  - Check key membership rather than value truthiness.
