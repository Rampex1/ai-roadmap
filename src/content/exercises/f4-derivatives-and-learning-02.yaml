id: f4-derivatives-and-learning-02
lesson: foundations/f4/derivatives-and-learning
title: Gradient descent on a line fit
prompt: |
  Write `train(x, y, lr, steps)` that starts from `w = 0.0`, `b = 0.0` and takes `steps` gradient
  descent steps on the mean squared error loss, then returns `(w, b)`.

  In each step, compute the residuals `r = w * x + b - y` **once**, compute both partial derivatives
  from those same residuals, and only then update both parameters:
  `w = w - lr * dw` and `b = b - lr * db`.

  On the lesson data (`x = [0, 1, 2, 3]`, `y = [1, 3, 5, 7]`) with `lr = 0.05` and 200 steps you should
  end very close to `w = 2`, `b = 1`.
starter: |
  import numpy as np

  def train(x, y, lr, steps):
      w, b = 0.0, 0.0
      return w, b
solution: |
  import numpy as np

  def train(x, y, lr, steps):
      w, b = 0.0, 0.0
      for _ in range(steps):
          r = w * x + b - y
          dw = np.mean(2 * r * x)
          db = np.mean(2 * r)
          w = w - lr * dw
          b = b - lr * db
      return w, b
tests: |
  import numpy as np
  _x = np.array([0.0, 1.0, 2.0, 3.0]); _y = np.array([1.0, 3.0, 5.0, 7.0])
  _r = train(_x, _y, 0.05, 200)
  assert _r is not None and len(_r) == 2, "Return a pair: return w, b"
  assert abs(_r[0] - 2) < 1e-2 and abs(_r[1] - 1) < 1e-2, f"After 200 steps expected about (2, 1), got {_r}"
  def _ref(x, y, lr, steps):
      w, b = 0.0, 0.0
      for _ in range(steps):
          r = w * x + b - y
          w, b = w - lr * np.mean(2 * r * x), b - lr * np.mean(2 * r)
      return w, b
  _rng = np.random.default_rng(7)
  _x2 = _rng.uniform(-1, 1, 30); _y2 = -1.5 * _x2 + 0.5 + 0.1 * _rng.normal(size=30)
  for _lr, _steps in [(0.1, 1), (0.1, 3), (0.3, 50)]:
      np.testing.assert_allclose(train(_x2, _y2, _lr, _steps), _ref(_x2, _y2, _lr, _steps), rtol=1e-9, atol=1e-12,
          err_msg=f"With lr={_lr} and steps={_steps} your (w, b) differ from plain gradient descent: compute both partials from the same residuals, then update")
  np.testing.assert_allclose(train(_x2, _y2, 0.1, 0), (0.0, 0.0), err_msg="With 0 steps the parameters should stay at (0, 0)")
hints:
  - "Inside a for loop over range(steps): residuals, then dw and db, then update w and b."
  - "Compute dw and db before changing w, so both use the same residuals."
