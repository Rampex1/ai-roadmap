id: f2-reshape-and-random-01
lesson: foundations/f2/reshape-and-random
title: Train/test split
prompt: |
  Write `split(X, y, test_frac, seed)` that shuffles the rows and returns
  `X_train, X_test, y_train, y_test`:

  - the test set has `int(len(X) * test_frac)` rows, the training set the rest;
  - every row appears in exactly one of the two sets;
  - each row of `X` stays paired with its label in `y`;
  - the same `seed` always gives the same split.

  Make a generator with `np.random.default_rng(seed)`, take one `permutation` of the row positions,
  and index both `X` and `y` with it.
starter: |
  import numpy as np

  def split(X, y, test_frac, seed):
      """Return X_train, X_test, y_train, y_test after a seeded shuffle."""
      n_test = int(len(X) * test_frac)
      # TODO: shuffle the row positions with a seeded generator
      return X[n_test:], X[:n_test], y[n_test:], y[:n_test]
solution: |
  import numpy as np

  def split(X, y, test_frac, seed):
      """Return X_train, X_test, y_train, y_test after a seeded shuffle."""
      n_test = int(len(X) * test_frac)
      rng = np.random.default_rng(seed)
      idx = rng.permutation(len(X))
      test_idx, train_idx = idx[:n_test], idx[n_test:]
      return X[train_idx], X[test_idx], y[train_idx], y[test_idx]
tests: |
  import numpy as np
  _X = np.arange(40).reshape(20, 2)
  _y = np.arange(20) * 10
  _Xtr, _Xte, _ytr, _yte = split(_X, _y, 0.25, seed=0)
  assert _Xte.shape == (5, 2) and _Xtr.shape == (15, 2), f"With 20 rows and test_frac 0.25 expect 5 test rows and 15 training rows; got {_Xte.shape} and {_Xtr.shape}"
  assert _yte.shape == (5,) and _ytr.shape == (15,), "y_train and y_test should have 15 and 5 labels"
  assert sorted(np.concatenate([_Xtr[:, 0], _Xte[:, 0]]).tolist()) == list(range(0, 40, 2)), "Every row must appear exactly once across the two sets"
  np.testing.assert_array_equal(_Xte[:, 0] * 5, _yte, err_msg="Rows of X and labels in y got separated: index both with the same positions")
  np.testing.assert_array_equal(_Xtr[:, 0] * 5, _ytr, err_msg="Rows of X and labels in y got separated in the training set")
  assert not np.array_equal(_Xte, _X[:5]) and not np.array_equal(_Xte, _X[-5:]), "The test set is just the first or last rows: shuffle the positions with rng.permutation first"
  _again = split(_X, _y, 0.25, seed=0)
  assert all(np.array_equal(_a, _b) for _a, _b in zip(_again, (_Xtr, _Xte, _ytr, _yte))), "The same seed must give the same split: create the generator inside split with default_rng(seed)"
  _others = [split(_X, _y, 0.25, seed=_s)[1] for _s in range(1, 6)]
  assert any(not np.array_equal(_o, _Xte) for _o in _others), "Different seeds should usually give different splits"
  _a = split(np.arange(10).reshape(10, 1), np.arange(10), 0.3, seed=3)
  assert len(_a[1]) == 3 and len(_a[0]) == 7, "With 10 rows and test_frac 0.3 expect 3 test rows"
hints:
  - "`rng = np.random.default_rng(seed)` then `idx = rng.permutation(len(X))`."
  - "Take `idx[:n_test]` as the test positions and `idx[n_test:]` as the training positions."
  - "Index both arrays with the same positions: `X[test_idx]` and `y[test_idx]`."
