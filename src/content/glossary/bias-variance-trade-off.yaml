term: "Bias–variance trade-off"
short: "Expected test error splits into bias² (systematic error), variance (sensitivity to the training set) and noise; more flexibility lowers one and raises the other."
body: |
  For squared error, $\mathbb{E}[(y - \hat{f}(x))^2] = \text{bias}^2 + \text{variance} + \sigma^2$, where the
  expectation is over training sets and noise. Simple models have high bias and low variance (they
  underfit); very flexible models have low bias and high variance (they overfit). The best test error
  sits in between, which is why validation error plotted against model complexity is U-shaped.
related: ["overfitting", "underfitting", "regularisation", "variance"]
