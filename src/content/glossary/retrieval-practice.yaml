term: Retrieval practice
short: Learning by pulling information out of memory (answering a question) rather than putting it back in (rereading).
body: |
  Each successful recall makes a memory stronger and longer lasting, an effect called the testing effect.
  Rereading feels productive because the text looks familiar, but familiarity is not the same as being able to recall it.
  Every quiz on this site is retrieval practice, which is why it asks you to answer from memory before checking.
related: [spaced-repetition, interleaving]
