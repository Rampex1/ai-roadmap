term: Interleaving
short: Mixing different topics or problem types in one practice session instead of doing them in blocks.
body: |
  Blocked practice (ten questions on topic A, then ten on B) feels easier, but interleaved practice (A, C, B, A…) forces you to
  work out *which* idea a question needs, and research finds it usually leads to better long-term learning.
  Review sessions and mastery checks on this site are interleaved; lesson quizzes are not.
related: [retrieval-practice, spaced-repetition]
