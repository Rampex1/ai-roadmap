id: c12-media-evidence
module: c12
kind: homework
title: Evaluate a multimodal library evidence fixture
brief: |-
  Use synthetic image vectors, transcript segments and outcome labels. No media service or download is needed.

  1. Route requests to representations that retain the needed evidence.
  2. Rank image results using a compatible text query vector.
  3. Find the source transcript segment for a citation.
  4. Summarise supported, unsupported and abstained outcomes across conditions.
  5. Evaluate timestamped evidence on paired conditions. A missing observation counts as "abstained" only when no answer was expected; when an answer was expected it counts as "missed".

  Describe one task where OCR should suffice and one that requires the source image. Specify paired clean/degraded cases and a criterion for abstention that an evaluator could apply.
notebook: /homework/c12-media-evidence.ipynb
rubric:
  - Representation follows evidence needs.
  - Search ranking is deterministic.
  - Transcript lookup implements the stated endpoints.
  - The report retains per-condition outcomes.
  - The integrated task passes its fixture checks.
compute: Local Jupyter or Colab CPU. Python standard library only. Allow 60 to 90 minutes.
