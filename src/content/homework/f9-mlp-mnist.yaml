id: f9-mlp-mnist
module: f9
kind: homework
title: "An MLP from scratch, then MNIST in PyTorch"
brief: |
  Build a multilayer perceptron twice: first in pure NumPy, with your own backpropagation and a gradient
  check, then in PyTorch, where you scale it up to the MNIST digits. Download the notebook and open it in
  [Google Colab](https://colab.research.google.com/) (File > Upload notebook), where PyTorch and
  torchvision are preinstalled. A GPU is optional. Part A also runs in local Jupyter.

  Each task has `TODO` cells and a check cell that prints `OK` when your code is right:

  1. **A1, forward and backward:** `init_params` (He initialisation), `forward` and `loss_and_grads` for
     an MLP with ReLU hidden layers and a stable softmax cross-entropy, for any list of layer sizes.
  2. **A2, gradient check:** a `grad_check` function that compares random gradient entries with central
     differences. It must pass on your network and catch a deliberately broken one.
  3. **A3, train in NumPy:** mini-batch SGD on scikit-learn's 8×8 digits, a loss curve, and at least 95%
     test accuracy.
  4. **B1, the same network in PyTorch:** an `nn.Module` built from a list of sizes, a `DataLoader` and the
     four-line training loop, again at least 95% on the digits.
  5. **B2, MNIST:** download MNIST with torchvision and train a 784 → 256 → 128 → 10 MLP with Adam for 5
     epochs with fixed seeds, reaching **at least 97% test accuracy**.
  6. **B3, explain:** compare the loss on the first batch, before any update, with $\ln 10$, measure the train/test gap, and look at the
     digits the model gets wrong.

  Stretch tasks try a model without ReLUs, dropout with weight decay, and dropout in your NumPy network.
notebook: /homework/f9-mlp-mnist.ipynb
rubric:
  - "Every check cell for A1, A2, A3, B1 and B2 prints OK after restarting and running all cells"
  - "The gradient check reports a worst relative error below 1e-4 on the NumPy network and catches the broken backward pass"
  - "The NumPy loss curve is plotted with labelled axes and the NumPy model reaches at least 95% test accuracy on the 8×8 digits"
  - "The MNIST MLP reaches at least 97% test accuracy with torch.manual_seed(0) and a seeded DataLoader"
  - "The three B3 answers use your own numbers and images, including the train/test accuracy gap"
compute: "Free Colab: about 10 minutes on the CPU runtime or about 3 minutes on a T4 GPU, including the ~12 MB MNIST download (the solution's training took under a minute on a laptop CPU)"
