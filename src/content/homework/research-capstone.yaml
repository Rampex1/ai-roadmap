id: research-capstone
module: b14
kind: capstone
title: "Research capstone: reproduce a DDPM and its reverse-variance ablation"
brief: |
  Reproduce Ho, Jain and Abbeel's [Denoising Diffusion Probabilistic Models](https://arxiv.org/abs/2006.11239)
  at small scale and test one of its claims with ablations. The paper trains an epsilon-prediction
  network with a simplified loss (Algorithm 1), samples by ancestral steps (Algorithm 2) and reports in
  Section 3.2 that the reverse variances $\sigma_t^2=\beta_t$ and
  $\sigma_t^2=\tilde\beta_t=\frac{1-\bar\alpha_{t-1}}{1-\bar\alpha_t}\beta_t$ gave similar results. You
  check that claim on matched weights, on a two-dimensional mixture on CPU and on MNIST on a Colab GPU.
  The paper's CIFAR-10 FID and Inception scores are outside this study's scope.

  Download the starter notebook. Part A runs in local Jupyter or Colab on CPU. Part B needs a GPU:
  upload the notebook to [Google Colab](https://colab.research.google.com/) and choose a T4 runtime.

  ## Milestones

  1. **Implement and verify (Part A, CPU).** The forward marginal, both reverse variances and the reverse
     step pass the analytic fixtures.
  2. **Freeze the protocol.** Record the schedule, data, seeds, evaluation draws, compute budget, the
     primary comparison and the smallest differences you would call meaningful, before seeing results.
  3. **Run the matched ablations (Part A).** Time-conditioned versus time-blind training with the same
     initialization, data and optimizer steps; then $\beta_t$ versus $\tilde\beta_t$ sampling on the same
     trained weights with the same noise draws, for every training seed.
  4. **Reproduce on MNIST (Part B, Colab GPU).** Implement the training loss, train the provided small
     U-Net with $T=1000$ and the paper's linear schedule, show sample grids, and repeat the variance
     ablation on the trained weights. Report a Fréchet distance in the features of a small MNIST
     classifier trained in the notebook (an FID proxy), the real-versus-real noise floor and class
     entropy, for each sampling seed.
  5. **Write the paper.** Submit the completed notebook with the paper in its final Markdown section.

  ## Deliverables

  - The executed notebook, including the printed protocols, per-seed tables and the sample grid.
  - A paper-format write-up: abstract, method (with the equations and algorithms you reproduced),
    experimental setup, a results table with seeds and bootstrap intervals, the ablations, limitations
    and ethics, and a reproduction appendix.
notebook: /homework/research-capstone.ipynb
rubric:
  - "The forward marginal, both reverse variances, the reverse step and the training loss pass the notebook's fixtures."
  - "The time-conditioning ablation matches model shape, initialization, data draws, optimizer steps and held-out draws between variants."
  - "σ² ablation reported on matched weights: β_t and β̃_t sampling reuse the same trained weights and the same noise draws in both parts."
  - "MNIST DDPM trained on Colab with sample grid and FID-proxy reported, alongside the real-versus-real noise floor and class entropy."
  - "The results table lists every seed with paired effects and bootstrap intervals, and states that training-seed variation on MNIST is not measured."
  - "The write-up follows paper format (abstract, method, setup, results, ablation, limitations) and states whether the results agree with the paper's Section 3.2 claim."
  - "The report separates what was reproduced from the paper's CIFAR-10 results and explains why the FID proxy is not comparable with published FID."
  - "The protocols, versions, hardware, runtimes and any failed runs are recorded well enough to repeat the study."
compute: "CPU core ~1 min (Part A, NumPy). Colab T4 milestone ~45 min (Part B, PyTorch; estimated, not measured; free-tier GPUs and quotas change). Allow several more hours for implementation and the write-up."
