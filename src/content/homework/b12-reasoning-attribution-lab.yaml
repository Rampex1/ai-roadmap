title: Audit reasoning and attribution with controlled tests
brief: |-
  Compare voting with arithmetic verification, then check path attributions and feature interventions on explicit scalar functions.

  1. Count votes and abstentions.
  2. Verify known answer values.
  3. Integrate model gradients along a baseline path.
  4. Measure one signed intervention effect.
  5. Compare path attribution with matched single-feature controls.

  Give one case where a majority is wrong and one where an attribution is complete but not an external causal explanation. Describe a suitable control.
