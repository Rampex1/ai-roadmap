<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Natural frequency tree for a medical test. 10,000 people split into 100 with the disease and 9,900 without. Of the 100, 90 test positive and 10 negative. Of the 9,900, 891 test positive and 9,009 negative. In total 981 test positive, of whom only 90, about 9 percent, have the disease</title>
  <rect x="250" y="14" width="180" height="46" rx="10" fill="#0f766e"/>
  <text x="340" y="43" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">10,000 people</text>
  <line x1="300" y1="60" x2="170" y2="110" stroke="#64748b" stroke-width="2.5"/>
  <line x1="380" y1="60" x2="510" y2="110" stroke="#64748b" stroke-width="2.5"/>
  <text x="208" y="86" font-size="14" fill="#64748b" text-anchor="end">1% have it</text>
  <text x="472" y="86" font-size="14" fill="#64748b">99% do not</text>
  <rect x="80" y="110" width="180" height="46" rx="10" fill="#4f46e5"/>
  <text x="170" y="139" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">100 with disease</text>
  <rect x="420" y="110" width="180" height="46" rx="10" fill="#4f46e5"/>
  <text x="510" y="139" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">9,900 without</text>
  <line x1="130" y1="156" x2="85" y2="206" stroke="#64748b" stroke-width="2.5"/>
  <line x1="210" y1="156" x2="255" y2="206" stroke="#64748b" stroke-width="2.5"/>
  <line x1="470" y1="156" x2="425" y2="206" stroke="#64748b" stroke-width="2.5"/>
  <line x1="550" y1="156" x2="595" y2="206" stroke="#64748b" stroke-width="2.5"/>
  <text x="98" y="182" font-size="13" fill="#64748b" text-anchor="end">90%</text>
  <text x="243" y="182" font-size="13" fill="#64748b">10%</text>
  <text x="438" y="182" font-size="13" fill="#64748b" text-anchor="end">9%</text>
  <text x="583" y="182" font-size="13" fill="#64748b">91%</text>
  <rect x="20" y="206" width="130" height="46" rx="10" fill="#d97706"/>
  <text x="85" y="235" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">90 positive</text>
  <rect x="190" y="206" width="130" height="46" rx="10" fill="#475569"/>
  <text x="255" y="235" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">10 negative</text>
  <rect x="360" y="206" width="130" height="46" rx="10" fill="#d97706"/>
  <text x="425" y="235" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">891 positive</text>
  <rect x="530" y="206" width="130" height="46" rx="10" fill="#475569"/>
  <text x="595" y="235" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">9,009 negative</text>
  <text x="340" y="292" font-size="16" font-weight="700" fill="#d97706" text-anchor="middle">P(disease | positive) = 90 / (90 + 891) = 90 / 981 ≈ 9%</text>
</svg>
