<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="680" height="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Computation graph for y = e to the sin of x squared. The forward pass flows left to right computing a, b and y. The backward pass flows right to left multiplying the local derivatives e to the b, cos a and 2x to get dy/dx</title>
  <defs><marker id="f4cg-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#4f46e5"/></marker>
  <marker id="f4cg-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#d97706"/></marker></defs>
  <rect x="40" y="90" width="110" height="48" rx="10" fill="#0f766e"/>
  <text x="95.0" y="120" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">x</text>
  <rect x="200" y="90" width="110" height="48" rx="10" fill="#0f766e"/>
  <text x="255.0" y="120" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">a = x²</text>
  <rect x="370" y="90" width="110" height="48" rx="10" fill="#0f766e"/>
  <text x="425.0" y="120" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">b = sin a</text>
  <rect x="540" y="90" width="110" height="48" rx="10" fill="#0f766e"/>
  <text x="595.0" y="120" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">y = eᵇ</text>
  <line x1="154" y1="104" x2="196" y2="104" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#f4cg-f)"/>
  <path d="M196 126 L156 126" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#f4cg-b)"/>
  <text x="175.0" y="160" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">× 2x</text>
  <line x1="314" y1="104" x2="366" y2="104" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#f4cg-f)"/>
  <path d="M366 126 L316 126" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#f4cg-b)"/>
  <text x="340.0" y="160" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">× cos a</text>
  <line x1="484" y1="104" x2="536" y2="104" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#f4cg-f)"/>
  <path d="M536 126 L486 126" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#f4cg-b)"/>
  <text x="510.0" y="160" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">× eᵇ</text>
  <text x="20" y="44" font-size="15" fill="#4f46e5" font-weight="700">forward pass: compute values left to right →</text>
  <text x="20" y="205" font-size="15" fill="#d97706" font-weight="700">← backward pass: multiply local derivatives right to left, dy/dx = eᵇ · cos a · 2x</text>
</svg>
