<circle cx="340" cy="60" r="4"/><circle cx="440" cy="120" r="4"/><circle cx="480" cy="55" r="4"/><circle cx="380" cy="140" r="4"/><circle cx="500" cy="135" r="4"/>
<circle cx="80" cy="220" r="4"/><circle cx="180" cy="290" r="4"/><circle cx="220" cy="230" r="4"/><circle cx="100" cy="295" r="4"/>
<circle cx="350" cy="250" r="4"/><circle cx="440" cy="215" r="4"/><circle cx="490" cy="285" r="4"/><circle cx="400" cy="295" r="4"/>
</g>
<circle cx="262" cy="184" r="5" fill="none" stroke="#c2410c" stroke-width="2.5"/>
<g stroke="#0f766e" stroke-width="3">
<path d="M144 82 l12 12 M156 82 l-12 12"/><path d="M414 82 l12 12 M426 82 l-12 12"/>
<path d="M144 262 l12 12 M156 262 l-12 12"/><path d="M414 262 l12 12 M426 262 l-12 12"/>
</g>
<path transform="translate(5 -13)" d="M270 148 l4 9 l10 1 l-7 7 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -7 l10 -1z" fill="#c2410c"/>
