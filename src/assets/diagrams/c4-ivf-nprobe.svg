<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>An IVF index splits the vectors into cells, one per centroid. With nprobe = 2 the search scans only the two cells whose centroids are nearest the query. The query's true nearest neighbour sits just across a boundary in a third cell, so this search misses it.</title>
