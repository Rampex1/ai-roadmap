<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A depth-2 decision tree for churn. The root asks whether contract is at most 10.5 months. If no, a leaf predicts stay (5 stay, 0 churn). If yes, a second node asks whether the monthly charge is at most 87.5. If yes, a leaf predicts churn (0 stay, 4 churn); if no, a leaf predicts stay (1 stay, 0 churn)</title>
<g stroke="#8b93b8" stroke-width="1.8" fill="none">
<line x1="340" y1="62" x2="200" y2="122"/>
<line x1="340" y1="62" x2="500" y2="122"/>
<line x1="200" y1="168" x2="110" y2="228"/>
<line x1="200" y1="168" x2="310" y2="228"/>
</g>
<text x="250" y="88" font-size="14" fill="#64748b" text-anchor="end">yes</text>
<text x="432" y="88" font-size="14" fill="#64748b">no</text>
<text x="140" y="196" font-size="14" fill="#64748b" text-anchor="end">yes</text>
<text x="262" y="196" font-size="14" fill="#64748b">no</text>
<rect x="230" y="16" width="220" height="46" rx="10" fill="#4f46e5"/>
<text x="340" y="38" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">contract ≤ 10.5?</text>
<text x="340" y="55" font-size="12" fill="#e0e7ff" text-anchor="middle">10 customers: 6 stay, 4 churn</text>
<rect x="90" y="122" width="220" height="46" rx="10" fill="#4f46e5"/>
<text x="200" y="144" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">charge ≤ 87.5?</text>
<text x="200" y="161" font-size="12" fill="#e0e7ff" text-anchor="middle">5 customers: 1 stay, 4 churn</text>
<rect x="410" y="122" width="180" height="46" rx="10" fill="#0f766e"/>
<text x="500" y="144" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">predict: stay</text>
<text x="500" y="161" font-size="12" fill="#ccfbf1" text-anchor="middle">5 stay, 0 churn</text>
<rect x="20" y="228" width="180" height="46" rx="10" fill="#d97706"/>
<text x="110" y="250" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">predict: churn</text>
<text x="110" y="267" font-size="12" fill="#fef3c7" text-anchor="middle">0 stay, 4 churn</text>
<rect x="220" y="228" width="180" height="46" rx="10" fill="#0f766e"/>
<text x="310" y="250" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">predict: stay</text>
<text x="310" y="267" font-size="12" fill="#ccfbf1" text-anchor="middle">1 stay, 0 churn</text>
</svg>
