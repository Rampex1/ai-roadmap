<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Five-fold cross-validation. The test set is split off first and set aside. The remaining training data is cut into five equal folds. In round 1, fold 1 is the validation fold and folds 2 to 5 are used for fitting; in round 2, fold 2 is held out; and so on until every fold has been the validation fold exactly once. The five validation scores are averaged</title>
<g font-size="13" fill="#8b93b8">
<text x="154" y="28" text-anchor="middle">fold 1</text>
<text x="242" y="28" text-anchor="middle">fold 2</text>
<text x="330" y="28" text-anchor="middle">fold 3</text>
<text x="418" y="28" text-anchor="middle">fold 4</text>
<text x="506" y="28" text-anchor="middle">fold 5</text>
<text x="620" y="28" text-anchor="middle">test set</text></g>
<text x="98" y="62" font-size="13" fill="#8b93b8" text-anchor="end">round 1</text>
<rect x="112" y="42" width="84" height="30" rx="4" fill="#d97706" fill-opacity="1"/>
<text x="154" y="62" font-size="12" fill="#ffffff" text-anchor="middle">validate</text>
<rect x="200" y="42" width="84" height="30" rx="4" fill="#4f46e5" fill-opacity="0.35"/>
<rect x="288" y="42" width="84" height="30" rx="4" fill="#4f46e5" fill-opacity="0.35"/>
<rect x="376" y="42" width="84" height="30" rx="4" fill="#4f46e5" fill-opacity="0.35"/>
<rect x="464" y="42" width="84" height="30" rx="4" fill="#4f46e5" fill-opacity="0.35"/>
<text x="98" y="104" font-size="13" fill="#8b93b8" text-anchor="end">round 2</text>
<rect x="112" y="84" width="84" height="30" rx="4" fill="#4f46e5" fill-opacity="0.35"/>
<rect x="200" y="84" width="84" height="30" rx="4" fill="#d97706" fill-opacity="1"/>
<text x="242" y="104" font-size="12" fill="#ffffff" text-anchor="middle">validate</text>
<rect x="288" y="84" width="84" height="30" rx="4" fill="#4f46e5" fill-opacity="0.35"/>
<rect x="376" y="84" width="84" height="30" rx="4" fill="#4f46e5" fill-opacity="0.35"/>
<rect x="464" y="84" width="84" height="30" rx="4" fill="#4f46e5" fill-opacity="0.35"/>
<text x="98" y="146" font-size="13" fill="#8b93b8" text-anchor="end">round 3</text>
<rect x="112" y="126" width="84" height="30" rx="4" fill="#4f46e5" fill-opacity="0.35"/>
<rect x="200" y="126" width="84" height="30" rx="4" fill="#4f46e5" fill-opacity="0.35"/>
<rect x="288" y="126" width="84" height="30" rx="4" fill="#d97706" fill-opacity="1"/>
<text x="330" y="146" font-size="12" fill="#ffffff" text-anchor="middle">validate</text>
<rect x="376" y="126" width="84" height="30" rx="4" fill="#4f46e5" fill-opacity="0.35"/>
<rect x="464" y="126" width="84" height="30" rx="4" fill="#4f46e5" fill-opacity="0.35"/>
<text x="98" y="188" font-size="13" fill="#8b93b8" text-anchor="end">round 4</text>
<rect x="112" y="168" width="84" height="30" rx="4" fill="#4f46e5" fill-opacity="0.35"/>
<rect x="200" y="168" width="84" height="30" rx="4" fill="#4f46e5" fill-opacity="0.35"/>
<rect x="288" y="168" width="84" height="30" rx="4" fill="#4f46e5" fill-opacity="0.35"/>
<rect x="376" y="168" width="84" height="30" rx="4" fill="#d97706" fill-opacity="1"/>
<text x="418" y="188" font-size="12" fill="#ffffff" text-anchor="middle">validate</text>
<rect x="464" y="168" width="84" height="30" rx="4" fill="#4f46e5" fill-opacity="0.35"/>
<text x="98" y="230" font-size="13" fill="#8b93b8" text-anchor="end">round 5</text>
<rect x="112" y="210" width="84" height="30" rx="4" fill="#4f46e5" fill-opacity="0.35"/>
<rect x="200" y="210" width="84" height="30" rx="4" fill="#4f46e5" fill-opacity="0.35"/>
<rect x="288" y="210" width="84" height="30" rx="4" fill="#4f46e5" fill-opacity="0.35"/>
<rect x="376" y="210" width="84" height="30" rx="4" fill="#4f46e5" fill-opacity="0.35"/>
<rect x="464" y="210" width="84" height="30" rx="4" fill="#d97706" fill-opacity="1"/>
<text x="506" y="230" font-size="12" fill="#ffffff" text-anchor="middle">validate</text>
<rect x="570" y="42" width="100" height="198" rx="4" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4"/>
<text x="620" y="137" font-size="12" fill="#0f766e" text-anchor="middle">untouched</text><text x="620" y="154" font-size="12" fill="#0f766e" text-anchor="middle">until the end</text>
<rect x="110" y="259" width="14" height="14" rx="3" fill="#4f46e5" fill-opacity="0.35"/><text x="130" y="270" font-size="13" fill="#8b93b8">fit on these four folds</text>
<rect x="310" y="259" width="14" height="14" rx="3" fill="#d97706"/><text x="330" y="270" font-size="13" fill="#8b93b8">score on this fold</text>
<text x="490" y="270" font-size="13" fill="#8b93b8">CV score = mean of the 5 scores</text>
</svg>