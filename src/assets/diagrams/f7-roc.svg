<circle cx="90.1" cy="85.5" r="5" fill="#d97706"/><text x="96.1" y="109.5" font-size="12" fill="#d97706">t = 0.2</text>
<circle cx="110.3" cy="77.9" r="5" fill="#d97706"/><text x="98.3" y="63.9" font-size="12" fill="#d97706">t = 0.1</text>
