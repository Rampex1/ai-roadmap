<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 335" width="420" height="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>ROC curve of the logistic regression on the imbalanced test set: true positive rate against false positive rate as the threshold moves from 1 down to 0. The curve rises steeply near the left edge and bends towards the top-left corner, well above the diagonal that a random guesser would follow. The area under it is 0.93. Points mark the thresholds 0.5, 0.2 and 0.1: lowering the threshold moves up and to the right</title>
