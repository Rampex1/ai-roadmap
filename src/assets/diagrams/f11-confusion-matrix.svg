<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>A confusion matrix for one group. Rows are the actual outcome, columns the prediction. Actual positive and predicted positive is a true positive, TP; actual positive and predicted negative is a false negative, FN; actual negative and predicted positive is a false positive, FP; actual negative and predicted negative is a true negative, TN. The true positive rate is TP over TP plus FN, a rate within the actual positives row. The false positive rate is FP over FP plus TN, a rate within the actual negatives row. Precision is TP over TP plus FP, a rate within the predicted positive column. The selection rate is TP plus FP over everyone.</title>
  <text x="330" y="26" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">Predicted</text>
  <text x="250" y="52" font-size="14" fill="#64748b" text-anchor="middle">positive (approve)</text>
  <text x="410" y="52" font-size="14" fill="#64748b" text-anchor="middle">negative (reject)</text>
  <text x="40" y="160" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle" transform="rotate(-90 40 160)">Actual</text>
  <text x="160" y="106" font-size="14" fill="#64748b" text-anchor="end">positive</text>
  <text x="160" y="122" font-size="12" fill="#64748b" text-anchor="end">(would repay)</text>
  <text x="160" y="196" font-size="14" fill="#64748b" text-anchor="end">negative</text>
  <text x="160" y="212" font-size="12" fill="#64748b" text-anchor="end">(would default)</text>
  <rect x="172" y="66" width="156" height="80" rx="10" fill="#0f766e"/>
  <text x="250" y="102" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">TP</text>
  <text x="250" y="126" font-size="13" fill="#ffffff" text-anchor="middle">true positive</text>
  <rect x="332" y="66" width="156" height="80" rx="10" fill="#d97706"/>
  <text x="410" y="102" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">FN</text>
  <text x="410" y="126" font-size="13" fill="#ffffff" text-anchor="middle">false negative</text>
  <rect x="172" y="156" width="156" height="80" rx="10" fill="#d97706"/>
  <text x="250" y="192" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">FP</text>
  <text x="250" y="216" font-size="13" fill="#ffffff" text-anchor="middle">false positive</text>
  <rect x="332" y="156" width="156" height="80" rx="10" fill="#0f766e"/>
  <text x="410" y="192" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">TN</text>
  <text x="410" y="216" font-size="13" fill="#ffffff" text-anchor="middle">true negative</text>
  <text x="500" y="112" font-size="14" fill="#4f46e5">TPR = TP / (TP + FN)</text>
  <text x="500" y="202" font-size="14" fill="#4f46e5">FPR = FP / (FP + TN)</text>
  <text x="250" y="262" font-size="14" fill="#4f46e5" text-anchor="middle">precision = TP / (TP + FP)</text>
  <text x="330" y="300" font-size="15" font-weight="700" fill="#d97706" text-anchor="middle">selection rate = (TP + FP) / (TP + FN + FP + TN)</text>
</svg>
