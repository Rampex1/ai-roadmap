<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Vector addition: a = (2, 1) and b = (1, 3) placed tip to tail reach a + b = (3, 4); the same vector b drawn from the origin is dashed</title>
  <defs>
    <marker id="f3va-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#0f766e"/></marker>
    <marker id="f3va-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#4f46e5"/></marker>
    <marker id="f3va-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#d97706"/></marker>
  </defs>
  <!-- grid: origin (60, 260), 50 px per unit -->
  <g stroke="#8b93b8" stroke-width="1" opacity="0.35">
    <path d="M110 40V260M160 40V260M210 40V260M260 40V260M60 210H280M60 160H280M60 110H280M60 60H280"/>
  </g>
  <g stroke="#8b93b8" stroke-width="2">
    <path d="M60 260H290M60 260V30"/>
  </g>
  <g font-size="13" fill="#8b93b8" text-anchor="middle">
    <text x="110" y="278">1</text><text x="160" y="278">2</text><text x="210" y="278">3</text><text x="260" y="278">4</text>
    <text x="48" y="214">1</text><text x="48" y="164">2</text><text x="48" y="114">3</text><text x="48" y="64">4</text>
    <text x="48" y="278">0</text>
  </g>
  <g stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M60 260 L160 210" stroke="#0f766e" marker-end="url(#f3va-teal)"/>
    <path d="M160 210 L210 60" stroke="#4f46e5" marker-end="url(#f3va-indigo)"/>
    <path d="M60 260 L110 110" stroke="#4f46e5" stroke-dasharray="6 6" opacity="0.6" marker-end="url(#f3va-indigo)"/>
    <path d="M60 260 L210 60" stroke="#d97706" marker-end="url(#f3va-orange)"/>
  </g>
  <g font-size="16" font-weight="700">
    <text x="112" y="250" fill="#0f766e">a</text>
    <text x="194" y="150" fill="#4f46e5">b</text>
    <text x="70" y="170" fill="#4f46e5" opacity="0.7">b</text>
    <text x="140" y="80" fill="#d97706">a + b</text>
  </g>
  <g font-size="14" fill="#8b93b8">
    <text x="320" y="70">a = (2, 1)</text>
    <text x="320" y="96">b = (1, 3)</text>
    <text x="320" y="122">a + b = (3, 4)</text>
    <text x="320" y="162">Walk along a, then along b:</text>
    <text x="320" y="182">you end where a + b points.</text>
    <text x="320" y="222">The dashed arrow is the same b,</text>
    <text x="320" y="242">drawn from the origin.</text>
  </g>
</svg>
