<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" width="600" height="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Elliptical contour lines of f equals x squared plus 2 y squared, centred on the origin, and the straight constraint line x plus y equals 3. The constrained minimum (2, 1) is where the line just touches a contour; there the gradient of f and the gradient of the constraint both point the same way, perpendicular to the line. At another point on the line, (3, 0), the gradient of f is not perpendicular to the line, so sliding along the line still lowers f</title>
<defs><marker id="b0lg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#d97706"/></marker><marker id="b0lg-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#0f766e"/></marker></defs>
<g stroke="#8b93b8" stroke-width="1"><line x1="8.0" y1="240.0" x2="560.0" y2="240.0"/><line x1="200.0" y1="366.0" x2="200.0" y2="24.0"/></g>
<g fill="none" stroke="#4f46e5" stroke-width="1.3">
<ellipse cx="200.0" cy="240.0" rx="73.5" ry="52.0"/>
<ellipse cx="200.0" cy="240.0" rx="103.9" ry="73.5"/>
<ellipse cx="200.0" cy="240.0" rx="147.0" ry="103.9" stroke-width="2.4"/>
<ellipse cx="200.0" cy="240.0" rx="180.0" ry="127.3"/>
</g>
<line x1="176.0" y1="36.0" x2="500.0" y2="360.0" stroke="#d97706" stroke-width="2.2"/>
<line x1="320.0" y1="180.0" x2="358.2" y2="141.8" stroke="#d97706" stroke-width="2" marker-end="url(#b0lg-a)"/>
<circle cx="320.0" cy="180.0" r="5" fill="#0f766e"/>
<line x1="380.0" y1="240.0" x2="434.0" y2="240.0" stroke="#0f766e" stroke-width="2" marker-end="url(#b0lg-b)"/>
<circle cx="380.0" cy="240.0" r="4" fill="#0f766e"/>
<g font-size="13" fill="#8b93b8"><text x="342.0" y="200.0" text-anchor="start">optimum (2, 1)</text><text x="364.2" y="139.8" text-anchor="start">∇f ∥ ∇h: both ⟂ to the line</text><text x="388.0" y="232.0" text-anchor="start">(3, 0)</text><text x="428.0" y="262.0" text-anchor="start">∇f not ⟂ to the line:</text><text x="428.0" y="278.0" text-anchor="start">slide along it to lower f</text><text x="508.0" y="356.0" text-anchor="start">x + y = 3</text><text x="10.0" y="24.0" text-anchor="start">contours of f = x² + 2y²</text><text x="560.0" y="258.0" text-anchor="end">x</text><text x="208.0" y="30.0" text-anchor="start">y</text></g>
</svg>
