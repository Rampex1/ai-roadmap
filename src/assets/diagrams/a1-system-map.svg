<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>The ML system loop. Top row, left to right: data sources, feature pipeline, training pipeline, versioned model. The feature pipeline and the model both feed serving, which runs in batch or online. Bottom row, right to left: serving sends scores to a decision in the product; outcomes of decisions are logged as new labels, which flow back into the data sources. A monitoring band underneath watches system health, data quality, drift, model quality and business outcomes.</title>
  <defs>
    <marker id="a1map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <g font-size="14" text-anchor="middle" fill="#ffffff">
    <rect x="20" y="40" width="140" height="60" rx="10" fill="#0f766e"/>
    <text x="90" y="67">data sources</text>
    <text x="90" y="85" font-size="12">records, logs, labels</text>
    <rect x="190" y="40" width="140" height="60" rx="10" fill="#0f766e"/>
    <text x="260" y="67">feature pipeline</text>
    <text x="260" y="85" font-size="12">as of prediction time</text>
    <rect x="360" y="40" width="140" height="60" rx="10" fill="#4f46e5"/>
    <text x="430" y="67">training pipeline</text>
    <text x="430" y="85" font-size="12">train, evaluate, gate</text>
    <rect x="530" y="40" width="130" height="60" rx="10" fill="#4f46e5"/>
    <text x="595" y="67">model artefact</text>
    <text x="595" y="85" font-size="12">versioned</text>
    <rect x="530" y="190" width="130" height="60" rx="10" fill="#4f46e5"/>
    <text x="595" y="217">serving</text>
    <text x="595" y="235" font-size="12">batch or online</text>
    <rect x="360" y="190" width="140" height="60" rx="10" fill="#d97706"/>
    <text x="430" y="217">decision</text>
    <text x="430" y="235" font-size="12">in the product</text>
    <rect x="190" y="190" width="140" height="60" rx="10" fill="#d97706"/>
    <text x="260" y="217">feedback</text>
    <text x="260" y="235" font-size="12">outcomes logged</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a1map-arrow)">
    <line x1="160" y1="70" x2="188" y2="70"/>
    <line x1="330" y1="70" x2="358" y2="70"/>
    <line x1="500" y1="70" x2="528" y2="70"/>
    <line x1="620" y1="100" x2="620" y2="188"/>
    <polyline points="260,100 260,145 565,145 565,188"/>
    <line x1="530" y1="220" x2="502" y2="220"/>
    <line x1="360" y1="220" x2="332" y2="220"/>
    <polyline points="190,220 90,220 90,102"/>
  </g>
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="410" y="139">features at serving time</text>
    <text x="640" y="150" text-anchor="start" transform="rotate(90 640 150)">model</text>
    <text x="516" y="268">scores</text>
    <text x="346" y="268">actions</text>
    <text x="140" y="212">new labels</text>
  </g>
  <rect x="20" y="280" width="640" height="54" rx="10" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="340" y="303" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">monitoring, every step</text>
  <text x="340" y="322" font-size="12" fill="#64748b" text-anchor="middle">system health · data quality · drift · model quality (after labels mature) · business outcome</text>
</svg>
