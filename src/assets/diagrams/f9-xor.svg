<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 290" width="690" height="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Left: the four XOR points in the input square; the two 1s sit on opposite corners, so no straight line separates them from the 0s. Right: after the hidden layer, (0,1) and (1,0) both map to (1,0), while (0,0) and (1,1) map to (0,0) and (2,1), and a single dashed line now separates the 1s from the 0s</title>
<defs><marker id="f9x-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#4f46e5"/></marker></defs>
<rect x="50" y="50" width="200" height="200" fill="none" stroke="#8b93b8" stroke-width="1.2" rx="6"/>
<circle cx="70.0" cy="230.0" r="11" fill="#0f766e"/>
<text x="70.0" y="235.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">0</text>
<circle cx="70.0" cy="70.0" r="11" fill="#d97706"/>
<text x="70.0" y="75.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<circle cx="230.0" cy="230.0" r="11" fill="#d97706"/>
<text x="230.0" y="235.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<circle cx="230.0" cy="70.0" r="11" fill="#0f766e"/>
<text x="230.0" y="75.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">0</text>
<text x="150.0" y="36.0" font-size="15" fill="#8b93b8" text-anchor="middle" font-weight="700">input space: no line works</text>
<text x="150.0" y="270.0" font-size="13" fill="#8b93b8" text-anchor="middle" font-weight="400" font-style="italic">x₁</text>
<text x="38" y="150.0" font-size="13" fill="#8b93b8" text-anchor="middle" font-style="italic" transform="rotate(-90 38 150.0)">x₂</text>
<rect x="440" y="50" width="200" height="200" fill="none" stroke="#8b93b8" stroke-width="1.2" rx="6"/>
<line x1="492.0" y1="210.0" x2="620.0" y2="110.0" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="7 5"/>
<circle cx="472.8" cy="200.0" r="11" fill="#0f766e"/>
<text x="472.8" y="205.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">0</text>
<text x="488.8" y="188.0" font-size="12" fill="#8b93b8" text-anchor="start" font-weight="400">(0,0)</text>
<circle cx="536.8" cy="200.0" r="11" fill="#d97706"/>
<text x="536.8" y="205.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="552.8" y="188.0" font-size="12" fill="#8b93b8" text-anchor="start" font-weight="400">(0,1) and (1,0)</text>
<circle cx="600.8" cy="100.0" r="11" fill="#0f766e"/>
<text x="600.8" y="105.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">0</text>
<text x="616.8" y="88.0" font-size="12" fill="#8b93b8" text-anchor="start" font-weight="400">(1,1)</text>
<text x="540.0" y="36.0" font-size="15" fill="#8b93b8" text-anchor="middle" font-weight="700">hidden space: one line works</text>
<text x="540.0" y="270.0" font-size="13" fill="#8b93b8" text-anchor="middle" font-weight="400" font-style="italic">h₁ = ReLU(x₁ + x₂)</text>
<text x="428" y="150.0" font-size="13" fill="#8b93b8" text-anchor="middle" font-style="italic" transform="rotate(-90 428 150.0)">h₂ = ReLU(x₁ + x₂ − 1)</text>
<line x1="268.0" y1="150.0" x2="390.0" y2="150.0" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#f9x-a)"/>
<text x="329.0" y="140.0" font-size="13" fill="#4f46e5" text-anchor="middle" font-weight="700">hidden layer</text>
</svg>
