<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A single neuron. Three inputs x1, x2, x3 are multiplied by weights w1, w2, w3 and summed with a bias b to give z. An activation function g turns z into the output a</title>
<defs><marker id="f9n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#4f46e5"/></marker><marker id="f9n-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#d97706"/></marker></defs>
<circle cx="60.0" cy="60.0" r="24" fill="#0f766e"/>
<text x="60.0" y="66.0" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">x₁</text>
<line x1="86.0" y1="60.0" x2="296.0" y2="120.0" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#f9n-a)"/>
<text x="190.0" y="82.0" font-size="15" fill="#4f46e5" text-anchor="middle" font-weight="700">w₁</text>
<circle cx="60.0" cy="140.0" r="24" fill="#0f766e"/>
<text x="60.0" y="146.0" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">x₂</text>
<line x1="86.0" y1="140.0" x2="296.0" y2="140.0" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#f9n-a)"/>
<text x="190.0" y="132.0" font-size="15" fill="#4f46e5" text-anchor="middle" font-weight="700">w₂</text>
<circle cx="60.0" cy="220.0" r="24" fill="#0f766e"/>
<text x="60.0" y="226.0" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">x₃</text>
<line x1="86.0" y1="220.0" x2="296.0" y2="160.0" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#f9n-a)"/>
<text x="190.0" y="182.0" font-size="15" fill="#4f46e5" text-anchor="middle" font-weight="700">w₃</text>
<circle cx="340.0" cy="140.0" r="42" fill="#4f46e5"/>
<text x="340.0" y="133.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">z = Σ wᵢxᵢ</text>
<text x="340.0" y="155.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">+ b</text>
<line x1="384.0" y1="140.0" x2="466.0" y2="140.0" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#f9n-a)"/>
<rect x="470" y="112" width="110" height="56" rx="10" fill="#d97706"/>
<text x="525.0" y="145.6" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">a = g(z)</text>
<line x1="582.0" y1="140.0" x2="650.0" y2="140.0" stroke="#d97706" stroke-width="2.5" marker-end="url(#f9n-b)"/>
<text x="670.0" y="146.0" font-size="18" fill="#d97706" text-anchor="middle" font-weight="700">a</text>
<text x="340.0" y="225.0" font-size="14" fill="#8b93b8" text-anchor="middle" font-weight="400">weighted sum plus bias</text>
<text x="525.0" y="200.0" font-size="14" fill="#8b93b8" text-anchor="middle" font-weight="400">activation</text>
<text x="60.0" y="262.0" font-size="14" fill="#8b93b8" text-anchor="middle" font-weight="400">inputs</text>
</svg>
