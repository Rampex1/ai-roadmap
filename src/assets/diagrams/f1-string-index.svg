<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>String indexing: positive indices count from 0 at the left, negative indices count from -1 at the right</title>
  <text x="24" y="54" font-size="14" font-weight="600" fill="#0f766e">index</text>
  <text x="24" y="176" font-size="14" font-weight="600" fill="#b45309">negative</text>
  <text x="160" y="54" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e">0</text>
  <rect x="128" y="72" width="64" height="72" rx="6" fill="#4f46e5" stroke="#ffffff" stroke-width="2"/>
  <text x="160" y="119" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff" font-family="ui-monospace, Menlo, Consolas, monospace">P</text>
  <text x="160" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">-6</text>
  <text x="224" y="54" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e">1</text>
  <rect x="192" y="72" width="64" height="72" rx="6" fill="#4f46e5" stroke="#ffffff" stroke-width="2"/>
  <text x="224" y="119" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff" font-family="ui-monospace, Menlo, Consolas, monospace">Y</text>
  <text x="224" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">-5</text>
  <text x="288" y="54" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e">2</text>
  <rect x="256" y="72" width="64" height="72" rx="6" fill="#4f46e5" stroke="#ffffff" stroke-width="2"/>
  <text x="288" y="119" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff" font-family="ui-monospace, Menlo, Consolas, monospace">T</text>
  <text x="288" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">-4</text>
  <text x="352" y="54" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e">3</text>
  <rect x="320" y="72" width="64" height="72" rx="6" fill="#4f46e5" stroke="#ffffff" stroke-width="2"/>
  <text x="352" y="119" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff" font-family="ui-monospace, Menlo, Consolas, monospace">H</text>
  <text x="352" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">-3</text>
  <text x="416" y="54" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e">4</text>
  <rect x="384" y="72" width="64" height="72" rx="6" fill="#4f46e5" stroke="#ffffff" stroke-width="2"/>
  <text x="416" y="119" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff" font-family="ui-monospace, Menlo, Consolas, monospace">O</text>
  <text x="416" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">-2</text>
  <text x="480" y="54" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e">5</text>
  <rect x="448" y="72" width="64" height="72" rx="6" fill="#4f46e5" stroke="#ffffff" stroke-width="2"/>
  <text x="480" y="119" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff" font-family="ui-monospace, Menlo, Consolas, monospace">N</text>
  <text x="480" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">-1</text>
  <path d="M192 192 v10 h192 v-10" fill="none" stroke="#8b93b8" stroke-width="2"/>
  <text x="288" y="226" text-anchor="middle" font-size="14" fill="#8b93b8" font-family="ui-monospace, Menlo, Consolas, monospace">word[1:4] is "YTH"</text>
</svg>
