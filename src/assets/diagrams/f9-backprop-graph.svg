<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 275" width="720" height="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Computational graph of the worked example: x = 1 goes to z = w1 x + b1 = 0.5, then h = tanh z = 0.4621, then y hat = w2 h + b2 = 1.0242, then L = (y hat minus y) squared = 1.0491. Backward, the gradients are dL/dy hat = 2.0485, dL/dh = 4.0969 and dL/dz = 3.2220, giving dL/dw2 = 0.9466 and dL/dw1 = 3.2220</title>
<defs><marker id="f9b-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#4f46e5"/></marker><marker id="f9b-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#d97706"/></marker></defs>
<rect x="25.0" y="110" width="70" height="46" rx="10" fill="#0f766e"/>
<text x="60.0" y="137.9" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">x = 1</text>
<rect x="130.0" y="110" width="120" height="46" rx="10" fill="#4f46e5"/>
<text x="190.0" y="137.9" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">z = w₁x + b₁</text>
<rect x="280.0" y="110" width="120" height="46" rx="10" fill="#4f46e5"/>
<text x="340.0" y="137.9" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">h = tanh z</text>
<rect x="430.0" y="110" width="120" height="46" rx="10" fill="#4f46e5"/>
<text x="490.0" y="137.9" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">ŷ = w₂h + b₂</text>
<rect x="580.0" y="110" width="120" height="46" rx="10" fill="#d97706"/>
<text x="640.0" y="137.9" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">L = (ŷ − y)²</text>
<text x="190.0" y="96.0" font-size="14" fill="#4f46e5" text-anchor="middle" font-weight="700">0.5</text>
<text x="190.0" y="186.0" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">∂L/∂z = 3.2220</text>
<text x="340.0" y="96.0" font-size="14" fill="#4f46e5" text-anchor="middle" font-weight="700">0.4621</text>
<text x="340.0" y="186.0" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">∂L/∂h = 4.0969</text>
<text x="490.0" y="96.0" font-size="14" fill="#4f46e5" text-anchor="middle" font-weight="700">1.0242</text>
<text x="490.0" y="186.0" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">∂L/∂ŷ = 2.0485</text>
<text x="640.0" y="96.0" font-size="14" fill="#4f46e5" text-anchor="middle" font-weight="700">1.0491</text>
<text x="640.0" y="186.0" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">∂L/∂L = 1</text>
<line x1="97.0" y1="124.0" x2="128.0" y2="124.0" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#f9b-f)"/>
<line x1="128.0" y1="144.0" x2="97.0" y2="144.0" stroke="#d97706" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#f9b-b)"/>
<line x1="252.0" y1="124.0" x2="278.0" y2="124.0" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#f9b-f)"/>
<line x1="278.0" y1="144.0" x2="252.0" y2="144.0" stroke="#d97706" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#f9b-b)"/>
<line x1="402.0" y1="124.0" x2="428.0" y2="124.0" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#f9b-f)"/>
<line x1="428.0" y1="144.0" x2="402.0" y2="144.0" stroke="#d97706" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#f9b-b)"/>
<line x1="552.0" y1="124.0" x2="578.0" y2="124.0" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#f9b-f)"/>
<line x1="578.0" y1="144.0" x2="552.0" y2="144.0" stroke="#d97706" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#f9b-b)"/>
<text x="20.0" y="222.0" font-size="13" fill="#d97706" text-anchor="start" font-weight="400">local factors:</text>
<text x="129.0" y="222.0" font-size="13" fill="#d97706" text-anchor="middle" font-weight="400">× x</text>
<text x="269.0" y="222.0" font-size="13" fill="#d97706" text-anchor="middle" font-weight="400">× (1 − h²)</text>
<text x="419.0" y="222.0" font-size="13" fill="#d97706" text-anchor="middle" font-weight="400">× w₂</text>
<text x="569.0" y="222.0" font-size="13" fill="#d97706" text-anchor="middle" font-weight="400">× 2(ŷ − y)</text>
<text x="190.0" y="56.0" font-size="13" fill="#8b93b8" text-anchor="middle" font-weight="400">w₁ = 0.5, b₁ = 0</text>
<text x="490.0" y="56.0" font-size="13" fill="#8b93b8" text-anchor="middle" font-weight="400">w₂ = 2, b₂ = 0.1</text>
<text x="640.0" y="56.0" font-size="13" fill="#8b93b8" text-anchor="middle" font-weight="400">y = 0</text>
<text x="20.0" y="26.0" font-size="14" fill="#8b93b8" text-anchor="start" font-weight="700">forward values (top), gradients ∂L/∂node (bottom)</text>
<text x="20.0" y="258.0" font-size="14" fill="#d97706" text-anchor="start" font-weight="700">weights: ∂L/∂w₂ = ∂L/∂ŷ · h = 0.9466,   ∂L/∂w₁ = ∂L/∂z · x = 3.2220</text>
</svg>
