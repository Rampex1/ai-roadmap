<rect x="164" y="206" width="96" height="48" rx="10" fill="#d97706"/>
<text x="212" y="236" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">V = XW_V</text>
<line x1="262" y1="76" x2="318" y2="112" stroke="#8b93b8" stroke-width="2" marker-end="url(#f10a-a)"/>
<line x1="262" y1="150" x2="318" y2="140" stroke="#8b93b8" stroke-width="2" marker-end="url(#f10a-a)"/>
<text x="381" y="40" font-size="14" fill="#8b93b8" text-anchor="middle">scores QKᵀ / √d_k</text>
<text x="381" y="58" font-size="14" fill="#8b93b8" text-anchor="middle">then causal mask</text>
