<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Scaled dot-product self-attention with a causal mask. X is projected to Q, K and V. Q times K transposed over the square root of d_k gives a 3 by 3 score grid whose upper triangle is masked. A row-wise softmax gives the weights A, and A times V gives the output</title>
