<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Left: 36 noisy training points from a sine-shaped curve with three polynomial fits. Degree 1 is a straight line that misses the curve (underfitting). Degree 3 follows the curve. Degree 15 wiggles through the points and swings wildly between them (overfitting). Right: mean squared error against polynomial degree on a log scale. Training error keeps falling as the degree grows. Validation error falls, bottoms out around degree 6, then rises steeply: the U shape of the bias-variance trade-off</title>
